<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14101f">
  <title>Rune</title>
  <meta name="description" content="Ett runbaserat roguelike-symbolspel: placera runor på altaret, bilda mönster och hitta sjuka kombinationer med 150 reliker.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="side">
      <div class="logo" id="logo">ᚱ RUNE</div>
      <div id="blindbox" class="panel"></div>
      <div id="scorebox" class="panel">
        <div class="lbl">Poäng</div>
        <div id="roundscore" class="big">0</div>
        <div id="calc"><span id="chips" class="chips">0</span><span class="x">×</span><span id="mult" class="mult">0</span></div>
        <div id="patname"></div>
      </div>
      <div id="stats" class="panel">
        <div class="stat"><span class="lbl">Kast</span><b id="casts" class="blue">4</b></div>
        <div class="stat"><span class="lbl">Byten</span><b id="discards" class="red">3</b></div>
        <div class="stat"><span class="lbl">Mynt</span><b id="money" class="gold">$4</b></div>
        <div class="stat"><span class="lbl">Cirkel</span><b id="ante">1/8</b></div>
      </div>
      <div id="sidebtns">
        <button data-act="patterns">Mönster</button>
        <button data-act="bag">Påse</button>
        <button data-act="codex">Kodex</button>
        <button data-act="menu">Meny</button>
      </div>
    </aside>
    <main id="main">
      <div id="toprow">
        <div id="relics" class="slots"></div>
        <div id="cons" class="slots"></div>
      </div>
      <div id="stage">
        <div id="boardwrap"><div id="board"></div></div>
        <div id="preview"></div>
        <div id="hand"></div>
        <div id="actions">
          <button id="btn-discard" class="btn red">Byt <small id="discard-n"></small></button>
          <button id="btn-sort" class="btn ghost" title="Sortera handen">⇅</button>
          <button id="btn-hint" class="btn ghost" title="Föreslå ett drag">💡</button>
          <button id="btn-undo" class="btn ghost" title="Ta tillbaka placerade runor">↶</button>
          <button id="btn-cast" class="btn blue">Kasta</button>
        </div>
      </div>
      <div id="screen" class="hidden"></div>
    </main>
  </div>
  <div id="fx"></div>
  <div id="tip" class="hidden"></div>
  <div id="modal" class="hidden"><div class="modal-card"><button class="close" data-act="close">✕</button><div id="modal-body"></div></div></div>
  <div id="toasts"></div>
  <script src="js/core.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/relics.js"></script>
  <script src="js/items.js"></script>
  <script src="js/score.js"></script>
  <script src="js/game.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
