<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1430" />
    <title>Tower Merge – Last Stand</title>
    <!-- YouTube Playables SDK: must load before any game code. It is a no-op outside Playables. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <style>
      @font-face { font-family: 'KenneyFuture'; src: url('./assets/fonts/kenney-future.ttf') format('truetype'); font-display: block; }
      @font-face { font-family: 'KenneyFutureNarrow'; src: url('./assets/fonts/kenney-future-narrow.ttf') format('truetype'); font-display: block; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f1430; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { touch-action: none; }
      /* Shown until BootScene removes it (first Phaser frame). */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; background: #0f1430; }
      #boot i { width: 44px; height: 44px; border-radius: 50%; border: 5px solid rgba(255, 211, 94, 0.2); border-top-color: #ffd35e; animation: tm-spin 0.8s linear infinite; }
      @keyframes tm-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><i></i></div>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
