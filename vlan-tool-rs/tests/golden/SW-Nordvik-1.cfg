!
! Genererad av vlantool <version> – ändra i CSV-filerna, inte här
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-Nordvik-1
!
enable secret CHANGE_ME
!
no ip domain-lookup
ip domain-name nordvik.example
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
!
username drift privilege 15 secret CHANGE_ME
login block-for 120 attempts 3 within 60
!
clock timezone CET 1 0
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 30
 name GAST
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
spanning-tree vlan 10,20,30,99,999 priority 4096
!
interface Vlan99
 description Hantering
 ip address 192.168.1.196 255.255.255.192
 no shutdown
!
ip default-gateway 192.168.1.193
!
interface GigabitEthernet0/1
 description Port mot R-Nordvik-1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 no shutdown
!
interface GigabitEthernet0/2
 description Port mot SW-Nordvik-2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 no shutdown
!
interface FastEthernet0/1
 description Port mot AccessPoint
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface FastEthernet0/2
 description Port mot NTP-server
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
logging buffered 16384
logging trap informational
logging host 192.168.1.17
ntp server 192.168.1.16
!
access-list 10 permit 192.168.1.192 0.0.0.63
!
banner motd ^Endast behorig personal. All aktivitet loggas.^
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 login local
 access-class 10 in
line vty 5 15
 exec-timeout 10 0
 transport input ssh
 login local
 access-class 10 in
!
end
