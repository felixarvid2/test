logging buffered 16384
logging trap informational
logging host 192.168.1.17
ntp server 192.168.1.16
!
access-list 10 permit 192.168.1.192 0.0.0.63
!
banner motd ^Endast behorig personal. All aktivitet loggas.^
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 login local
 access-class 10 in
line vty 5 15
 exec-timeout 10 0
 transport input ssh
 login local
 access-class 10 in
!
end
