!
service timestamps debug datetime msec
service timestamps log datetime msec
!
! FEL: hostname saknas
!
no ip domain-lookup
ip domain-name nordvik.example
! FEL: 'ip ssh version 2' saknas
!
username drift secret CHANGE_ME
!
ip dhcp excluded-address 192.168.1.2 192.168.1.11
ip dhcp excluded-address 192.168.1.66 192.168.1.75
ip dhcp excluded-address 192.168.1.130 192.168.1.139
ip dhcp excluded-address 192.168.1.194 192.168.1.203
!
ip dhcp pool KONTOR
 network 192.168.1.0 255.255.255.192
 default-router 192.168.1.1
 dns-server 192.168.1.1
ip dhcp pool EKONOMI
 network 192.168.1.64 255.255.255.192
 default-router 192.168.1.65
 dns-server 192.168.1.1
ip dhcp pool GAST
 network 192.168.1.128 255.255.255.192
 default-router 192.168.1.129
 dns-server 192.168.1.1
ip dhcp pool DRIFT
 network 192.168.1.192 255.255.255.192
 default-router 192.168.1.193
 dns-server 192.168.1.1
!
interface GigabitEthernet0/0
 description Trunk mot SW-Nordvik-1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description KONTOR
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/0.20
 description EKONOMI
 encapsulation dot1Q 20
 ip address 192.168.1.65 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/0.30
 description GAST
 encapsulation dot1Q 30
 ip address 192.168.1.129 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/0.99
 description DRIFT
 encapsulation dot1Q 99
 ip address 192.168.1.193 255.255.255.192
 ip nat inside
!
interface GigabitEthernet0/0.999
 description NATIVE
 encapsulation dot1Q 999 native
!
interface GigabitEthernet0/1
 description Uplink mot Operator
 ip address 203.0.113.10 255.255.255.0
 ip nat outside
 no shutdown
!
ip nat inside source list 1 interface GigabitEthernet0/1 overload
access-list 1 permit 192.168.1.0 0.0.0.255
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
logging buffered 16384
logging host 192.168.1.17
ntp server 192.168.1.16
!
line con 0
 logging synchronous
! FEL: 'transport input ssh' saknas och telnet ar tillatet pa vty
line vty 0 4
 transport input ssh telnet
 login local
!
end