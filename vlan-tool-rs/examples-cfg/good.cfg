!
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname SW-Nordvik-2
!
no ip domain-lookup
ip domain-name nordvik.example
ip ssh version 2
!
username drift secret CHANGE_ME
!
vtp mode transparent
!
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 30
 name GAST
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
interface vlan 99
 ip address 192.168.1.195 255.255.255.192
 no shutdown
!
ip default-gateway 192.168.1.193
!
interface Gi0/1
 description Port mot SW-Nordvik-1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 no shutdown
!
interface Fa0/1
 description Port mot Dator-1
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Fa0/2
 description Port mot Dator-2
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Fa0/3
 description Port mot Dator-3
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Fa0/4
 description Port mot Dator-4
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Fa0/5
 description Port mot Dator-5
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Fa0/6
 description Port mot Dator-6
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Fa0/7
 description Port mot Dator-7
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Fa0/8
 description Port mot Dator-8
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Fa0/9
 description Port mot Dator-9
 switchport mode access
 switchport access vlan 30
 no shutdown
!
interface Fa0/10
 description Port mot Dator-10
 switchport mode access
 switchport access vlan 30
 no shutdown
!
interface Fa0/11
 description Port mot Dator-11
 switchport mode access
 switchport access vlan 30
 no shutdown
!
interface Fa0/12
 description Port mot Dator-12
 switchport mode access
 switchport access vlan 30
 no shutdown
!
interface Fa0/13
 description Port mot Dator-13
 switchport mode access
 switchport access vlan 99
 no shutdown
!
interface Fa0/14
 description Port mot Dator-14
 switchport mode access
 switchport access vlan 99
 no shutdown
!
logging buffered 16384
logging host 192.168.1.17
ntp server 192.168.1.16
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
 login local
line vty 5 15
 transport input ssh
 login local
!
end
