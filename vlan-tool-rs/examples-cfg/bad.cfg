!
service timestamps debug datetime msec
service timestamps log datetime msec
!
! FEL: hostname saknas
!
no ip domain-lookup
ip domain-name nordvik.example
! FEL: 'ip ssh version 2' saknas
!
username drift secret CHANGE_ME
!
spanning-tree mode rapid-pvst
!
! FEL: vlan 30 ar inte definierat (men anvands pa Fa0/3)
vlan 10
 name KONTOR
vlan 20
 name EKONOMI
vlan 99
 name DRIFT
vlan 999
 name NATIVE
!
interface FastEthernet0/1
 description Port mot Dator-1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/2
 description Port mot Dator-2
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet0/3
 description Port mot Dator-3
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface FastEthernet0/4
 description Port mot Dator-4
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
!
! FEL: trunken har native vlan 1 och tillater alla vlan
interface GigabitEthernet0/0
 description Port mot SW-Nordvik-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan all
!
interface Vlan99
 description Hantering
 ip address 192.168.1.195 255.255.255.192
 no shutdown
!
ip default-gateway 192.168.1.193
!
logging buffered 16384
logging host 192.168.1.17
!
ntp server 192.168.1.16
!
line con 0
 logging synchronous
! FEL: 'transport input ssh' saknas och telnet ar tillatet pa vty
line vty 0 15
 transport input ssh telnet
 login local
!
end