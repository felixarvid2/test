[package]
name = "vlantool"
version = "0.1.0"
edition = "2024"
description = "Genererar och granskar Cisco IOS-konfigar från CSV-filer (Rust-version av grupparbete-python-)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "color"] }
crossterm = "0.28"
csv = "1.4.0"
owo-colors = "4"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2"
toml = "0.8"
