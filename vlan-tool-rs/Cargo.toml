[package]
name = "vlantool"
version = "0.2.0"
edition = "2024"
description = "Genererar och granskar Cisco IOS-konfigar från CSV-filer (Rust-version av grupparbete-python-)"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:dirs"]

[[bin]]
name = "vlantool"
path = "src/main.rs"

[[bin]]
name = "vlantool-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive", "color"] }
crossterm = "0.28"
csv = "1.4.0"
dirs = { version = "7.0.0", optional = true }
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.37.0", optional = true }
owo-colors = "4"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2"
toml = "0.8"
