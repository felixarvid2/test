<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kortdemo</title>
<link rel="stylesheet" href="../css/cards.css">
<style>
  @font-face { font-family: "PressStart2P"; src: url(../assets/font/PressStart2P.ttf); }
  html, body { margin: 0; min-height: 100%; background: #0b0806; color: #e8d9b0; font-family: "PressStart2P", monospace; }
  main { padding: 20px 16px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; color: #d8442a; margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button.d { font: inherit; font-size: 10px; padding: 12px 16px; background: #5a1a10; color: #ffe9a8; border: 3px solid #d8a24a; cursor: pointer; }
  button.d:hover { background: #7c2616; }
  #log { font-size: 8px; line-height: 2; color: #c9a87a; white-space: pre-wrap; min-height: 120px; border: 2px solid #3a2c1e; padding: 10px; }
  #state { font-size: 9px; color: #ffd24a; }
</style>
</head>
<body>
<main>
  <h1>KORTDEMO</h1>
  <div id="state"></div>
  <div class="row">
    <button class="d" id="b-draft">DRAFT (3 KORT)</button>
    <button class="d" id="b-draft5">DRAFT (5 KORT)</button>
    <button class="d" id="b-chest">KISTA (TOAST)</button>
    <button class="d" id="b-shop">BUTIK</button>
    <button class="d" id="b-souls">SJÄLSBUTIK</button>
    <button class="d" id="b-deck">KORTLEK</button>
    <button class="d" id="b-draftx">DRAFT MED SYNERGI, FÖRVISA OCH NYA KORT</button>
    <button class="d" id="b-codex">KORTARKIV</button>
  </div>
  <div id="log">Tangenter 1-9, pilar, Enter och Esc fungerar i fönstren. Spelkänslig tangent-test: tryck på tangenter medan ett fönster är öppet och se om de loggas nedan.</div>
</main>
<script src="../js/cards.js"></script>
<script src="../js/cardui.js"></script>
<script>
(() => {
  // Enkel seedad rng
  let s = 12345;
  const rng = { next() { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }, pick(a) { return a[Math.floor(this.next() * a.length)]; },
    weighted(a, fn) { let t = 0; for (const x of a) t += fn(x); let r = this.next() * t; for (const x of a) { r -= fn(x); if (r <= 0) return x; } return a[a.length - 1]; } };
  const q = new URLSearchParams(location.search);
  const state = { owned: ['slipstenen', 'slipstenen', 'kantvakten', 'glodkol', 'fyrklovern', 'offerdolken', 'askkungen', 'stenhjartat', 'lagerelden', 'prisma', 'halvmane', 'korsriddaren', 'offerkniven', 'grodan'], gold: 140, depth: 1, souls: 55 };
  // sedda kort (för NY-märket och kortarkivet): ägda plus några till
  const seen = new Set(state.owned.concat(['benflojt', 'manesilver', 'guldbaggen', 'ekot', 'vampyren', 'ouroboros', 'pakt_pistol', 'studskulan']));
  const unlocked = new Set(Cards.ALL.map(c => c.id)); // demo: allt upplåst
  const $ = id => document.getElementById(id);
  const log = t => { $('log').textContent = t + '\n' + $('log').textContent; };
  const stat = () => { $('state').textContent = 'GULD ' + state.gold + ' · KORT ' + state.owned.length + ' · DJUP ' + state.depth; };
  stat();
  // Tangenter som når sidan loggas, för att se att UI:t stoppar dem.
  addEventListener('keydown', e => log('tangent nådde sidan: ' + e.key));

  const draw = n => Cards.draw(rng, n, { owned: state.owned, depth: state.depth, luck: Cards.computeMods(state.owned).luck, unlocked });
  function draft(n) {
    CardUI.draft(draw(n), { title: 'VÄLJ ETT KORT', subtitle: 'FÖRSTA VÅNINGEN RENSAD. DÖDEN GER DIG EN GÅVA.', owned: state.owned }, c => {
      if (c) { state.owned.push(c.id); log('valde ' + c.name); } else log('hoppade över');
      stat();
    });
  }
  function shopItems() {
    const disc = Cards.computeMods(state.owned).shopDiscount;
    const items = draw(3).map(c => ({ kind: 'card', card: c, price: Cards.price(c, state.depth, disc) }));
    items.push({ kind: 'health', price: 30 }, { kind: 'armor', price: 25 }, { kind: 'ammo', price: 20 }, { kind: 'reroll', price: 15 });
    return items;
  }
  function shop() {
    CardUI.shop(shopItems(), state.gold, item => {
      if (item.price > state.gold) return { ok: false, gold: state.gold };
      state.gold -= item.price;
      if (item.kind === 'card') state.owned.push(item.card.id);
      log('köpte ' + (item.card ? item.card.name : item.kind));
      stat();
      return item.kind === 'reroll' ? { ok: true, gold: state.gold, items: shopItems() } : { ok: true, gold: state.gold };
    }, () => log('lämnade butiken'));
  }
  function souls() {
    const items = Cards.ALL.filter(c => c.unlock).slice(0, 8).map((c, i) => ({ kind: 'card', card: c, price: c.unlock, owned: i === 1 }));
    CardUI.shop(items, state.souls, item => { state.souls -= item.price; log('låste upp ' + item.card.name); return { ok: true, gold: state.souls }; }, null, { title: 'SJÄLSALTARET', currency: 'SJÄLAR', currencyColor: '#b8a0ff' });
  }
  $('b-draft').onclick = () => draft(3);
  $('b-draft5').onclick = () => draft(5);
  $('b-chest').onclick = () => { const c = draw(1)[0]; state.owned.push(c.id); stat(); CardUI.toast(c); };
  $('b-shop').onclick = shop;
  $('b-souls').onclick = souls;
  $('b-deck').onclick = () => CardUI.deck(state.owned);
  // draft med alla nya val: synergi- och NY-märken, förvisa (en gång) och nya kort för guld
  function draftX(cards) {
    cards = cards || draw(3);
    const shown = () => cards.forEach(c => seen.add(c.id));
    CardUI.draft(cards, {
      title: 'VÅNING 2 KLARAD', subtitle: 'VÄLJ ETT KORT', skipLabel: 'HOPPA ÖVER (+25 GULD)',
      owned: state.owned, seen: new Set(seen),
      banish: c => { const rep = Cards.draw(rng, 1, { owned: state.owned.concat(cards.map(x => x.id)), depth: state.depth, unlocked })[0] || null; if (rep) { cards = cards.map(x => x === c ? rep : x); log('förvisade ' + c.name + ' -> ' + rep.name); } return rep; },
      reroll: { price: 25, gold: state.gold, onReroll: () => { if (state.gold < 25) return null; state.gold -= 25; stat(); cards = draw(3); log('nya kort'); return cards; } },
    }, c => { shown(); if (c) { state.owned.push(c.id); log('valde ' + c.name); } else log('hoppade över'); stat(); });
  }
  $('b-draftx').onclick = () => draftX();
  $('b-codex').onclick = () => CardUI.codex(Cards.ALL, { seen, owned: new Set(state.owned), unlocked: new Set(Cards.ALL.filter(c => !c.unlock || c.unlock < 30).map(c => c.id)) }, () => log('stängde arkivet'));
  const auto = q.get('auto');
  if (auto === 'draft') draft(3); else if (auto === 'draft5') draft(5); else if (auto === 'shop') shop(); else if (auto === 'souls') souls(); else if (auto === 'deck') CardUI.deck(state.owned);
  else if (auto === 'legend') CardUI.draft(['tomhetsstenen', 'gravvaktaren', 'ouroboros', 'askkungen', 'vaktarbanan'].map(Cards.byId), { title: 'LEGENDARISKA TESTKORT' }, () => {})
  else if (auto === 'draftx') draftX(['bronda_runan', 'spakvinnan', 'prismakronan'].map(Cards.byId));
  else if (auto === 'curse') draftX(['maskerna', 'ansiktslos', 'feltrycket'].map(Cards.byId));
  else if (auto === 'codex') $('b-codex').click();
  else if (auto === 'toast') { CardUI.toast(Cards.byId('forbannade_kronan')); CardUI.toast(Cards.byId('ouroboros')); }
  window.__demo = { state, draw, seen, draftX };
})();
</script>
</body>
</html>
