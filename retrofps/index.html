<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krypta – Retro FPS</title>
<style>
  @font-face { font-family: "PressStart2P"; src: url(assets/font/PressStart2P.ttf); }
  html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; font-family: "PressStart2P", monospace; color: #e8d9b0; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; width: min(100vw, 160vh); height: min(62.5vw, 100vh); background: #000; outline: none; cursor: crosshair; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(#2a1810, #0b0806 70%); text-align: center; padding: 16px; }
  h1 { font-size: clamp(24px, 6vw, 56px); margin: 0; color: #d8442a; text-shadow: 4px 4px #000, 0 0 24px #6a1408; letter-spacing: 4px; }
  p { font-size: clamp(8px, 1.4vw, 12px); line-height: 2; margin: 0; color: #c9a87a; max-width: 720px; }
  button { font: inherit; font-size: 14px; padding: 14px 26px; background: #5a1a10; color: #ffe9a8; border: 3px solid #d8a24a; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled) { background: #7c2616; }
  #status { font-size: 10px; color: #8a7550; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" tabindex="0"></canvas></div>
<div id="title">
  <h1>KRYPTA</h1>
  <p>Skelett och vampyrer har tagit över borgen. Rensa tre nivåer och ta dig ut genom grinden.</p>
  <p>WASD / PILAR = rör dig · MUS = sikta · VÄNSTERKLICK / F = skjut · E / MELLANSLAG = öppna dörr · SHIFT = spring<br>1-4 / Q / HJUL = byt vapen · M = karta · N = ljud av/på</p>
  <button id="start" disabled>START</button>
  <div id="status">Laddar…</div>
</div>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
