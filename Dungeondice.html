mpas (kopior som lyfter mot handnamnet) */
.b_gd.die{position:fixed;margin:0;z-index:150;pointer-events:none;animation:none;box-sizing:border-box}
.b_gd.die.b_in{animation:b_gdIn .95s ease-in forwards}
.b_gd.die.b_out{animation:b_gdOut .8s ease-in forwards}
@keyframes b_gdIn{0%{scale:1;translate:0 0;opacity:1}25%{scale:1.14;translate:0 -6px;opacity:1;box-shadow:0 0 0 4px var(--bl-gold),0 0 22px var(--bl-gold)}55%{scale:1.1;translate:0 -8px;opacity:1;box-shadow:0 0 0 4px var(--bl-gold),0 0 22px var(--bl-gold)}100%{scale:.45;translate:0 var(--fy);opacity:0}}
@keyframes b_gdOut{0%{opacity:1;filter:none}25%{opacity:.7;filter:brightness(.55) saturate(.4)}60%{opacity:.5;filter:brightness(.55) saturate(.4)}100%{opacity:0;translate:0 10px}}
/* 406 Tärningens värde, färg och mod står i tooltip och aria-label (sätts i skriptet) */
/* 407 Sortera-knappen glider tärningarna på plats med en enda engångsanimation (Web Animations i skriptet) */
/* 408 Tomt läge i tärningsbrickan: streckade platser medan nästa hand delas ut */
.b_empty{display:flex;flex-wrap:wrap;justify-content:center;gap:inherit;width:100%;position:relative;z-index:1}
.b_empty i{width:clamp(64px,15vw,84px);aspect-ratio:1/1;border:3px dashed rgba(243,236,220,.28);border-radius:16px;box-sizing:border-box}
.b_empty span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-pixel);font-size:14px;letter-spacing:1px;color:var(--bl-cream);text-shadow:0 2px 0 var(--bl-ink)}
/* 409 Bust: grå stämpel över handnamnet och dämpad poängpanel */
.b_bust{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;font-family:var(--font-pixel);font-size:28px;font-weight:700;letter-spacing:4px;color:#b9c2c6;background:rgba(27,36,41,.92);
  border:4px solid #7b878d;border-radius:10px;padding:0 14px;box-shadow:0 5px 0 var(--bl-ink);animation:b_bust 1.6s ease-out forwards}
@keyframes b_bust{0%{transform:translate(-50%,-50%) scale(2.2) rotate(-14deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:0}}
#score-display.b_bustd .total{animation:b_dim 1.6s ease-out}
@keyframes b_dim{0%,70%{opacity:.45}100%{opacity:1}}
/* 410 Progress-fältet blixtrar till en gång när ett delmål (25/50/75/100 procent) passeras */
.b_pflash{position:absolute;top:0;bottom:0;left:calc(var(--p) - 46px);width:46px;z-index:4;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));animation:b_pflash .8s ease-out forwards}
.b_pflash b{font-family:var(--font-pixel);font-size:10px;color:var(--bl-ink);padding-right:4px}
.b_pflash.goal{left:0;width:100%;background:linear-gradient(90deg,rgba(240,196,74,.2),rgba(255,240,170,.95),rgba(240,196,74,.2));justify-content:center}
@keyframes b_pflash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
/* 411 Händer kvar som små kort-pips, röda på sista handen */
.b_pips.h i{width:11px;height:15px;border-radius:3px}
.b_pips.h i.on{background:var(--bl-blue)}
.b_pips.h.low i.on{background:var(--bl-red)}
/* 412 Varning när sista handen återstår: röd räknare och etikett med kvarvarande poäng */
.b_warn{font-family:var(--font-pixel);font-size:11px;font-weight:700;letter-spacing:.5px;color:#fff;background:var(--bl-red);border:2px solid var(--bl-ink);border-radius:7px;padding:1px 8px;box-shadow:0 3px 0 var(--bl-ink);white-space:nowrap}
.b_warn[hidden]{display:none}
/* 415 Kombohistorik: de fem senaste händerna som små märken */
#b_hist{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;width:100%;max-width:600px;margin:2px auto 0;min-height:26px}
.b_hl{display:flex;gap:5px}
.b_hc{display:inline-flex;flex-direction:column;align-items:center;min-width:42px;padding:0 4px;border:2px solid var(--bl-ink);border-radius:7px;background:var(--bl-slate-d);box-shadow:0 3px 0 var(--bl-ink);font-family:var(--font-pixel);line-height:1.15;cursor:help}
.b_hc b{font-size:11px;color:var(--tc)}
.b_hc i{font-style:normal;font-size:10px;color:var(--bl-cream);opacity:.85}
.b_hc.t1{--tc:#cfd8dc}.b_hc.t2{--tc:#35bd86}.b_hc.t3{--tc:#52b9ff}.b_hc.t4{--tc:#d98bff}.b_hc.t5{--tc:var(--bl-gold)}
.b_hc.e{background:transparent;border:2px dashed rgba(243,236,220,.2);box-shadow:none;min-height:30px;cursor:default}
.b_hc.new{animation:b_hcIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes b_hcIn{0%{transform:translateY(-8px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* 413 Segerpopup: stjärnbetyg efter antal händer samt överskott och bästa hand */
.b_sum{margin:8px 0 12px;font-family:var(--font-pixel)}
.b_stars{display:flex;justify-content:center;gap:8px;margin-bottom:6px}
.b_stars i{width:30px;height:30px;background:#3b4850;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.b_stars i.on{background:var(--bl-gold);animation:b_star .5s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes b_star{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.b_rows{display:flex;flex-direction:column;gap:3px;font-size:13px;max-width:320px;margin:0 auto}
.b_rows div{display:flex;justify-content:space-between;gap:12px;background:var(--bl-slate-d);border:2px solid var(--bl-ink);border-radius:7px;padding:1px 10px}
.b_rows span{color:var(--bl-cream);opacity:.8}.b_rows b{color:var(--bl-gold);text-align:right}
/* 414 Förlustpopup: hur nära målet det var, hur mycket som saknades och bästa hand */
.b_lbar{position:relative;height:20px;max-width:320px;margin:0 auto 6px;border:3px solid var(--bl-ink);border-radius:9px;background:var(--bl-slate-d);overflow:hidden}
.b_lbar u{position:absolute;left:0;top:0;bottom:0;background:var(--bl-red);text-decoration:none;animation:b_lgrow .8s ease-out backwards}
@keyframes b_lgrow{0%{width:0}}
.b_lbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 2px 0 var(--bl-ink)}
.b_close{color:var(--bl-gold);font-weight:700;margin:8px 0 0!important}
/* 416 Poängpanelens tooltip med full uträkning (title på #score-display) */
#score-display{cursor:help}
/* 417 Guld från tärningsmodar flyger upp till guldräknaren som ett guldfärgat märke (se .b_flt.g) */
/* 418 Tärningsmodar visar sitt bidrag som liten etikett på tärningen vid poängsättning (se .b_flt) */
/* 419 Räknare för sparade tärningar i brickans hörn (visas utan att tärningarna rör sig) */
.b_held{position:absolute;top:6px;right:10px;z-index:3;pointer-events:none;font-family:var(--font-pixel);font-size:11px;letter-spacing:.5px;color:var(--bl-ink);
  background:var(--bl-gold);border:2px solid var(--bl-ink);border-radius:6px;padding:0 7px;box-shadow:0 3px 0 var(--bl-ink);opacity:0;transition:opacity .2s}
.b_held.on{opacity:1}
/* 420 Poängsätt nu: knappen får gul streckad ram när kasten är slut */
#score-btn.b_ready{outline:3px dashed var(--bl-gold);outline-offset:4px}
@media (max-width:480px){
  #combo-sub{font-size:13px;gap:5px;padding:3px 8px}
  .b_hc{min-width:38px}
  .b_best{right:0}
}


/* ===== PATCH C (css) ===== */
/* ===== Agent C: butik, voucher, blindval, relikfält, tooltips ===== */
.c-hide{display:none!important}

/* 421 Varor du inte har råd med: dämpade, röd pris-pill och "saknar N" */
.shop-item.c-poor{opacity:.68;filter:saturate(.5)}
.shop-item.c-poor:hover:not(.sold){transform:none}
.shop-item.c-poor .price{background:var(--bl-red);color:#fff}
.c-need{font-family:var(--font-pixel);font-size:11px;font-weight:700;color:#ffb3ac;letter-spacing:.5px}
.c-need-full{color:var(--bl-orange)}
.shop-item.c-full{opacity:.85}

/* 422 Tydlig SÅLD-stämpel över dämpat kort */
.shop-item.sold{opacity:1;filter:none;cursor:default}
.shop-item.sold>*:not(.c-stamp){opacity:.28;filter:grayscale(.85)}
.shop-item.sold .price{display:none}
.c-stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-13deg);z-index:3;pointer-events:none;
  font-family:var(--font-pixel);font-weight:700;font-size:24px;letter-spacing:4px;color:var(--bl-red);
  border:4px solid var(--bl-red);border-radius:8px;padding:0 12px;background:rgba(16,22,26,.72);text-shadow:0 2px 0 var(--bl-ink);white-space:nowrap}
@keyframes c-stampIn{from{transform:translate(-50%,-50%) rotate(-13deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:1}}
.shop-item.c-bought .c-stamp{animation:c-stampIn .32s cubic-bezier(.2,.9,.3,1.1)}

/* 423 Butikssektioner med rubriker */
.c-secs{display:flex;flex-direction:column;gap:4px;margin:10px 0 6px}
.c-sec{text-align:left}
.c-sech{display:flex;align-items:center;gap:10px;margin:8px 0 0;font-family:var(--font-pixel);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--bl-cream);text-shadow:0 2px 0 var(--bl-ink)}
.c-sech::after{content:'';order:2;flex:1;height:4px;border-radius:2px;background:var(--bl-ink)}
.c-sech em{order:1;font-style:normal;font-size:10px;letter-spacing:1px;color:#8fa3ad;text-shadow:none}
.c-sech i{order:3;font-style:normal;font-size:12px;background:var(--bl-ink);color:var(--bl-gold);border-radius:99px;padding:0 10px;text-shadow:none}
.c-sec .c-grid{margin:10px 0 6px}

/* 424 Billigast först, sålda sist (se skriptet); rubrikens "billigast först" visar ordningen */
.c-sech em::before{content:'↑ '}

/* 425 Tavlans jämförelse: före → efter */
.c-delta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;margin-top:2px;font-family:var(--font-pixel);font-size:12px;
  background:var(--bl-slate-d);border:2px solid var(--bl-ink);border-radius:9px;padding:4px 6px;width:100%}
.c-delta .c-lv{flex-basis:100%;font-size:10px;color:var(--bl-gold);letter-spacing:1px;text-transform:uppercase}
.c-delta .c-dl{white-space:nowrap}
.c-delta .t-chips,.c-delta .t-mult{padding:0 4px;font-size:12px}
.c-delta .c-ar{color:var(--bl-green);font-weight:700}

/* 426 Sällsynthet som etikett och färgad flik på relikkort */
.c-rar{font-family:var(--font-pixel);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff;border:2px solid var(--bl-ink);border-radius:6px;padding:0 8px}
.c-rar-common{background:#5b7b8f}.c-rar-uncommon{background:var(--bl-green-d)}.c-rar-rare{background:var(--bl-red-d)}.c-rar-legendary{background:#7a43c4}
.shop-item.c-r-common{border-top:8px solid #5b7b8f}
.shop-item.c-r-uncommon{border-top:8px solid var(--bl-green)}
.shop-item.c-r-rare{border-top:8px solid var(--bl-red)}
.shop-item.c-r-legendary{border-top:8px solid var(--bl-gold)}

/* 427 Tooltippen vänds uppåt nära skärmens botten (sidled hanteras av skriptet) */
.relic .tip.c-up{top:auto;bottom:100%;transform:translateX(-50%) translateY(-6px)}
.relic:hover .tip.c-up,.relic.c-sel .tip.c-up,.relic:focus-visible .tip.c-up{transform:translateX(-50%) translateY(-4px)}
.relic .tip{max-width:calc(100vw - 24px)}

/* 428 Omkast-knappen: pris som mynt-pill */
.c-rr{display:inline-flex;align-items:center;gap:8px}
.c-rr-ic{display:inline-block;font-size:1.25em;line-height:1}
.c-rr-p{display:inline-flex;align-items:center;gap:4px;background:var(--bl-ink);color:var(--bl-gold);border-radius:99px;padding:0 10px;font-weight:700}
.c-rr-p .spr{width:16px;height:16px}
button.c-poorbtn .c-rr-p{background:#5a1612;color:#ffb3ac}

/* 429 Nya varor delas ut och omkast-pilen snurrar (engångs) */
.shop-item.c-pre{opacity:0;transform:translateY(-26px) rotate(-5deg) scale(.88)}
@keyframes c-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.c-rr-ic.c-spin{animation:c-spin .55s ease-out}

/* 430 Köp-pop på kortet, ingen ny modal-pop vid köp */
.modal.c-still{animation:none}
@keyframes c-pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.shop-item.c-bought .icon{animation:c-pop .45s ease-out}

/* 431 Guldräknare som tickar, med flytande minus/plus */
.c-gold{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--bl-gold);color:#1a1004;border:3px solid var(--bl-ink);border-radius:99px;
  box-shadow:0 3px 0 var(--bl-ink);padding:1px 14px 1px 8px;font-family:var(--font-pixel);font-weight:700;font-size:20px}
.c-gold .spr{width:22px;height:22px}
.c-fl{position:absolute;right:-6px;top:-4px;font-size:15px;color:#fff;background:var(--bl-red);border:2px solid var(--bl-ink);border-radius:99px;padding:0 8px;animation:c-flt .9s ease-out forwards;pointer-events:none}
@keyframes c-flt{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.c-float{position:fixed;z-index:500;pointer-events:none;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;
  font-family:var(--font-pixel);font-weight:700;font-size:18px;color:#1a1004;background:var(--bl-gold);border:3px solid var(--bl-ink);border-radius:99px;padding:0 10px;
  box-shadow:0 3px 0 var(--bl-ink);animation:c-fltup 1s ease-out forwards}
.c-float .spr{width:18px;height:18px}
@keyframes c-fltup{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-54px);opacity:0}}

/* 432 Butiksrubrik: guld-pill och relikplatser som små kort */
.c-head{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;margin:4px 0 10px}
.c-slotspill{display:inline-flex;align-items:center}
.c-cnt{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-pixel);font-size:12px;letter-spacing:1px;color:var(--bl-cream)}
.c-cnt b{font-size:15px;color:var(--bl-gold)}
.c-pips{display:inline-flex;gap:4px}
.c-pip{display:block;width:14px;height:20px;border:2px solid var(--bl-ink);border-radius:4px;box-shadow:0 2px 0 var(--bl-ink)}
.c-pip.c-r-common{background:#8aa3b3}.c-pip.c-r-uncommon{background:var(--bl-blue)}.c-pip.c-r-rare{background:#c44dff}.c-pip.c-r-legendary{background:var(--bl-gold)}
.c-pip.empty{background:transparent;border:2px dashed #6f838d;box-shadow:none}

/* 433 Hint-text */
.c-hint{font-family:var(--font-pixel);font-size:12px;color:#9fb1ba;letter-spacing:.5px;margin:10px auto 0;max-width:58ch}

/* 435 Tomt läge */
.c-empty{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0;padding:14px;border:3px dashed #5b6f79;border-radius:12px;background:var(--bl-slate-d)}
.c-empty-i .spr{width:48px;height:48px}
.c-empty b{font-family:var(--font-pixel);font-size:18px;color:var(--bl-gold)}
.c-empty span{font-size:13px;color:#9fb1ba}

/* 436 Fokusläge på kort: tydlig guldram och lyft */
.shop-item:focus{outline:none}
.shop-item:focus-visible{outline:4px solid var(--bl-gold);outline-offset:3px;transform:translateY(-6px) scale(1.04);z-index:2}
.c-oc:focus-visible,.relic:focus-visible{outline:3px solid var(--bl-gold);outline-offset:3px}

/* 438 Ägda vouchers: kort med ÄGD-stämpel */
.shop-item.c-owned{cursor:default}
.shop-item.c-owned>*:not(.c-stamp){opacity:.5}
.shop-item.c-owned:hover{transform:none}
.c-stamp-own{color:var(--bl-green);border-color:var(--bl-green)}
.shop-item.c-owned.c-bought .c-stamp-own{animation:c-stampIn .32s ease-out}
.c-vshop .c-grid{margin:12px 0}

/* 440 Markerad relik lyfts med guldram och visar sin tooltip */
.relic.c-sel{transform:translateY(-8px);box-shadow:0 4px 0 var(--bl-ink),0 0 0 3px var(--bl-gold);z-index:12}
.relic.c-sel .tip,.relic:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(4px)}

/* 441 Sälj-panel under relikfältet, bekräftelse i sidan */
.c-panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;padding:6px 12px;margin-top:6px;
  background:rgba(27,36,41,.88);border:3px solid var(--bl-ink);border-radius:12px;box-shadow:0 4px 0 var(--bl-ink);font-family:var(--font-pixel);font-size:13px;color:var(--bl-cream)}
.c-panel button{padding:2px 12px;min-width:0;font-size:12px;border-width:2px;border-radius:8px;box-shadow:0 3px 0 var(--bl-ink);background:#55666f;color:#fff}
.c-panel button:hover:not(:disabled){transform:translateY(-2px)}
.c-panel button:active:not(:disabled){transform:translateY(2px)!important;box-shadow:0 0 0 2px var(--bl-ink)!important}
.c-panel button:disabled{opacity:.45}
.c-panel .c-sell{background:var(--bl-gold);color:#1a1004}
.c-panel .c-yes{background:var(--bl-red);color:#fff}
.c-panel .c-sell .spr{width:14px;height:14px;vertical-align:-2px}
.c-pbtns{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.c-pn{display:inline-flex;align-items:center;gap:6px}
.c-pn .rico{font-size:16px;padding:2px;border-radius:6px}
.c-pn b{color:var(--bl-gold)}
.c-sure{color:#ffb3ac;font-weight:700}
.c-phint{color:#9fb1ba;font-size:12px}
#c-relicpanel{margin-top:6px}
.c-own{margin-top:8px;text-align:left}
.c-ocs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 2px;min-height:8px}
.c-oc{width:46px;height:60px;padding:0;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:9px;border:3px solid var(--bl-ink);
  background:#46565e;box-shadow:0 4px 0 var(--bl-ink)}
.c-oc.c-r-uncommon{background:#2d5f8a}.c-oc.c-r-rare{background:#6d2f8c}.c-oc.c-r-legendary{background:#8a6d1c}
.c-oc.c-sel{transform:translateY(-6px);box-shadow:0 4px 0 var(--bl-ink),0 0 0 3px var(--bl-gold)}
.c-own .c-panel{margin-top:10px}

/* 443 Sälj-feedback: se .c-float (guld som svävar upp från relikens plats) */

/* 444 Flytta relik med pilknapparna i panelen (◀ ▶) */
.c-panel button[data-c-act="mv"]{padding:2px 8px}

/* 445 Tooltip med ikon och sällsynthet i färgad rubrik */
.relic .tip .rtag{display:none}
.relic .tip .c-tiph{display:flex;align-items:center;gap:8px;margin:-4px -4px 6px;padding:4px 6px;border-radius:8px;border:2px solid var(--bl-ink);background:#46565e}
.relic .tip .c-tiph.c-r-uncommon{background:#2d5f8a}.relic .tip .c-tiph.c-r-rare{background:#6d2f8c}.relic .tip .c-tiph.c-r-legendary{background:#8a6d1c}
.relic .tip .c-tiph .rico{flex:none;font-size:22px}
.relic .tip .c-tn b{border:0;padding:0;margin:0;color:#fff}
.relic .tip .c-tn small{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#dfe9ee}

/* 446 Blindval som tre plattor */
.c-plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 10px;align-items:stretch}
.c-plates .blind-card,.c-plate{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;padding:12px 8px;
  border:3px solid var(--bl-ink);border-top-width:12px;border-radius:14px;background-color:#2f3f48;box-shadow:0 6px 0 var(--bl-ink);position:relative;overflow:hidden}
.c-plate.c-b0{border-top-color:var(--bl-blue)}.c-plate.c-b1{border-top-color:var(--bl-orange)}.c-plate.c-b2{border-top-color:var(--bl-red)}
.c-plates .blind-card .info{text-align:center;flex:0 0 auto}
.c-plates .blind-card .info b,.c-pt b{font-size:15px;display:block;font-family:var(--font-pixel)}
.c-plates .blind-card .info span,.c-pt span{font-size:11px;color:#9fb1ba;display:block;margin-top:2px}
.c-plates .blind-card .icon,.c-pi{width:64px;height:64px;font-size:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(0,0,0,.4))}
.c-plates .blind-card .icon .spr,.c-pi .spr{width:44px;height:44px}
.c-plates .blind-card .target,.c-ptg{font-size:20px;padding:2px 12px;margin-top:auto;font-family:var(--font-pixel);font-weight:700}
.c-ptg{background:var(--bl-slate-d);color:#c9d6dc;border:3px solid var(--bl-ink);border-radius:10px}
.c-plates .blind-card.c-curplate{box-shadow:0 6px 0 var(--bl-ink),0 0 0 4px var(--bl-gold);transform:translateY(-4px)}
.c-plate.c-next{opacity:.55;filter:saturate(.45)}
.c-plate.c-done{opacity:.6;filter:saturate(.3)}
.c-plate.c-done .c-ptg{color:var(--bl-green);background:transparent;border-color:var(--bl-green)}
.c-prw{font-family:var(--font-pixel);font-size:12px;color:var(--bl-gold);margin-top:4px;display:inline-flex;align-items:center;gap:3px;justify-content:center}
.c-prw .spr{width:14px;height:14px}

/* 447 Anteindikator */
.c-ante{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-pixel);font-size:13px;letter-spacing:2px;color:var(--bl-cream);margin:-4px 0 6px}
.c-aps{display:inline-flex;gap:4px}
.c-ap{display:block;width:22px;height:10px;border:2px solid var(--bl-ink);border-radius:3px;background:#46565e}
.c-ap.done{background:var(--bl-gold)}
.c-ap.cur{background:var(--bl-orange);box-shadow:0 0 0 2px #fff}
.c-aend{color:var(--bl-gold);font-size:16px}

/* 448 Bossavslöjande: egen plakett med sprite och beskrivning */
.c-plaque{display:flex;align-items:center;gap:14px;text-align:left;margin:10px 0 4px;padding:10px 14px;background:var(--bl-slate-d);border:3px solid var(--bl-ink);border-left:12px solid var(--bl-red);border-radius:12px;box-shadow:0 5px 0 var(--bl-ink)}
.c-pq-spr{flex:none;width:76px;height:76px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,#5a2a2c,#1c1012);border:3px solid var(--bl-ink);font-size:44px}
.c-pq-spr .spr{width:60px;height:60px}
.c-pq-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.c-pq-tx small{align-self:flex-start;font-family:var(--font-pixel);font-size:11px;letter-spacing:2px;color:#fff;background:var(--bl-red);border:2px solid var(--bl-ink);border-radius:6px;padding:0 8px}
.c-pq-tx b{font-family:var(--font-pixel);font-size:20px;color:#fff;text-shadow:0 2px 0 var(--bl-ink)}
.c-pq-tx span{font-size:14px;color:#ffc9a0;line-height:1.35}

/* 450 Hoppa över-knappen med belöningen tydlig */
.c-skipv{display:inline-flex;align-items:center;gap:3px;background:var(--bl-ink);color:var(--bl-gold);border-radius:99px;padding:0 8px;margin-left:6px;font-weight:700}
.c-skipv .spr{width:14px;height:14px}

/* 437 Mobil: butikskort i två kolumner, plattor staplade */
@media (max-width:560px){
  .c-grid,.c-vshop .shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .c-grid .shop-item{padding:8px 6px;gap:4px}
  .c-grid .shop-item .desc{font-size:10px}
  .c-grid .shop-item .name{font-size:12px}
  .c-stamp{font-size:18px;letter-spacing:2px;padding:0 8px}
  .c-sech{font-size:13px;letter-spacing:1px}
  .c-sech em{display:none}
  .c-plates{grid-template-columns:1fr;gap:10px}
  .c-plates .blind-card,.c-plate{flex-direction:row;text-align:left;border-top-width:3px;border-left-width:12px;padding:8px 10px;gap:10px}
  .c-plate.c-b0,.c-plates .blind-card.blind-0{border-left-color:var(--bl-blue)}
  .c-plate.c-b1,.c-plates .blind-card.blind-1{border-left-color:var(--bl-orange)}
  .c-plate.c-b2,.c-plates .blind-card.blind-2{border-left-color:var(--bl-red)}
  .c-plates .blind-card .info,.c-pt{text-align:left;flex:1;min-width:0}
  .c-plates .blind-card .icon,.c-pi{width:48px;height:48px;flex:none}
  .c-plates .blind-card .icon .spr,.c-pi .spr{width:34px;height:34px}
  .c-plates .blind-card .target,.c-ptg{margin-top:0;font-size:16px;padding:2px 8px}
  .c-plates .blind-card.c-curplate{transform:none}
  .c-plaque{gap:10px;padding:8px 10px}
  .c-pq-spr{width:56px;height:56px}.c-pq-spr .spr{width:44px;height:44px}
  .c-pq-tx b{font-size:17px}
  .c-panel{font-size:12px;padding:6px 10px}
  .c-ante{letter-spacing:1px}
  .c-ap{width:18px}
}
.c-plates .blind-card .info b .boss-tag{display:inline-block;margin:4px 0 0;font-size:10px}
.c-vshop .c-stamp,.c-grid .c-stamp-own{font-size:17px;letter-spacing:2px;padding:0 8px}
#c-relicpanel{position:relative;z-index:40}


/* ===== PATCH F (css) ===== */
/* 513 Inställningsknapp i headern (egen SVG-ikon, ingen emoji) */
#f_set-btn .f_ico{display:block}
#f_set-btn .f_ld{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--bl-gold);transition:width .25s}
#f_set-btn:not(.f_loading) .f_ld{opacity:0}
/* 513 Panelen: platt skiffer, tjock kontur, hård skugga */
.f_panel{position:fixed;right:16px;top:56px;width:min(340px,calc(100vw - 32px));z-index:1200;box-sizing:border-box;
  background:var(--bl-slate);border:3px solid var(--bl-ink);border-radius:8px;box-shadow:0 6px 0 var(--bl-ink);
  padding:12px 14px 14px;color:var(--bl-cream);font-family:var(--font-pixel);font-size:14px;animation:f_in .18s ease-out}
.f_panel[hidden]{display:none}
@keyframes f_in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.f_head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.f_head b{font-size:17px;letter-spacing:.5px;color:var(--bl-gold)}
.f_x{padding:0;display:flex;align-items:center;justify-content:center;padding-bottom:3px;background:var(--bl-red);color:#fff;border:2px solid var(--bl-ink);border-radius:5px;width:28px;height:28px;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 2px 0 var(--bl-red-d);font-family:inherit}
.f_row{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;margin:7px 0}
.f_row output{text-align:right;font-size:12px;opacity:.85}
.f_panel input[type=range]{width:100%;min-width:0;accent-color:var(--bl-gold);height:22px;margin:0}
.f_sw{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}
.f_chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:28px}
.f_chk input{width:18px;height:18px;margin:0;accent-color:var(--bl-gold)}
.f_cap{font-size:12px;letter-spacing:.6px;text-transform:uppercase;opacity:.7;margin-top:10px}
.f_load{margin-top:10px}
.f_bar{height:8px;background:var(--bl-slate-d);border:2px solid var(--bl-ink);border-radius:4px;overflow:hidden}
.f_bar i{display:block;height:100%;width:0;background:var(--bl-green);transition:width .25s}
.f_load small,.f_foot small{display:block;font-size:11px;opacity:.75;margin-top:4px}
.f_foot{display:flex;flex-direction:column;align-items:flex-start;margin-top:10px}
.f_test{background:var(--bl-blue);color:#fff;border:2px solid var(--bl-ink);border-radius:6px;padding:6px 12px;font-family:inherit;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--bl-blue-d)}
.f_test:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bl-blue-d)}
@media (max-width:480px){.f_panel{right:16px;left:16px;width:auto}.f_row{grid-template-columns:84px 1fr 36px}}
@media (prefers-reduced-motion:reduce){.f_panel{animation:none}.f_bar i,#f_set-btn .f_ld{transition:none}}


/* ===== PATCH G (css) ===== */
/* =========================================================
   G 541-570  TILLGÄNGLIGHET, INMATNING OCH MOBIL
   ========================================================= */
/* 541 Egen headerknapp för tillgänglighetspanelen */
.g-accbtn{font-family:var(--font-pixel);font-weight:700;letter-spacing:0;min-width:34px}
/* 570 Dämpad text får minst 4.5:1 mot panelbakgrunderna (var #8a7fa0 = 3.1:1) */
:root{--dim:#c4bbd6;--g-focus:#ffffff;--g-ink:#10161a}
button:disabled{color:#dde4e7!important}
.stat,#round-info,#combo-sub{color:var(--dim)}
/* 569 Spelet är alltid mörkt, systemets ljusa tema ignoreras */
:root{color-scheme:dark}
html,body{background-color:#143229}
/* 562 Ingen dubbeltryckszoom, ingen markering eller tryckfärg på spelytan */
html,body,button,.die,.relic,.shop-item,.blind-card,#dice-area,#controls{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.die,.relic,button,.hbtn,.stat{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modal{overscroll-behavior:contain}
/* 566 Tydlig fokusring (vit, tjock) som syns mot alla paneler */
:is(button,.hbtn,.die,.relic,[role="button"],a,.g-sw,.shop-item,.tab):focus-visible{outline:3px solid var(--g-focus)!important;outline-offset:3px!important;z-index:5}
.die:focus-visible{outline-color:#ffe066!important;outline-style:solid!important;outline-offset:5px!important}
.modal:focus,.modal:focus-visible{outline:none!important}
/* 567 Skip-länk, syns först vid tangentbordsfokus */
.g-skip{position:fixed;left:16px;top:-80px;z-index:400;background:var(--bl-gold);color:#1a1004;border:3px solid var(--bl-ink);border-radius:10px;
  padding:10px 16px;font:700 14px var(--font-pixel);text-decoration:none;box-shadow:0 4px 0 var(--bl-ink)}
.g-skip:focus{top:max(10px,env(safe-area-inset-top))}
/* 551 Visuellt dold live-region */
.g-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* 544 Genvägsetiketter på kontrollknapparna (bara med mus/tangentbord) */
.g-kbd{display:none;position:absolute;top:2px;right:3px;min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:5px;
  background:var(--bl-ink);color:#fff;border:1px solid #ffffffcc;font:700 10px/13px var(--font-pixel);text-align:center;pointer-events:none;text-shadow:none;letter-spacing:0}
#controls button{position:relative}
@media (hover:hover) and (pointer:fine){html:not(.g-nokeys) .g-kbd{display:block}}
/* 545 Genvägslistan */
.g-keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;text-align:left;margin:6px 0}
.g-krow{display:flex;align-items:center;gap:10px;background:var(--bl-slate-d);border:3px solid var(--bl-ink);border-radius:10px;padding:5px 8px;font-size:13px;color:var(--text)}
.g-krow kbd,.g-keys kbd{flex:none;min-width:34px;text-align:center;background:var(--bl-ink);color:#fff;border:2px solid #fff;border-radius:6px;padding:1px 6px;font:700 12px var(--font-pixel)}
@media (max-width:480px){.g-keys{grid-template-columns:1fr}}
/* 541 Panelens växlar */
.g-sws{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
.g-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;min-height:52px;background:var(--bl-slate-d);color:var(--text);
  border:3px solid var(--bl-ink);border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 var(--bl-ink);font-family:var(--font-pixel)}
.g-sw .g-swt{display:flex;flex-direction:column;gap:2px}
.g-sw b{font-size:15px;color:#fff}
.g-sw small{font-size:12px;color:var(--dim);line-height:1.3}
.g-sw .g-swv{flex:none;min-width:48px;text-align:center;border:3px solid var(--bl-ink);border-radius:8px;padding:2px 8px;background:#55666f;color:#fff;font-weight:700}
.g-sw.on .g-swv{background:var(--bl-green);color:#08180f}
.g-sw:hover:not(:disabled){transform:none;filter:brightness(1.12)}
/* 561 Tooltip på reliker nås även via tangentbordsfokus och långtryck */
.relic:focus .tip,.relic:focus-within .tip,.relic.g-tip-open .tip{opacity:1;transform:translateX(-50%) translateY(4px)}
.relic.g-tip-open,.relic:focus{z-index:60}
/* 557 Färgblindhetsläge: formmarkör per tärningsfärg (●▲■◆★✚), färg är inte enda signal */
.die .g-mark{display:none}
html.g-cb .die .g-mark{display:block;position:absolute;left:4px;top:2px;font:700 15px/1 system-ui,'Segoe UI Symbol',sans-serif;color:var(--bl-ink);
  text-shadow:0 0 0 #fff,1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;pointer-events:none}
html.g-cb .die{box-shadow:inset 0 0 0 4px var(--dc,#888),0 4px 0 var(--bl-ink)}
/* 555 Högkontrast: svart yta, vita kanter, vit text och starka knappfärger */
html.g-hc{--dim:#ffffff;--text:#ffffff;--bl-ink:#000;--bl-slate:#000;--bl-slate-d:#000;--bl-felt-d:#000;--g-focus:#ffe066}
html.g-hc body,html.g-hc html{background:#000}
html.g-hc #bg-layers{opacity:.1}
html.g-hc :is(header,#relics-bar,#controls,#round-info,#score-display,.modal,.stat,.shop-item,.blind-card,.combo-row,.relic .tip,.g-sw,.g-krow,#combo-banner:not(.none),#combo-sub,#progress-wrap,.toast,.popup-log div){
  background:#000!important;background-image:none!important;border-color:#fff!important;color:#fff!important}
html.g-hc :is(.stat b,.modal p,.modal h2,#round-info,#round-info b,#combo-name,.desc,.shop-item *,.blind-card *,.relic .tip *,.combo-row *){color:#fff!important;-webkit-text-fill-color:#fff!important;text-shadow:none!important;filter:none!important;background-image:none}
html.g-hc .modal h2::after{display:none}
html.g-hc button{color:#000!important;text-shadow:none!important;border-color:#fff!important;background:#e6e6e6!important;background-image:none!important}
html.g-hc #roll-btn{background:#ffb84d!important}
html.g-hc #score-btn,html.g-hc button.primary{background:#6cc7ff!important}
html.g-hc #discard-btn,html.g-hc button.danger{background:#ff9490!important}
html.g-hc button.gold{background:#ffe066!important}
html.g-hc button:disabled{background:#1c1c1c!important;color:#fff!important;border-style:dashed!important}
html.g-hc .g-sw .g-swv{background:#333;color:#fff;border-color:#fff}
html.g-hc .g-sw.on .g-swv{background:#7dff9b;color:#000}
html.g-hc .die{border:4px solid #fff!important;background:#fff!important;background-image:none!important}
html.g-hc .die .pip{background:#000!important}
html.g-hc .die.held{outline:5px solid #ffe066;outline-offset:2px}
html.g-hc #progress-fill{background:#6cc7ff!important}
html.g-hc #score-display .chips{background:#6cc7ff!important;color:#000!important}
html.g-hc #score-display .mult{background:#ff9490!important;color:#000!important}
html.g-hc #score-display :is(.chips,.mult,.total,.eq){-webkit-text-fill-color:currentColor}
html.g-hc .g-kbd{background:#000;border-color:#fff}
@media (prefers-contrast:more){:root{--dim:#ffffff}}
/* 556 Stor text */
html.g-big .stat{font-size:13px}html.g-big .stat b{font-size:18px}
html.g-big #round-info,html.g-big #combo-sub,html.g-big #progress-label{font-size:15px}
html.g-big .modal,html.g-big .modal p{font-size:17px}
html.g-big .shop-item .desc,html.g-big .blind-card .info span,html.g-big .combo-row,html.g-big .combo-row .cp{font-size:15px}
html.g-big .relic .tip{font-size:16px}html.g-big .relic .tip b{font-size:17px}
html.g-big button{font-size:16px}html.g-big .hbtn{font-size:15px}
html.g-big .g-sw b{font-size:18px}html.g-big .g-sw small{font-size:14px}
html.g-big .g-krow{font-size:16px}
/* 558 Minskad rörelse (egen växel, följer systemet som standard): inga engångsanimationer, ingen övergång */
html.g-rm *,html.g-rm *::before,html.g-rm *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
html.g-rm #bg-layers *{animation:none!important}
html.g-rm button:hover:not(:disabled){transform:none}
/* 559 Pekmål minst 44 px på telefon och pekskärm */
@media (pointer:coarse),(max-width:600px){
  button,.hbtn,.tab,.lang-pick button,.g-sw{min-height:44px}
  .hbtn{min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .relic,.relic-slot{width:44px;height:44px}
  #controls{gap:8px}
  #controls button{min-width:64px}
  .die{min-width:66px;min-height:66px}
  .modal .buttons button{min-width:96px}
}
/* 563 Safe-area för hack och hemindikator */
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app{padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
#overlay{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.popup-log,.toast{margin-bottom:env(safe-area-inset-bottom,0px)}
/* 559 Header på telefon: knapparna radbryts i stället för att klippas, headern är inte fast (kontrollerna är det) */
@media (max-width:600px){
  header{position:static}
  header .hbtns{flex-wrap:wrap;gap:4px;justify-content:center}
  #lang-btn{min-width:44px}
}
/* 565 Fast kontrollrad längst ned på telefon i stående läge */
@media (max-width:600px) and (orientation:portrait){
  #controls{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);z-index:40;background:rgba(27,36,41,.97)}
}
/* 564 Liggande telefon (till exempel 800x400): kompakt, ingen horisontell scroll */
@media (orientation:landscape) and (max-height:520px){
  header{position:static;padding:3px 6px;gap:2px;flex-wrap:nowrap;justify-content:space-between}
  header .stat{min-width:0;padding:1px 4px 3px;font-size:8px;letter-spacing:0;flex:0 1 auto}
  header .stat b{font-size:12px}
  header #blind-icon{display:none}
  header .hbtns{width:auto;margin:0 0 0 auto;gap:2px;flex-wrap:nowrap}
  header .hbtn{padding:2px;min-width:44px;max-width:44px;overflow:hidden}
  header .hbtn.lang{min-width:44px;font-size:10px}
  #app{padding:4px 8px;gap:4px;min-height:0}
  #relics-bar{min-height:50px;padding:3px 8px;gap:6px}
  main{gap:6px;padding:2px 0 4px}
  #combo-banner{margin-bottom:0}
  #combo-banner:not(.none){padding:2px 20px 4px}
  #combo-name{font-size:20px!important;letter-spacing:1px}
  #combo-sub{font-size:11px;margin-top:2px;padding:1px 8px}
  #progress-wrap{height:16px}
  .die{width:58px;height:58px;padding:7px;border-radius:11px}
  .die .pip{width:8px;height:8px}
  #dice-area{gap:8px;min-height:0;padding:4px}
  #controls{padding:6px 10px;gap:6px;position:static}
  #round-info{padding:3px 10px;gap:10px;font-size:11px}
  #score-display{padding:2px 10px;font-size:20px}
  .modal{max-height:calc(100vh - 20px);padding:14px}
  .modal h2{font-size:22px;margin-bottom:8px}
  .g-keys{grid-template-columns:1fr 1fr 1fr}
}
/* 570 Knapptext och chips-/multrutor når 4.5:1 (vit text på de ljusa knappfärgerna gav 2.1-3.0:1), samma nyanser men djupare */
#roll-btn{background:#b85a05!important;box-shadow:0 5px 0 #6e3d03,0 5px 0 3px var(--bl-ink)}
#score-btn,button.primary,button[onclick="openVoucherShop()"],#score-display .chips{background:#0f72c0}
#score-btn,button.primary,button[onclick="openVoucherShop()"]{box-shadow:0 5px 0 #08487c,0 5px 0 3px var(--bl-ink)}
#discard-btn,button[onclick="rerollShop()"],#score-display .mult,.blind-card .target{background:#c93228}
#discard-btn,button[onclick="rerollShop()"]{box-shadow:0 5px 0 #7a1d17,0 5px 0 3px var(--bl-ink)}
button.primary[onclick="nextBlind()"],button[onclick="nextBlind()"]{background:#1b7a52;box-shadow:0 5px 0 #0f4a31,0 5px 0 3px var(--bl-ink)}
.lang-pick button.on,.tab.active{background:#0f72c0!important}
.g-sw.on .g-swv{background:#1b7a52;color:#fff}
button:disabled{background:#3b464b!important}
#roll-btn:disabled,#score-btn:disabled,#discard-btn:disabled{background:#3b464b!important}


/* ===== PATCH H (css) ===== */
/* Agent H: meta, statistik, achievements, hjälp */
/* 573 Kategorirubriker i achievement-listan */
.h-cat{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:4px 10px;margin-top:6px;background:var(--bl-slate-d);border:3px solid var(--bl-ink);font-family:var(--font-pixel);color:var(--bl-gold);text-align:left;letter-spacing:1px}
.h-cat b{color:var(--bl-cream)}
.h-ach-list{max-height:52vh;overflow-y:auto;text-align:left}
/* 574, 595 Framstegsstaplar */
.h-prog{height:10px;margin-top:6px;background:var(--bl-slate-d);border:2px solid var(--bl-ink);overflow:hidden}
.h-prog i{display:block;height:100%;background:var(--bl-blue)}
.h-prog-big{height:14px;margin:0 auto 12px;max-width:420px}
.h-prog-big i{background:var(--bl-gold)}
.h-pt{color:var(--bl-cream);opacity:.8}
.ach-item.locked{filter:none;opacity:.75}
.ach-item.locked .em{opacity:.6}
/* 589, 590 Diagram med staplar */
.h-chart{max-height:46vh;overflow-y:auto;padding:2px 4px 2px 0}
.h-chart{display:grid;grid-template-columns:minmax(56px,max-content) 1fr max-content;gap:8px;align-items:center}
.h-bar-row{display:contents;font-size:12px;text-align:left}
.h-bl{font-family:var(--font-pixel);color:var(--bl-cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-bar{position:relative;height:16px;background:var(--bl-slate-d);border:3px solid var(--bl-ink)}
.h-bar i{display:block;height:100%;background:var(--bl-blue)}
.h-bar.ok i{background:var(--bl-green)}.h-bar.bad i{background:var(--bl-red)}.h-bar.part i{background:var(--bl-orange)}
.h-bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--bl-gold)}
.h-bv{font-family:var(--font-pixel);color:var(--bl-gold);min-width:2ch;text-align:right;white-space:nowrap}
.h-bv small{color:var(--bl-cream);opacity:.7}
.h-note{font-size:11px;color:var(--bl-cream);opacity:.8;margin:6px 0}
.h-key{display:inline-block;width:2px;height:10px;background:var(--bl-gold);vertical-align:middle}
.h-empty{opacity:.7}
/* 575 Bästa händer */
.h-h3{font-family:var(--font-pixel);color:var(--bl-gold);font-size:14px;margin:12px 0 6px;text-align:left}
.h-hands{list-style:none;margin:0;padding:0;text-align:left}
.h-hands li{display:flex;gap:8px;align-items:baseline;padding:5px 10px;margin:3px 0;background:var(--bl-slate-d);border:2px solid var(--bl-ink)}
.h-hands li span{flex:1}.h-hands li b{color:var(--bl-gold);font-family:var(--font-pixel)}.h-hands li small{opacity:.7}
/* 576, 592 Körhistorik */
.h-hist{max-height:46vh;overflow-y:auto}
.h-hrow{display:flex;gap:10px;align-items:center;padding:6px 8px;margin:4px 0;background:var(--bl-slate-d);border:2px solid var(--bl-ink);text-align:left}
.h-hm{flex:1;min-width:0;overflow-wrap:anywhere}.h-hm small{opacity:.75}
.h-hi .spr{width:24px;height:24px}
/* 577, 578 Daily Run i menyn */
.h-daily{text-align:center;padding:2px 0}
.h-daily-btn small{opacity:.8;margin-left:6px}
.h-badge{display:inline-block;margin-left:4px;padding:0 5px;background:var(--bl-ink);color:var(--bl-gold);border:2px solid var(--bl-ink)}
/* 580, 600 Seed i HUD */
.h-seedtag{font-family:var(--font-pixel);font-size:11px;background:var(--bl-slate-d);color:var(--bl-gold);border:2px solid var(--bl-ink);padding:1px 8px;margin-left:8px;cursor:pointer;min-height:0}
/* 582, 594, 581 Run summary */
.h-sum{margin:10px 0;text-align:left}
.h-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.h-tile{display:flex;flex-direction:column;align-items:center;padding:6px 2px;background:var(--bl-slate-d);border:3px solid var(--bl-ink);text-align:center}
.h-tile b{font-family:var(--font-pixel);color:var(--bl-gold);font-size:16px}
.h-tile small{font-size:10px;opacity:.8}
.h-tile .spr{width:24px;height:24px}
.h-share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.h-seedline{font-family:var(--font-pixel);overflow-wrap:anywhere}
.h-copyfb{width:100%;font-family:var(--font-pixel);font-size:12px;background:var(--bl-slate-d);color:var(--bl-cream);border:2px solid var(--bl-ink);padding:4px;resize:none}
/* 587, 588 Tips */
.h-tip{margin-top:12px;padding:8px 10px;background:var(--bl-slate-d);border:3px solid var(--bl-ink);font-size:12px;text-align:left;color:var(--bl-cream)}
.h-tip b{color:var(--bl-gold);font-family:var(--font-pixel);margin-right:6px}
/* 583, 584 Handledning */
.h-tut{max-width:460px}
.h-dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.h-dot{width:12px;height:12px;background:var(--bl-slate-d);border:2px solid var(--bl-ink)}
.h-dot.past{background:var(--bl-blue-d)}.h-dot.on{background:var(--bl-gold)}
.h-tut-ico .spr{width:56px;height:56px}
.h-tut-ex{margin:12px 0;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:44px}
.h-tut-ex .spr{width:32px;height:32px}
.h-pd{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;background:var(--bl-cream);color:var(--bl-ink);border:3px solid var(--bl-ink);font-family:var(--font-pixel);font-size:18px;box-shadow:0 3px 0 var(--bl-ink)}
.h-pd.on{outline:3px solid var(--bl-gold)}
/* 585, 586 Hjälp med flikar och kombotabell */
.h-help{text-align:left;max-height:50vh;overflow-y:auto;padding-right:4px}
.h-list{padding-left:20px;margin:6px 0}.h-list li{margin:5px 0}
.h-tbl{width:100%;border-collapse:collapse;font-size:12px}
.h-tbl th{font-family:var(--font-pixel);color:var(--bl-gold);text-align:left;padding:4px 6px;border-bottom:3px solid var(--bl-ink)}
.h-tbl td{padding:5px 6px;border-bottom:2px solid var(--bl-ink)}
.h-rar{display:inline-block;padding:0 6px;border:2px solid var(--bl-ink);font-family:var(--font-pixel);color:var(--bl-ink)}
.h-rar-common{background:var(--bl-cream)}.h-rar-uncommon{background:var(--bl-green)}.h-rar-rare{background:var(--bl-blue)}.h-rar-legendary{background:var(--bl-orange)}
@media (max-width:480px){
  .h-chart{gap:6px}
  .h-bv{font-size:11px}
  .h-tbl{font-size:11px}.h-tbl td,.h-tbl th{padding:4px 3px}
  .h-tiles{gap:4px}
}


/* ===== PATCH Z (css) ===== */
/* ===== Integrationsfix (Z) ===== */
/* Z1 Räntaruta: vit etikett på mörkgrön ruta (kontrast >= 4.5:1) */
header .stat.interest{color:#fff}
/* Z2 Tangentbordsetiketten ligger på knappens övre kant så den inte täcker texten */
.g-kbd{top:-8px;right:-4px;z-index:2}
button .g-kbd{pointer-events:none}
/* Z3 Telefon: fem tärningar ryms på en rad så att kontrollraden inte täcker dem */
@media (max-width:480px){
  #dice-area{padding:16px 8px;gap:6px;flex-wrap:nowrap}
  .die{width:calc((100vw - 78px)/5);min-width:48px;padding:6px;gap:1px;border-width:2px;border-radius:10px}
  .die .pip{width:9px;height:9px}
  .die .mod-badge{width:22px;height:22px;font-size:12px;right:-6px;bottom:-6px}
}
/* Z4 Telefon: spara höjd (reliktips bort, luft under tärningsbrickan så kontrollraden inte täcker den) */
@media (max-width:480px){.c-phint{display:none}#dice-area{margin-bottom:14px}}

  hdrLabels();
}

  const bufs={};
  function ensure(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return}
    Object.keys(SAMPLES).forEach(k=>{
      try{
        const bin=atob(SAMPLES[k]),u=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
        const r=ctx.decodeAudioData(u.buffer,b=>{bufs[k]=b},()=>{});
        if(r&&r.catch)r.catch(()=>{});
      }catch(e){}
    }); } }
  function sample(k,vol=.7,rate=1){
    if(muted) return false; ensure(); if(!ctx||!bufs[k]) return false;
    if(ctx.state==='suspended') ctx.resume();
    const s=ctx.createBufferSource(),g=ctx.createGain();
    s.buffer=bufs[k]; s.playbackRate.value=rate*(0.96+Math.random()*.08); g.gain.value=vol;
    s.connect(g);g.connect(ctx.destination);s.start();
    return true;
  }
  function play(freq,dur=.1,type='sine',vol=.15){

    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);

    o.start();o.stop(ctx.currentTime+dur);
  }

/* Siffror som räknar upp (bara visning) */
const _num={};
function setNum(id,v,tween){
  const el=document.getElementById(id);if(!el)return;
  const prev=_num[id];_num[id]=v;
  const flash=()=>{el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')};
  if(el._raf)cancelAnimationFrame(el._raf);
  if(prev===undefined||prev===v){el.textContent=v.toLocaleString();return}
  flash();
  if(!tween||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=v.toLocaleString();return}
  const t0=performance.now(),dur=450;
  const step=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(prev+(v-prev)*(1-Math.pow(1-k,3))).toLocaleString();if(k<1)el._raf=requestAnimationFrame(step)};
  el._raf=requestAnimationFrame(step);
}
/* 3D-lutning på tärningen under pekaren, påverkar inga andra tärningar */
(function(){
  const da=document.getElementById('dice-area');if(!da)return;
  da.addEventListener('mousemove',e=>{const d=e.target.closest&&e.target.closest('.die');if(!d)return;
    const r=d.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    d.style.setProperty('--rx',(-y*16).toFixed(1)+'deg');d.style.setProperty('--ry',(x*16).toFixed(1)+'deg')});
  da.addEventListener('mouseout',e=>{const d=e.target.closest&&e.target.closest('.die');if(!d)return;d.style.removeProperty('--rx');d.style.removeProperty('--ry')});
})();
/* Färgade värden i beskrivningar och sällsynthetsetiketter */
function balaDesc(t){
  return String(t)
    .replace(/(×\s?\d+(?:[.,]\d+)?\s*mult|[+−-]\s?\d+(?:[.,]\d+)?\s*mult)/gi,'<span class="t-mult">$1</span>')
    .replace(/([+−-]\s?\d+\s*chips)/gi,'<span class="t-chips">$1</span>')
    .replace(/([+−-]\s?\d+\s*(?:guld|gold))/gi,'<span class="t-gold">$1</span>');
}
function rarityLabel(r){
  const m={common:['Vanlig','Common'],uncommon:['Ovanlig','Uncommon'],rare:['Sällsynt','Rare'],legendary:['Legendarisk','Legendary']}[r]||['',''];
  return LANG==='sv'?m[0]:m[1];
}

function burst(x,y,emojis,count=8,cls=''){
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='particle '+(cls||'');
    const em=emojis[Math.floor(Math.random()*emojis.length)];
    if(ICON_MAP[em]) el.innerHTML=spr(ICON_MAP[em]); else el.textContent=em;
    const a=Math.random()*Math.PI*2, d=50+Math.random()*110;
    el.style.setProperty('--dx',Math.cos(a)*d+'px');
    el.style.setProperty('--dy',Math.sin(a)*d+'px');
    el.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    el.style.left=x+'px'; el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1200);
  }
}
function screenFlash(color='rgba(255,220,100,0.6)'){
  const el=document.createElement('div');
  el.className='screen-flash';
  el.style.background=`radial-gradient(circle, ${color}, transparent 70%)`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),600);
}
function confetti(count=60){
  const colors=['#f5c542','#c44dff','#4d9fff','#4dff88','#ff994d','#ff4d5e'];
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.style.left=Math.random()*100+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=(Math.random()*0.5)+'s';
    el.style.animationDuration=(2+Math.random()*1.5)+'s';
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    if(Math.random()<0.4) el.style.borderRadius='50%';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}
function radialBurst(x,y){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 200 200');
  svg.style.position='fixed'; svg.style.left=(x-100)+'px'; svg.style.top=(y-100)+'px';
  svg.style.width='200px'; svg.style.height='200px';
  svg.style.pointerEvents='none'; svg.style.zIndex=295;
  for(let i=0;i<12;i++){
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    const a=(i/12)*Math.PI*2;
    line.setAttribute('x1',100+Math.cos(a)*20);
    line.setAttribute('y1',100+Math.sin(a)*20);
    line.setAttribute('x2',100+Math.cos(a)*90);
    line.setAttribute('y2',100+Math.sin(a)*90);
    line.setAttribute('stroke','rgba(245,197,66,0.9)');
    line.setAttribute('stroke-width','2');
    line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
  }
  document.body.appendChild(svg);
  setTimeout(()=>svg.remove(),700);
}
function shake(level='normal'){
  const app=document.getElementById('app');

}

/* Kombonivåer: varje nivå ger fler chips och mult. Nivå 5 och 8 ger dessutom en mästarbonus på mult. */
const COMBO_ORDER=['Fem lika','Straight Flush','Fyrtal','Full house','Stege','Färg','Triss','Två par','Par','Högsta'];
const COMBO_INC={'Högsta':{chips:10,mult:1},'Par':{chips:15,mult:1},'Två par':{chips:20,mult:1},'Triss':{chips:20,mult:2},
  'Stege':{chips:30,mult:3},'Färg':{chips:15,mult:2},'Full house':{chips:25,mult:2},'Fyrtal':{chips:30,mult:3},
  'Straight Flush':{chips:40,mult:4},'Fem lika':{chips:35,mult:3}};
const COMBO_BASE_PRICE={'Högsta':3,'Par':3,'Två par':4,'Triss':4,'Stege':4,'Färg':4,'Full house':5,'Fyrtal':6,'Straight Flush':7,'Fem lika':7};
const COMBO_MAX_LEVEL=10;
function comboLevel(key){return (state&&state.comboLevels&&state.comboLevels[key])||1}
function masteryMult(lv){return lv>=8?1.5:lv>=5?1.25:1}
function comboWithLevel(key){
  const base=COMBOS[key],inc=COMBO_INC[key],lv=comboLevel(key);
  return {key,...base,level:lv,
    chips:base.chips+inc.chips*(lv-1),
    mult:Math.round((base.mult+inc.mult*(lv-1))*masteryMult(lv)*100)/100};
}
function detectCombo(dice){
  if(!dice.length) return comboWithLevel('Högsta');
  const active=dice.filter(d=>d.mod!=='sten');
  if(!active.length) return comboWithLevel('Högsta');
  const values=active.map(d=>d.value), colors=active.map(d=>d.color);
  const counts={}; values.forEach(v=>counts[v]=(counts[v]||0)+1);
  const cv=Object.values(counts).sort((a,b)=>b-a);
  const sortedV=[...values].sort((a,b)=>a-b);
  const isFlush=colors.length>=5 && colors.every(c=>c===colors[0]);
  const uniq=[...new Set(sortedV)];
  const isStraight=uniq.length===sortedV.length && sortedV.length>=5 &&
    uniq.every((v,i)=>i===0||v===uniq[i-1]+1);
  if(isFlush&&isStraight&&sortedV.length>=5) return comboWithLevel('Straight Flush');
  if(cv[0]>=5) return comboWithLevel('Fem lika');
  if(cv[0]>=4) return comboWithLevel('Fyrtal');
  if(cv[0]===3 && cv[1]>=2) return comboWithLevel('Full house');
  if(isStraight) return comboWithLevel('Stege');
  if(isFlush) return comboWithLevel('Färg');
  if(cv[0]>=3) return comboWithLevel('Triss');
  if(cv[0]>=2 && cv[1]>=2) return comboWithLevel('Två par');
  if(cv[0]>=2) return comboWithLevel('Par');
  return comboWithLevel('Högsta');
}

const RICO_PAL={common:['#cfd2dc','#6c7186'],uncommon:['#8cc4ff','#2f6fc4'],rare:['#e2a0ff','#8a2fc4'],legendary:['#ffe58a','#c48a14']};
const _ricoCache={};
function ricoURL(r){
  const key=r.id||r.name.en;
  if(_ricoCache[key]) return _ricoCache[key];
  let h=2166136261;for(const ch of key){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296};
  const pal=RICO_PAL[r.r]||RICO_PAL.common, N=9, grid=[];
  for(let y=0;y<N;y++){grid.push([]);for(let x=0;x<5;x++){
    // kärna först (läsbar siluett), därefter slumpade kanter och detaljer
    const core=(x>=2&&y>=2&&y<=N-3)||(x>=1&&y>=3&&y<=N-4);
    const v=rnd();
    grid[y].push(core?(v<.35?2:1):(v<.38?1:0));
  }}
  grid[Math.floor(N/2)][4]=2;grid[Math.floor(N/2)][3]=1;
  const c=document.createElement('canvas');c.width=c.height=N+2;
  const g=c.getContext('2d');
  const at=(x,y)=>(x<0||y<0||x>=N||y>=N)?0:grid[y][x<5?x:N-1-x];
  for(let y=-1;y<=N;y++)for(let x=-1;x<=N;x++){
    const v=at(x,y);
    if(v){g.fillStyle=v===2?pal[0]:pal[1];g.fillRect(x+1,y+1,1,1)}
    else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){g.fillStyle='#1a1326';g.fillRect(x+1,y+1,1,1)}
  }
  // highlight uppe till vänster på första fyllda pixeln
  outer:for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(at(x,y)){g.fillStyle='#ffffff';g.globalAlpha=.85;g.fillRect(x+1,y+1,1,1);g.globalAlpha=1;break outer}
  return _ricoCache[key]=c.toDataURL();
}
function relicIco(r){
  const k=ICON_MAP[r.icon];
  const inner=k?spr(k):'<span class="spr" style="background-image:url('+ricoURL(r)+')"></span>';
  return '<span class="rico rico-'+(r.r||'common')+'">'+inner+'</span>';
}

function randDie(){
  const isWild=state.relics.some(r=>r.id==='wild_dice');
  return {
    value:1+Math.floor(Math.random()*6),
    color:Math.floor(Math.random()*COLORS.length),
    mod:isWild&&Math.random()<0.1?'vild':null,
  };
}
function hasRelic(id){return state.relics.some(r=>r.id===id);}

function renderDie(d,idx,held){
  const col=COLORS[d.color];
  const skin=DICE_SKINS[state.skin]||DICE_SKINS.classic;
  const el=document.createElement('div');
  el.className='die'+(held?' held':'');
  el.style.setProperty('--dc',col.hex);
  if(!d.mod) el.style.background=skin.style;
  el.dataset.idx=idx;
  if(d.mod) el.dataset.mod=d.mod;
  const v=d.value;
  (PIP_MAP[v]||PIP_MAP[1]).forEach(([r,c])=>{
    const pip=document.createElement('div');
    pip.className='pip';
    pip.style.gridArea=`${r}/${c}`;
    if(skin.color) pip.style.background=`radial-gradient(circle at 30% 30%,${skin.color},#1a1326 70%)`;
    el.appendChild(pip);
  });
  if(d.mod){
    const badge=document.createElement('div');
    badge.className='mod-badge';
    badge.textContent=MODS[d.mod].icon;
    el.appendChild(badge);
  }
  el.onclick=()=>toggleHold(idx);
  el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-pressed',held?'true':'false');
  el.setAttribute('aria-label',(LANG==='sv'?'Tärning ':'Die ')+d.value);
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleHold(idx)}};
  return el;
}

function updateProgress(){
  const pct=Math.min(100,(state.roundScore/state.target)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=
    `${state.roundScore.toLocaleString()} / ${state.target.toLocaleString()}`;
}

function updateComboPreview(){
  const banner=document.getElementById('combo-banner');
  const nameEl=document.getElementById('combo-name');
  const subEl=document.getElementById('combo-sub');
  if(!state.dice.length||!state.rollsUsed){
    banner.classList.add('none');
    nameEl.textContent='—';
    subEl.textContent=t('roll_dice');
    return;
  }
  const combo=detectCombo(state.dice);
  banner.classList.remove('none');
  nameEl.textContent=combo.name[LANG].toUpperCase();
  const sum=state.dice.reduce((a,d)=>a+d.value,0);
  subEl.textContent=`LV ${combo.level}${combo.level>=5?'★':''}  •  ${combo.chips} × ${combo.mult}  •  ${sum}  •  ~${estimateScore().toLocaleString()}`;
  // Tier classes
  banner.classList.remove('tier-1','tier-2','tier-3','tier-4','tier-5');
  const tierMap={'Högsta':1,'Par':1,'Två par':2,'Triss':2,'Färg':3,'Stege':3,'Full house':3,'Fyrtal':4,'Fem lika':5,'Straight Flush':5};
  banner.classList.add('tier-'+(tierMap[combo.key]||1));
}
function estimateScore(){
  try{
    const dice=state.dice.slice();
    if(!dice.length) return 0;
    const combo=detectCombo(dice);
    const ctx={dice,combo,chips:combo.chips,mult:combo.mult,
      rollsUsed:state.rollsUsed,maxRolls:state.maxRolls,
      rerolled:state.rerolledThisHand,noRerolls:state.noRerolls,gold:0};
    dice.forEach(d=>ctx.chips+=d.value);
    dice.forEach(d=>{if(d.mod&&MODS[d.mod])MODS[d.mod].apply(ctx)});
    state.relics.forEach(r=>{if(r.ef)try{r.ef(ctx)}catch(e){}});
    return Math.floor(ctx.chips*ctx.mult);
  }catch(e){return 0;}
}

function startRun(opts={}){
  state.ante=1;state.blindIdx=0;state.money=4;
  state.comboLevels={};state.tabletSlots=2;state.focusTablet=false;
  state.relics=[];state.handSize=5;state.baseHand=5;state.baseRolls=3;state.baseDiscards=3;
  state.maxHands=3;state.maxRolls=3;state.maxDiscards=3;
  state.relicSlots=5;state.shopSlots=4;state.discount=1;state.interest=false;
  state.shopRerollCost=2;state.vouchers=[];
  state.endless=opts.endless||false;
  state.difficulty=opts.difficulty||state.difficulty||'normal';
  state.seed=opts.seed??null;
  state.stats.runs++;state.totalRuns++;
  state.stats.handsPlayed=0;state.stats.bossKills=0;
  state.stats.bossSeen={};

function showBlindSelect(){
  state.phase='blind-select';
  let base=ANTE_BASE[state.ante]||ANTE_BASE[ANTE_BASE.length-1]*Math.pow(1.8,state.ante-8);
  let target=Math.floor(base*BLIND_MULT[state.blindIdx]);
  if(hasRelic('evigslöja')&&state.blindIdx===2) target=Math.floor(target/2);
  if(hasRelic('dommedag')&&state.blindIdx===2) target=Math.floor(target/2);
  if(state.difficulty==='easy') target=Math.floor(target*0.75);
  if(state.difficulty==='hard') target=Math.floor(target*1.35);
  state.target=target;
  if(state.blindIdx===2){
    state.boss=BOSSES[(state.ante-1)%BOSSES.length];
    state.stats.bossSeen[state.boss.name.sv]=true;
  } else state.boss=null;
  const ov=document.getElementById('overlay');
  ov.classList.add('active');
  const bossDesc=state.boss?`<span style="color:#ff994d">⚠️ ${state.boss.desc[LANG]}</span>`:'';
  ov.innerHTML=`
    <div class="modal">
      <h2>${t('ante')} ${state.endless&&state.ante>8?'∞ '+state.ante:state.ante}</h2>
      <p>${t('choice_blind')}</p>
      <div class="blind-card blind-${state.blindIdx}" onclick="startBlind()">
        <div class="icon">${state.boss?bossIcon(state.boss):BLIND_ICONS[state.blindIdx]}</div>
        <div class="info">
          <b>${state.boss?state.boss.name[LANG]:t(['small_blind','big_blind','boss_blind'][state.blindIdx])+' '+t('blind')}
            ${state.blindIdx===2?`<span class="boss-tag">${t('boss')}</span>`:''}</b>
          <span>${state.maxHands} • ${state.baseRolls} ${t('label_rolls')} • ${state.baseDiscards} ${t('label_discards')}</span>
          ${bossDesc}
        </div>
        <div class="target">${target.toLocaleString()}</div>
      </div>
      <div class="buttons">
        <button class="primary" onclick="startBlind()">${t('play')}</button>
        ${state.blindIdx<2?`<button onclick="skipBlind()">${t('skip_blind')}</button>`:''}
        <button onclick="confirmQuit()">${t('main_menu')}</button>
      </div>
    </div>`;
}
function skipBlind(){
  state.money+=1;
  log('⏭️ +1💰');
  nextBlind();
}
function startBlind(){
  document.getElementById('overlay').classList.remove('active');
  state.phase='playing';
  state.roundScore=0;
  state.hands=state.maxHands;
  refreshHandSize();
  if(state.boss) state.boss.apply(state);
  state.rolls=state.maxRolls;
  state.discards=state.maxDiscards;
  state.held=new Set();
  state.dice=[];
  state.rollsUsed=0;state.rerolledThisHand=0;state.noRerolls=true;
  state.handsLost=0;state.comboHistory=[];
  state.blindStartTime=Date.now();
  state.relics.forEach(r=>{
    if(r.id==='kopparmynt'){state.money+=2;log('🟠 +2💰')}
    if(r.id==='skattkista'){state.money+=3;log('💰 +3💰')}
    if(r.id==='fickur'){state.rolls+=1}
  });
  render();
  document.getElementById('score-display').style.display='none';
  document.getElementById('combo-banner').classList.add('none');
  rollDice(true);
}
function refreshHandSize(){
  let hs=state.baseHand,mr=state.baseRolls,md=state.baseDiscards;
  state.relics.forEach(r=>{
    switch(r.id){
      case 'ladervaska':hs+=1;break;
      case 'livetskalla':hs+=2;break;
      case 'femtetarning':hs+=1;break;
      case 'sjundesinnet':hs+=1;break;
      case 'anglavinge':hs+=1;break;
      case 'dungeonmaster':hs+=Math.floor(state.stats.bossKills/3);break;
      case 'vandringsstav':if(state.blindIdx===2)hs+=1;break;
      case 'oandligheten':hs+=3;break;
      case 'skoldpadda':hs-=1;break;
      case 'blytarning':hs-=1;break;
      case 'extrakast':mr+=1;break;
      case 'skoldpadda':mr+=1;break;
      case 'evighetsuret':mr+=2;break;
      case 'tidsklocka':mr+=1;break;
      case 'pappersflygplan':mr+=1;break;
      case 'eviglopp':mr+=1;break;
      case 'sjundesinnet':mr+=1;break;
      case 'hemligficka':md+=1;break;
      case 'kortspelvana':md+=2;break;
      case 'tidsklocka':md-=1;break;
      case 'anglavinge':md-=2;break;
    }
  });
  state.handSize=Math.max(2,hs);
  state.maxRolls=Math.max(1,mr);
  state.maxDiscards=Math.max(0,md);
}
function applyComboRelics(idxs){
  const D=state.dice;if(!idxs.length||!D.length)return;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(hasRelic('k_magnet')){
    const cnt={};D.forEach(d=>cnt[d.value]=(cnt[d.value]||0)+1);
    let best=0,bc=0;for(const v in cnt){if(cnt[v]>bc){bc=cnt[v];best=+v}}
    const cand=idxs.filter(i=>D[i].value!==best);
    if(bc>=2&&cand.length){D[pick(cand)].value=best;log('🧲 '+(LANG==='sv'?'Likhetsmagnet':'Pair Magnet'),'#4d9fff')}
  }
  if(hasRelic('k_stege')){
    const vals=D.map(d=>d.value),set=new Set(vals);
    const dup=idxs.filter(i=>vals.filter(v=>v===D[i].value).length>1);
    const need=[];for(let v=1;v<=6;v++){if(!set.has(v)&&(set.has(v-1)||set.has(v+1)))need.push(v)}
    if(dup.length&&need.length){D[pick(dup)].value=pick(need);log('🏗️ '+(LANG==='sv'?'Stegbyggaren':'Ladder Builder'),'#4d9fff')}
  }
  if(hasRelic('k_farg')){
    const cnt={};D.forEach(d=>cnt[d.color]=(cnt[d.color]||0)+1);
    let best=-1,bc=0;for(const c in cnt){if(cnt[c]>bc){bc=cnt[c];best=+c}}
    const cand=idxs.filter(i=>D[i].color!==best);
    if(bc>=2&&cand.length){D[pick(cand)].color=best;log('🎨 '+(LANG==='sv'?'Färgdoppet':'Color Dip'),'#4d9fff')}
  }
}
function rollDice(initial=false){
  if(!initial&&state.rolls<=0) return;
  if(!initial) state.rolls--;
  state.rollsUsed++;
  Sound.roll();
  while(state.dice.length<state.handSize) state.dice.push(randDie());
  const toReroll=[];
  state.dice.forEach((d,i)=>{if(!state.held.has(i))toReroll.push(i)});
  if(toReroll.length) state.noRerolls=false;
  state.rerolledThisHand+=toReroll.length;
  toReroll.forEach(i=>{state.dice[i]=randDie()});
  applyComboRelics(toReroll);
  const glassChance=(state.boss&&state.boss.desc.sv.includes('Glas'))?0.5:0.25;
  if(!hasRelic('oljelampa')){
    for(let i=state.dice.length-1;i>=0;i--){
      if(state.dice[i].mod==='glas'&&Math.random()<glassChance){
        log('💎 Broken!','#4d9fff');
        state.stats.glassBroken++;
        state.dice.splice(i,1);
        burst(innerWidth/2,innerHeight/2,['💎','✨','💥'],6);
      }
    }
  }
  if(state.boss&&state.boss.desc.sv.includes('guld per kast')) state.money=Math.max(0,state.money-1);
  state.held=new Set();
  render();
}
function toggleHold(idx){
  if(state.phase!=='playing') return;
  if(state.held.has(idx)){Sound.unhold();state.held.delete(idx)}
  else{Sound.hold();state.held.add(idx)}
  // Uppdatera bara den valda tärningen så att de andra inte animeras om
  const da=document.getElementById('dice-area');
  const el=da.querySelector('.die[data-idx="'+idx+'"]');
  if(!el){render();return}
  da.classList.add('no-land');
  el.classList.toggle('held',state.held.has(idx));
  el.setAttribute('aria-pressed',state.held.has(idx)?'true':'false');
  da.classList.toggle('has-held',state.held.size>0);
  updateComboPreview();
  document.getElementById('score-btn').disabled=state.phase!=='playing'||state.rollsUsed===0;
}
function sortDice(){
  state.dice.sort((a,b)=>a.value-b.value);
  state.held=new Set();
  render();
}
function holdAllMatching(){
  if(!state.dice.length) return;
  const counts={};
  state.dice.forEach(d=>counts[d.value]=(counts[d.value]||0)+1);
  let best=0,bestCount=0;
  Object.entries(counts).forEach(([v,c])=>{if(c>bestCount){bestCount=c;best=+v}});
  if(bestCount<2){log('❌ No match','#ff994d');return;}
  state.held=new Set();
  state.dice.forEach((d,i)=>{if(d.value===best)state.held.add(i)});
  render();
}
function discardHeld(){
  if(state.phase!=='playing'||!state.held.size||state.discards<=0) return;
  state.discards--;
  const newDice=[];
  state.dice.forEach((d,i)=>{if(!state.held.has(i))newDice.push(d)});
  state.dice=newDice;
  state.held=new Set();
  rollDice(false);
}

/* ========================
   SCORING
   ======================== */
function scoreHand(){
  if(state.phase!=='playing') return;
  const dice=state.dice.slice();
  if(!dice.length) return;
  const combo=detectCombo(dice);
  const ctx={
    dice,combo,chips:combo.chips,mult:combo.mult,
    rollsUsed:state.rollsUsed,maxRolls:state.maxRolls,
    rerolled:state.rerolledThisHand,noRerolls:state.noRerolls,
    gold:0,extraRoll:0,
  };
  dice.forEach(d=>ctx.chips+=d.value);
  dice.forEach(d=>{if(d.mod&&MODS[d.mod])MODS[d.mod].apply(ctx)});
  const noMult=state.boss&&state.boss.desc.sv.includes('Mult-reliker');
  state.relics.forEach(r=>{
    if(!r.ef) return;
    if(noMult&&r.desc.sv.includes('mult')) return;
    try{r.ef(ctx)}catch(e){}
  });
  if(state.boss&&state.boss.desc.sv.includes('halverad')) ctx.mult*=0.5;
  if(state.boss&&state.boss.desc.sv.includes('Kräver')){
    const c={};dice.forEach(d=>c[d.value]=(c[d.value]||0)+1);
    if(Object.values(c).filter(v=>v>=2).length<2){ctx.mult=0;log('😈 Need 2 pairs','#ff4d5e')}
  }
  if(state.boss&&state.boss.desc.sv.includes('Slumpmässig')){
    const r=Math.random();if(r<0.5)ctx.mult*=1.5;else ctx.chips*=1.5;
  }
  let total=Math.floor(ctx.chips*ctx.mult);
  state.roundScore+=total;
  state.stats.totalScore+=total;
  if(total>state.stats.maxScore) state.stats.maxScore=total;
  if(state.roundScore>state.bestScore) state.bestScore=state.roundScore;
  state.stats.combos[combo.key]=(state.stats.combos[combo.key]||0)+1;
  state.stats.handsPlayed++;
  if(dice.length>state.stats.maxDiceScored) state.stats.maxDiceScored=dice.length;

  // Score display
  const dCh=document.getElementById('d-chips'),dM=document.getElementById('d-mult'),dT=document.getElementById('d-total');
  dCh.textContent=Math.floor(ctx.chips).toLocaleString();
  dM.textContent=ctx.mult.toFixed(2).replace(/\.00$/,'');
  dT.textContent=total.toLocaleString();
  dCh.classList.remove('pop');dM.classList.remove('pop');dT.classList.remove('pop');
  void dCh.offsetWidth;
  dCh.classList.add('pop');dM.classList.add('pop');dT.classList.add('pop');
  document.getElementById('score-display').style.display='flex';
  const rect=document.getElementById('combo-banner').getBoundingClientRect();
  popupScore('+'+total.toLocaleString(),rect.left+rect.width/2-60,rect.top,total>1000?'#ff6b8a':'#f5c542');

  if(total>2000){Sound.bigScore();}
  else Sound.score();
  if(total>500){burst(innerWidth/2,innerHeight/3,['✨','⭐','💫','🌟'],10);}
  if(total>5000){
    burst(innerWidth/2,innerHeight/2,['💎','👑','🌟','💥'],18);
    screenFlash('rgba(245,197,66,0.55)');
    radialBurst(innerWidth/2,innerHeight/2);
    shake('hard');
  } else if(total>1000){shake('normal');}

  if(ctx.gold){state.money=Math.max(0,state.money+ctx.gold);log(`💰 ${ctx.gold>0?'+':''}${ctx.gold}`)}
  log(`${combo.name[LANG]} → ${Math.floor(ctx.chips)} × ${ctx.mult.toFixed(2)} = ${total.toLocaleString()}`);
  state.comboHistory.push({name:combo.key,score:total});
  if(ctx.extraRoll){state.maxRolls+=ctx.extraRoll;state.rolls=state.maxRolls}

  state.hands--;
  state.dice=[];state.held=new Set();
  state.rollsUsed=0;state.rerolledThisHand=0;state.noRerolls=true;
  state.rolls=state.maxRolls;

  if(state.roundScore>=state.target) setTimeout(()=>winBlind(),600);
  else if(state.hands<=0){state.handsLost++;setTimeout(()=>loseBlind(),600);}
  else setTimeout(()=>{render();rollDice(true)},300);
  render();
}

function winBlind(){
  state.phase='reward';
  Sound.win();
  confetti(80);
  burst(innerWidth/2,innerHeight/3,['🏆','✨','💰','⭐'],20);
  radialBurst(innerWidth/2,innerHeight/3);
  let reward=3+Math.floor(state.money/5);
  if(hasRelic('skattkista')&&state.blindIdx===2){reward+=1;log('💰 Boss bonus!')}
  if(state.interest) reward+=Math.floor(state.money/5);
  state.money+=reward;
  if(state.money>state.stats.maxMoney) state.stats.maxMoney=state.money;
  if(state.blindIdx===2) state.stats.bossKills++;
  const blindTime=(Date.now()-state.blindStartTime)/1000;
  if(!state.stats.fastestBlind||blindTime<state.stats.fastestBlind) state.stats.fastestBlind=blindTime;
  state.relics.forEach(r=>state.seenRelicsSet.add(r.id));
  state.stats.seenRelics=state.seenRelicsSet.size;
  if(state.relics.length>state.stats.maxRelics) state.stats.maxRelics=state.relics.length;
  state.stats.maxLegendary=Math.max(state.stats.maxLegendary||0,state.relics.filter(r=>r.r==='legendary').length);
  if(state.handsLost===0) state.stats.perfectWins=(state.stats.perfectWins||0)+1;
  if(state.hands===1&&state.roundScore>=state.target) state.stats.oneHandWins++;
  if(state.noRerolls&&state.roundScore>=state.target) state.stats.noRerollWins=(state.stats.noRerollWins||0)+1;
  checkAchievements();
  Save.save(state);

  const ov=document.getElementById('overlay');
  ov.classList.add('active');
  ov.innerHTML=`
    <div class="modal">
      <h2>✨ ${t('blind_cleared')} ✨</h2>
      <p>${t('reached')} ${state.roundScore.toLocaleString()} / ${state.target.toLocaleString()} ${t('points')}.</p>
      <p style="color:var(--gold);font-size:20px">${t('reward')}: +${reward} 💰</p>
      ${state.comboHistory.length?`<p style="font-size:11px">${t('recently')}: ${state.comboHistory.slice(-3).map(c=>COMBOS[c.name].name[LANG]).join(', ')}</p>`:''}
      <div class="buttons">
        <button class="gold" onclick="openShop()">${t('reward_shop')}</button>
        <button onclick="nextBlind()">${t('shop_skip')}</button>
      </div>
    </div>`;
}

function loseBlind(){
  if(!state.phoenixUsed&&(hasRelic('fenixfjader')||hasRelic('fagelfenix')||hasRelic('sistatarningen'))){
    state.phoenixUsed=true;
    if(hasRelic('sistatarningen')){
      const r=1+Math.floor(Math.random()*6);
      log('🎲 '+r);
      if(r===6){winBlind();return;}
    }
    if(hasRelic('fenixfjader')||hasRelic('fagelfenix')){
      log('🦅 Phoenix!');
      const ov=document.getElementById('overlay');
      ov.classList.add('active');
      ov.innerHTML=`<div class="modal">
        <h2 style="color:#ff994d">${t('phoenix_save')}</h2>
        <p>${t('phoenix_desc')} (${Math.floor(state.target/2).toLocaleString()})</p>
        <div class="buttons"><button class="primary" onclick="phoenixSave()">${t('continue_')}</button></div>
      </div>`;
      return;
    }
  }
  state.phase='gameover';
  Sound.lose();
  shake('hard');
  if(state.ante>state.bestAnte){state.bestAnte=state.ante;state.stats.bestAnte=state.ante;}
  checkAchievements();
  Save.save(state);
  const ov=document.getElementById('overlay');
  ov.classList.add('active');
  ov.innerHTML=`<div class="modal">
    <h2 style="color:#ff4d5e">💀 ${t('you_died')} 💀</h2>
    <p>${t('you_reached')} ${state.roundScore.toLocaleString()} ${t('of')} ${state.target.toLocaleString()} ${t('points')}.</p>
    <p>${t('ante')} ${state.ante} • ${state.relics.length} • ${state.stats.bossKills} ${t('killed_by')}</p>
    <div class="buttons">
      <button class="primary" onclick="startRun({seed:${state.seed?JSON.stringify(state.seed):'null'}})">${t('try_again')}</button>
      <button onclick="showMainMenu()">${t('main_menu')}</button>
    </div>
  </div>`;
}
function phoenixSave(){
  document.getElementById('overlay').classList.remove('active');
  state.roundScore=Math.floor(state.target/2);
  winBlind();
}

   BUTIK
   ======================== */
function openShop(){
  state.phase='shop';
  state.shopItems=[];
  const slots=state.shopSlots+(hasRelic('fjaderpenna')?1:0)+(hasRelic('nyckelringen')?1:0);
  const used=new Set(state.relics.map(r=>r.id));
  const pool=RELIC_POOL.filter(r=>!used.has(r.id));
  for(let i=0;i<slots;i++){
    if(!pool.length) break;
    const r=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let price=Math.floor(r.price*state.discount);
    if(hasRelic('ambassador')) price=Math.floor(price*0.8);
    if(state.boss&&state.boss.desc.sv.includes('dubbelt')) price*=2;
    state.shopItems.push({type:'relic',data:r,price:Math.max(1,price),sold:false});
  }
  const modPool=[...DICE_MOD_ITEMS];
  for(let i=0;i<2;i++){
    const m=modPool.splice(Math.floor(Math.random()*modPool.length),1)[0];
    if(m) state.shopItems.push({type:'mod',data:m,price:m.price,sold:false});
  }
  // Kombotavlor: höjer nivån på en kombination. Vikt efter hur mycket du spelat den, så man kan satsa vidare eller bredda.
  const plays={};state.comboHistory.forEach(h=>plays[h.name]=(plays[h.name]||0)+1);
  let tabs=COMBO_ORDER.filter(k=>comboLevel(k)<COMBO_MAX_LEVEL);
  const nTab=state.tabletSlots||2;
  for(let i=0;i<nTab&&tabs.length;i++){
    let k;
    if(i===0&&state.focusTablet&&Object.keys(plays).length){
      const best=Object.keys(plays).filter(x=>tabs.includes(x)).sort((x,y)=>plays[y]-plays[x])[0];
      k=best||tabs[0];
    }else{
      const w=tabs.map(x=>1+2*(plays[x]||0));let r=Math.random()*w.reduce((x,y)=>x+y,0),j=0;
      while(j<tabs.length-1&&(r-=w[j])>0)j++;
      k=tabs[j];
    }
    tabs=tabs.filter(x=>x!==k);
    const lv=comboLevel(k),inc=COMBO_INC[k];
    let price=Math.max(1,Math.floor((COMBO_BASE_PRICE[k]+(lv-1))*state.discount));
    if(state.boss&&state.boss.desc.sv.includes('dubbelt')) price*=2;
    state.shopItems.push({type:'combo',key:k,price,sold:false,data:{
      name:{sv:COMBOS[k].name.sv+'-tavla',en:COMBOS[k].name.en+' Tablet'},icon:'📜',
      desc:{sv:`Nivå ${lv} → ${lv+1}: +${inc.chips} chips, +${inc.mult} mult${lv+1===5||lv+1===8?' och mästarbonus!':''}`,
            en:`Level ${lv} → ${lv+1}: +${inc.chips} chips, +${inc.mult} mult${lv+1===5||lv+1===8?' and mastery bonus!':''}`}}});
  }
  renderShop();
}
function renderShop(){
  const ov=document.getElementById('overlay');
  ov.classList.add('active');
  const itemsHtml=state.shopItems.map((it,i)=>{
    if(it.sold) return `<div class="shop-item sold"><div class="icon">${it.type==='relic'?relicIco(it.data):ico(it.data.icon)}</div><div class="name">${it.data.name[LANG]}</div><div class="price">${t('sold')}</div></div>`;
    const cls=it.type==='relic'?(it.data.r==='rare'?'rare':it.data.r==='legendary'?'legendary':''):(it.type==='combo'?'combo':'');
    return `<div class="shop-item ${cls}" onclick="buyItem(${i})">
      <div class="icon">${it.type==='relic'?relicIco(it.data):ico(it.data.icon)}</div>
      <div class="name">${it.data.name[LANG]}</div>
      <div class="desc">${balaDesc(it.data.desc[LANG])}</div>
      <div class="price">${ico('💰')} ${it.price}</div>
    </div>`;
  }).join('');
  ov.innerHTML=`<div class="modal wide">
    <h2>🛒 ${t('shop')}</h2>
    <p>${t('money')}: <b style="color:var(--gold)">${state.money}</b> • ${t('label_slots')}: ${state.relics.length}/${state.relicSlots}</p>
    <div class="shop-grid">${itemsHtml}</div>
    <div class="buttons">
      <button onclick="rerollShop()">🔄 (${state.shopRerollCost}💰)</button>
      <button onclick="openVoucherShop()">🎟️ ${t('vouchers')}</button>
      <button class="primary" onclick="nextBlind()">${t('next_blind')} →</button>
    </div>
  </div>`;
}
function buyItem(i){
  const it=state.shopItems[i];
  if(!it||it.sold) return;
  let free=false;
  if(hasRelic('lyckokatt')&&Math.random()<0.1){free=true;log('🐈 Free!')}
  if(!free&&state.money<it.price){log('❌ '+t('not_enough_gold'),'#ff4d5e');Sound.error();return}
  if(it.type==='relic'&&state.relics.length>=state.relicSlots){log('❌ '+t('no_free_slots'),'#ff4d5e');Sound.error();return}
  if(!free) state.money-=it.price;
  it.sold=true;
  if(it.type==='relic'){
    state.relics.push(it.data);
    log(`✅ ${it.data.name[LANG]}`);
    refreshHandSize();
    burst(innerWidth/2,innerHeight/2,['✨','⭐'],6);
  } else if(it.type==='combo'){
    state.comboLevels=state.comboLevels||{};
    state.comboLevels[it.key]=comboLevel(it.key)+1;
    log(`📜 ${COMBOS[it.key].name[LANG]} → ${LANG==='sv'?'nivå':'level'} ${state.comboLevels[it.key]}`);
    burst(innerWidth/2,innerHeight/2,['✨','⭐','💫'],8);
  } else if(it.type==='mod'){
    const d=randDie();
    d.mod=it.data.mod;
    state.dice.push(d);
    log(`🔧 ${it.data.name[LANG]}`);
  }
  Sound.buy();
  renderShop();
  render();
}
function rerollShop(){
  if(state.money<state.shopRerollCost){log('❌','#ff4d5e');Sound.error();return}
  state.money-=state.shopRerollCost;
  openShop();
}

}

      <div class="hist-row"><span>${t('ante')}</span><b>${state.ante}</b></div>

      <div class="hist-row"><span>${t('combos_label')}</span><b>${state.comboHistory.length}</b></div>
    `;
  }
}

function selectSkin(id){
  const s=DICE_SKINS[id];
  if(!state.unlockedDice[id]){
    if(state.money<s.cost){log('❌ '+t('not_enough_gold'),'#ff4d5e');Sound.error();return}
    state.money-=s.cost;
    state.unlockedDice[id]=true;
    log('✅ '+s.name[LANG]);
  }
  state.skin=id;
  Save.save(state);
  render();
  openDiceSkins();
}

window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  switch(e.key.toLowerCase()){
    case 'r': if(state.phase==='playing'&&state.rolls>0) rollDice(false); break;
    case ' ':
      e.preventDefault();
      if(state.phase==='playing'&&state.rollsUsed>0) scoreHand();
      break;
    case 's': sortDice(); break;
    case 'h': holdAllMatching(); break;
    case 'd': discardHeld(); break;
    case 'escape': closeOverlay(); break;
    case 'm': toggleMute(); break;
    case 'l': toggleLang(); break;
  }
});

});
