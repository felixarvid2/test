/* ---------- Diagram ---------- */
/* 589 Poäng per blind: stapel = poäng/mål, linjen är målet (100 %) */
function blindChart(blinds,partial){
  const rows=(blinds||[]).slice();
  if(partial) rows.push(partial);
  if(!rows.length) return `<p class="h-empty">${L('Inga blinds ännu.','No blinds yet.')}</p>`;
  const nm=['small_blind','big_blind','boss_blind'].map(k=>t(k));
  const body=rows.map(b=>{
    const ratio=b.target>0?b.score/b.target:0;
    const w=Math.min(ratio,2)/2*100;
    const cls=b.part?'part':b.ok?'ok':'bad';
    return `<div class="h-bar-row"><span class="h-bl">A${b.ante} ${nm[b.idx]||''}</span>
      <div class="h-bar ${cls}" role="img" aria-label="${fmt(b.score)} / ${fmt(b.target)}"><i style="width:${w.toFixed(1)}%"></i><u></u></div>
      <span class="h-bv">${b.part?'…':b.ok?'✓':'✗'} ${fmt(b.score)}<small> / ${fmt(b.target)}</small></span></div>`;
  }).join('');
  return `<div class="h-chart">${body}</div><p class="h-note"><span class="h-key"></span> ${L('Linjen = målet (100 %)','Line = target (100%)')}</p>`;
}
/* 590 Kombohistogram: antal spelade händer per kombo */
function comboHisto(){
  const c=state.stats.combos;
  const max=Math.max(1,...COMBO_ORDER.map(k=>num(c[k],0)));
  const rows=COMBO_ORDER.map(k=>{
    const v=num(c[k],0);
    return `<div class="h-bar-row"><span class="h-bl">${esc(cname(k))}</span>
      <div class="h-bar" role="img" aria-label="${v}"><i style="width:${(v/max*100).toFixed(1)}%"></i></div><span class="h-bv">${fmt(v)}</span></div>`;
  }).join('');
  const extra=Object.keys(c).filter(k=>!COMBOS[k]);
  return `<div class="h-chart">${rows}</div>`+(extra.length?`<p class="h-note">+ ${extra.length} ?</p>`:'');
}
function curBlindPartial(){
  if(R&&(state.phase==='playing')&&state.target>0) return {ante:state.ante,idx:state.blindIdx,score:state.roundScore,target:state.target,part:true};
  return null;
}
function lastBlinds(){
  if(R&&!R.done) return R.blinds;
  if(R&&R.done) return R.blinds;
  return M.last&&Array.isArray(M.last.blinds)?M.last.blinds:[];
}
const dateStr=t=>{try{return new Date(t).toLocaleDateString(LANG==='sv'?'sv-SE':'en-GB')}catch(e){return ''}};

/* 575 Bästa händer: topp 5 genom tiderna och topp 5 i senaste run, med kombonamn */
function handList(arr){
  if(!arr||!arr.length) return `<p class="h-empty">—</p>`;
  return `<ol class="h-hands">`+arr.slice(0,5).map(h=>`<li><span>${esc(cname(h.combo))}</span><small>A${num(h.ante,0)}</small><b>${fmt(h.score)}</b></li>`).join('')+`</ol>`;
}
function bestHTML(){
  const last=(R&&R.hands.length)?R.hands.slice().sort((a,b)=>b.score-a.score):(M.last&&M.last.top)||[];
  return `<h3 class="h-h3">${L('Bästa händer någonsin','Best hands ever')}</h3>${handList(M.best)}
    <h3 class="h-h3">${L('Bästa händer i senaste run','Best hands, latest run')}</h3>${handList(last)}`;
}
/* 576 Körhistorik: senaste 10 runs med ante, poäng, datum och seed */
function histHTML(){
  if(!M.hist.length) return `<p class="h-empty">${L('Ingen historik ännu. Spela en run!','No history yet. Play a run!')}</p>`;
  const ic={won:'🏆',lost:'💀',quit:'🚪'};
  return `<div class="h-hist">`+M.hist.map((h,i)=>`<div class="h-hrow">
    <span class="h-hi">${ico(ic[h.res]||'💀')}</span>
    <span class="h-hm"><b>Ante ${num(h.ante,0)}</b> · ${fmt(h.score)} ${L('p','pts')}${h.daily?' ★':''}<br><small>${esc(dateStr(h.t))} · ${fmtTime(h.ms)}${h.seed?' · Seed '+esc(h.seed):''}</small></span>
    ${h.seed?`<button class="small h-rp" onclick="h_replay(${i})" title="${L('Spela samma seed','Replay this seed')}">↻</button>`:''}</div>`).join('')+`</div>`;
}
/* 592 Spela om en run med samma seed direkt från historiken */
window.h_replay=function(i){
  const h=M.hist[i];if(!h||!h.seed) return;
  startRun({seed:String(h.seed),endless:!!h.endless});
};
/* 591, 596 Totalt spelad tid och rekord i fliken Totalt */
function streak(){
  let n=0;const d=new Date();d.setHours(12,0,0,0);
  const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!M.daily[key(d)]) d.setDate(d.getDate()-1);
  while(M.daily[key(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
function totalPlayMs(){return state.stats.hPlayMs+((R&&!R.done&&R.hands.length)?Date.now()-R.start:0)}
function allExtra(){
  const b=M.best[0];
  const got=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  return `<div class="hist-row"><span>${L('Total speltid','Total play time')}</span><b>${fmtTime(totalPlayMs())}</b></div>
    <div class="hist-row"><span>${L('Bästa enskilda hand','Best single hand')}</span><b>${b?esc(cname(b.combo))+' '+fmt(b.score):'—'}</b></div>
    <div class="hist-row"><span>${L('Guld tjänat (belöningar)','Gold earned (rewards)')}</span><b>${fmt(state.stats.hGoldEarned)}</b></div>
    <div class="hist-row"><span>${L('Högsta kombonivå','Highest hand level')}</span><b>${state.stats.hMaxComboLevel}</b></div>
    <div class="hist-row"><span>Achievements</span><b>${got}/${ACHIEVEMENTS.length}</b></div>
    <div class="hist-row"><span>${L('Daily-serie (dagar)','Daily streak (days)')}</span><b>${streak()}</b></div>`;
}
const _statsHTML=statsHTML;
statsHTML=function(tab){
  try{
    if(tab==='blinds') return blindChart(lastBlinds(),curBlindPartial());
    if(tab==='combo') return comboHisto();
    if(tab==='best') return bestHTML();
    if(tab==='hist') return histHTML();
    if(tab==='all') return _statsHTML.apply(this,arguments)+allExtra();
  }catch(e){}
  return _statsHTML.apply(this,arguments);
};
const _openStats=openStats;
openStats=function(){
  const r=_openStats.apply(this,arguments);
  try{
    const tabs=document.querySelector('#overlay .tabs');
    if(tabs){
      [['blinds',L('Blinds','Blinds')],['best',L('Bästa händer','Best hands')],['hist',L('Historik','History')]].forEach(([k,n])=>{
        const d=document.createElement('div');d.className='tab';d.textContent=n;
        d.setAttribute('onclick',`showStatsTab('${k}',this)`);tabs.appendChild(d);
      });
    }
  }catch(e){}
  return r;
};

/* ---------- Achievement-lista ---------- */
openAchievements=function(){
  const ov=document.getElementById('overlay');
  ov.classList.add('active');
  const total=ACHIEVEMENTS.length;
  const got=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  const pct=total?Math.round(got/total*100):0;
  let html='';
  CATS.forEach(c=>{
    const list=ACHIEVEMENTS.filter(a=>catOf(a)===c);
    if(!list.length) return;
    const g=list.filter(a=>state.achievements[a.id]).length;
    html+=`<div class="h-cat"><span>${esc(CAT_NAME[c][LANG==='sv'?0:1])}</span><b>${g}/${list.length}</b></div>`;
    html+=list.map(a=>{
      const done=!!state.achievements[a.id];
      const p=!done?progOf(a):null;
      return `<div class="ach-item ${done?'unlocked':'locked'}">
        <span class="em">${done?ico(a.icon):'❓'}</span>
        <div><b>${esc(a.name[LANG])}</b><br>${esc(a.desc[LANG])}${p?`<div class="h-prog" role="img" aria-label="${p.x}/${p.y}"><i style="width:${(p.x/p.y*100).toFixed(1)}%"></i></div><small class="h-pt">${fmt(p.x)}/${fmt(p.y)}</small>`:''}</div></div>`;
    }).join('');
  });
  ov.innerHTML=`<div class="modal wide">
    <h2>${spr('gi_trophy')} ${t('achievements')}</h2>
    <p>${got}/${total} ${t('ach_unlocked')} (${pct}%)</p>
    <!-- 595 Total framstegsstapel -->
    <div class="h-prog h-prog-big" role="img" aria-label="${pct}%"><i style="width:${pct}%"></i></div>
    <div class="ach-list h-ach-list">${html}</div>
    <div class="buttons"><button onclick="closeOverlay()">${t('close')}</button></div>
  </div>`;
};

/* ---------- Run summary ---------- */
/* 582 Run summary med ikoner, 594 topp 5 händer i runnen, 581 seed + kopiera på slutskärmen */
function injectSummary(){
  const modal=document.querySelector('#overlay .modal');
  if(!modal||!M.last||modal.querySelector('.h-sum')) return;
  const o=M.last;
  const tile=(ic,v,l)=>`<div class="h-tile">${ic}<b>${v}</b><small>${l}</small></div>`;
  const html=`<div class="h-sum">
    <div class="h-tiles">${tile(ico('🛡️'),o.ante,'Ante')+tile(ico('🎒'),o.relics,L('Reliker','Relics'))+tile(ico('💀'),o.boss,L('Bossar','Bosses'))+
      tile(ico('💰'),o.money,L('Guld','Gold'))+tile(ico('📜'),o.hands,L('Händer','Hands'))+tile(ico('⏳'),fmtTime(o.ms),L('Tid','Time'))}</div>
    <h3 class="h-h3">${L('Dina bästa händer','Your best hands')} · ${fmt(o.total)} ${L('totalt','total')}</h3>${handList(o.top)}
    <div class="h-share"><span class="h-seedline">${o.seed?'Seed: <b>'+esc(o.seed)+'</b>'+(o.daily?' ★ Daily':''):L('Slumpad run (ingen seed)','Random run (no seed)')}</span>
      <button class="small" onclick="h_copyResult()">${L('Kopiera resultat','Copy result')}</button><span id="h-copy-status" class="h-note" role="status"></span></div>
    ${tipHTML()}</div>`;
  const btns=modal.querySelector('.buttons');
  if(btns) btns.insertAdjacentHTML('beforebegin',html); else modal.insertAdjacentHTML('beforeend',html);
}

/* ---------- Meny: Daily Run, märke, tips ---------- */
/* 577 Daily Run: knapp i menyn, seed från dagens datum */
window.h_startDaily=function(){
  try{getSeed()}catch(e){}
  startRun({seed:dailySeed()});
};
function decorateMenu(){
  const modal=document.querySelector('#overlay .modal');
  if(!modal||modal.querySelector('.h-daily')) return;
  const day=today(),b=M.daily[day],st=streak();
  const box=document.createElement('div');box.className='h-daily';
  box.innerHTML=`<button class="gold h-daily-btn" onclick="h_startDaily()">${spr('gi_star')} Daily Run <small>${day}</small></button>
    <div class="h-note">${b?L('Dagens bästa','Best today')+': '+fmt(b.score)+' (Ante '+b.ante+')':L('Inte spelad idag','Not played today')}${st?' · '+L('Serie','Streak')+': '+st:''}</div>`;
  const btns=modal.querySelector('.buttons');
  // Robust placering: efter Endless-knappen om menyn byggts om (agent A), annars i .buttons
  const endlessBtn=[...modal.querySelectorAll('button')].find(b=>/endless/i.test(b.getAttribute('onclick')||''));
  if(endlessBtn) endlessBtn.insertAdjacentElement('afterend',box);
  else if(btns) btns.insertBefore(box,btns.children[2]||null);
  else modal.appendChild(box);
  /* 593 Märke med antal upplåsta achievements på menyknappen */
  const got=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  modal.querySelectorAll('button').forEach(bt=>{
    if((bt.getAttribute('onclick')||'')==='openAchievements()') bt.insertAdjacentHTML('beforeend',` <small class="h-badge">${got}/${ACHIEVEMENTS.length}</small>`);
  });
  modal.insertAdjacentHTML('beforeend',tipHTML());
  /* 584 Första gången: handledningen öppnas en gång (flagga sparad). Hoppas över i automatiserad webbläsare. */
  if(!M.tut){
    M.tut=true;saveMeta();
    let auto=true;try{auto=!navigator.webdriver}catch(e){}
    if(auto) openTutorial();
  }
}

/* ---------- Handledning ---------- */
/* 583 Handledning i 5 korta steg med sprites */
const STEPS=[
  {ic:()=>ico('🎲'),t:['1. Kasta','1. Roll'],x:['Tryck Kasta för att rulla tärningarna. Du har några kast per hand.','Press Roll to throw the dice. You get a few rolls per hand.'],
    ex:()=>`<span class="h-pd">3</span><span class="h-pd">3</span><span class="h-pd">5</span><span class="h-pd">6</span><span class="h-pd">3</span>`},
  {ic:()=>spr('shield'),t:['2. Håll','2. Hold'],x:['Klicka på en tärning för att spara den, kasta sedan om resten. Släng byter ut sparade tärningar.','Click a die to keep it, then roll the rest. Discard swaps held dice for new ones.'],
    ex:()=>`<span class="h-pd on">3</span><span class="h-pd on">3</span><span class="h-pd on">3</span><span class="h-pd">6</span><span class="h-pd">5</span>`},
  {ic:()=>ico('📜'),t:['3. Poäng','3. Score'],x:['Poäng låser handen. Poängen är chips × mult, och bättre kombos ger mer.','Score locks the hand. Points are chips × mult, and better hands give more.'],
    ex:()=>`<span class="t-chips">30</span> × <span class="t-mult">3</span> = <b>90</b>`},
  {ic:()=>spr('gi_cart'),t:['4. Butik','4. Shop'],x:['Efter varje blind: köp reliker, kombotavlor och tärningsmodifierare. Guld ger ränta.','After each blind: buy relics, hand tablets and dice modifiers. Gold earns interest.'],
    ex:()=>`${ico('💰')} ${ico('📜')} ${spr('chest')}`},
  {ic:()=>spr('demon'),t:['5. Bossar','5. Bosses'],x:['Var tredje blind är en boss med en egen regel. Klara 8 antes för att vinna. Lycka till!','Every third blind is a boss with its own rule. Clear 8 antes to win. Good luck!'],
    ex:()=>`${spr('cyclops')} ${spr('wizard')} ${spr('ghost')}`},
];
let tutI=0;
function openTutorial(i){
  tutI=Math.max(0,Math.min(STEPS.length-1,i||0));
  const ov=document.getElementById('overlay');ov.classList.add('active');
  const s=STEPS[tutI];
  const dots=STEPS.map((_,k)=>`<span class="h-dot${k===tutI?' on':''}${k<tutI?' past':''}"></span>`).join('');
  const last=tutI===STEPS.length-1;
  ov.innerHTML=`<div class="modal h-tut"><div class="h-dots" role="img" aria-label="${tutI+1}/${STEPS.length}">${dots}</div>
    <div class="h-tut-ico">${s.ic()}</div><h2>${s.t[LANG==='sv'?0:1]}</h2>
    <p>${s.x[LANG==='sv'?0:1]}</p><div class="h-tut-ex">${s.ex()}</div>
    <div class="buttons">${tutI?`<button onclick="h_tut(-1)">${L('Tillbaka','Back')}</button>`:''}
      <button class="primary" onclick="h_tut(1)">${last?L('Spela!','Play!'):L('Nästa','Next')}</button>
      ${last?'':`<button class="small" onclick="h_tutSkip()">${L('Hoppa över','Skip')}</button>`}</div></div>`;
}
/* 584 Hoppa över / avsluta: flaggan sparas så att den inte visas igen; kan spelas om från Hjälp */
window.h_tut=function(d){
  if(d>0&&tutI>=STEPS.length-1){window.h_tutSkip();return}
  openTutorial(tutI+d);
};
window.h_tutSkip=function(){
  M.tut=true;saveMeta();
  if(state.phase==='menu') showMainMenu(); else closeOverlay();
};
window.h_openTutorial=function(){openTutorial(0)};

/* ---------- Hjälp med flikar ---------- */
/* 585 Hjälpmodal med flikar: Basics, Hands, Relics, Tips */
const HTABS=[['basics','Grunder','Basics'],['hands','Händer','Hands'],['relics','Reliker','Relics'],['tips','Tips','Tips']];
const NEEDS={'Fem lika':['5 lika','5 equal'],'Straight Flush':['Stege + samma färg','Straight, one colour'],'Fyrtal':['4 lika','4 equal'],
  'Full house':['3 + 2 lika','3 + 2 equal'],'Stege':['5 i följd','5 in a row'],'Färg':['5 av samma färg','5 of one colour'],
  'Triss':['3 lika','3 equal'],'Två par':['2 + 2 lika','2 + 2 equal'],'Par':['2 lika','2 equal'],'Högsta':['Inget annat','Nothing else']};
function helpBody(tab){
  if(tab==='hands'){
    /* 586 Tabell över kombos med bas-chips och mult (samt aktuell nivå) */
    const rows=COMBO_ORDER.map(k=>{
      const c=comboWithLevel(k),lv=c.level;
      return `<tr><td>${esc(cname(k))}</td><td>${esc(NEEDS[k][LANG==='sv'?0:1])}</td><td><span class="t-chips">${COMBOS[k].chips}</span> × <span class="t-mult">${COMBOS[k].mult}</span></td><td>${lv}</td></tr>`}).join('');
    return `<p>${L('Poäng = (kombo-chips + tärningarnas värden) × mult. Basvärden vid nivå 1.','Score = (hand chips + dice values) × mult. Base values at level 1.')}</p>
      <table class="h-tbl"><thead><tr><th>${L('Hand','Hand')}</th><th>${L('Krav','Needs')}</th><th>${L('Bas','Base')}</th><th>${L('Niv','Lv')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  if(tab==='relics'){
    const cnt={};RELIC_POOL.forEach(r=>{cnt[r.r]=(cnt[r.r]||0)+1});
    const nm={common:['Vanlig','Common'],uncommon:['Ovanlig','Uncommon'],rare:['Sällsynt','Rare'],legendary:['Legendarisk','Legendary']};
    const li=Object.keys(nm).map(k=>`<li><span class="h-rar h-rar-${k}">${nm[k][LANG==='sv'?0:1]}</span> ${cnt[k]||0} ${L('reliker','relics')}</li>`).join('');
    return `<p>${L('Reliker ger passiva effekter som ökar chips, mult eller guld. Du har ett begränsat antal platser (se Relikplatser).','Relics give passive effects that boost chips, mult or gold. You have a limited number of slots (see Relic slots).')}</p>
      <ul class="h-list">${li}</ul>
      <p>${L('Sälj en relik för halva priset. Extra platser och bättre erbjudanden finns som vouchers i butiken.','Sell a relic for half its price. Extra slots and better offers can be found as vouchers in the shop.')}</p>`;
  }
  if(tab==='tips') return `<ul class="h-list">`+TIPS.map(x=>`<li>${esc(x[LANG==='sv'?0:1])}</li>`).join('')+`</ul>`;
  return `<ol class="h-list">
    <li>${L('Kasta tärningarna med Kasta (R).','Roll the dice with Roll (R).')}</li>
    <li>${L('Klicka på en tärning för att hålla den, kasta om resten.','Click a die to hold it, then roll the rest.')}</li>
    <li>${L('Poäng (Mellanslag) låser handen och ger chips × mult.','Score (Space) locks the hand and gives chips × mult.')}</li>
    <li>${L('Nå blindens mål innan händerna tar slut.','Reach the blind target before you run out of hands.')}</li>
    <li>${L('Handla i butiken mellan blinds. Var tredje blind är en boss.','Shop between blinds. Every third blind is a boss.')}</li>
    <li>${L('Klara 8 antes för att vinna, sedan väntar Endless.','Clear 8 antes to win, then Endless awaits.')}</li></ol>
    <p>${L('Tangenter: R kasta, Mellanslag poäng, S sortera, H håll lika, D släng, M ljud, L språk, Esc stäng.','Keys: R roll, Space score, S sort, H hold matching, D discard, M mute, L language, Esc close.')}</p>
    <p><button class="small" onclick="h_openTutorial()">${L('Visa handledningen igen','Replay the tutorial')}</button></p>`;
}
window.h_helpTab=function(tab,el){
  document.querySelectorAll('#overlay .h-htab').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  const b=document.getElementById('h-help-body');if(b) b.innerHTML=helpBody(tab);
};
openHelp=function(){
  const ov=document.getElementById('overlay');ov.classList.add('active');
  const tabs=HTABS.map((x,i)=>`<div class="tab h-htab${i?'':' active'}" onclick="h_helpTab('${x[0]}',this)">${x[LANG==='sv'?1:2]}</div>`).join('');
  ov.innerHTML=`<div class="modal wide">
    <h2>${spr('gi_question')} ${t('help')}</h2>
    <div class="tabs">${tabs}</div>
    <div id="h-help-body" class="h-help">${helpBody('basics')}</div>
    <div class="buttons"><button onclick="closeOverlay()">${t('close')}</button></div></div>`;
};

/* Testkrokar */
window.h_test={get meta(){return M},get run(){return R},loadMeta,migrate,endRun,newRun,resultText,STEPS,TIPS,reset(){M=loadMeta()}};
})();

</script>
