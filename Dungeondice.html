<script>
/* ===== PATCH E (js) ===== */
/* Agent E: spelets djup (kombonivåer, vouchers, tärningsmodifierare, bossar, ekonomi). Alla nya id har prefixet e_ */
(function(){
  const L=(sv,en)=>LANG==='sv'?sv:en;
  const E_BAG_MAX=4;
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

  // ---------- grundtillstånd per run ----------
  function e_init(){
    state.e_modBag=[];state.e_tabBought=0;state.e_tabDisc=1;state.e_respecs=0;state.e_stats={};
    state.e_interestCap=5;state.e_freeReroll=0;state.e_bossOrder=null;state.e_q=null;state.e_packKey=null;
    state.e_respecFrom=null;state.e_choices=null;state.e_rewardHtml=null;
  }
  function e_ensure(){if(!state.e_modBag)e_init()}
  window.e_init=e_init;
  const _startRun=startRun;
  startRun=function(){e_init();return _startRun.apply(this,arguments)};

  // ---------- 489 Mästarbonus: nivå 3 (x1.1) och nivå 10 'MAX' (x2) utöver 5 och 8 ----------
  masteryMult=function(lv){return lv>=10?2:lv>=8?1.5:lv>=5?1.25:lv>=3?1.1:1};
  const _openCombos=openCombos;
  openCombos=function(){
    e_ensure();
    _openCombos.apply(this,arguments);
    const ov=document.getElementById('overlay');
    // MAX-märke på nivå 10 och ny förklaringstext
    ov.querySelectorAll('.combo-row .cl').forEach(el=>{if(/LV 10\b/.test(el.textContent)){el.innerHTML='LV 10 <i class="e-max">MAX</i>'}});
    const p=ov.querySelector('.modal p');
    if(p)p.textContent=L('Köp kombotavlor för att höja nivån. Bonus på mult vid nivå 3 (×1,1), 5 (×1,25), 8 (×1,5) och 10 MAX (×2 och +2 guld per hand).','Buy hand tablets to level up. Mult bonus at level 3 (×1.1), 5 (×1.25), 8 (×1.5) and 10 MAX (×2 and +2 gold per hand).');
    // 494 Kombostatistik för den här runnen
    const rows=COMBO_ORDER.filter(k=>state.e_stats[k]).sort((a,b)=>state.e_stats[b].n-state.e_stats[a].n).map(k=>{
      const s=state.e_stats[k];
      return `<div class="e-crow"><span class="cn">${COMBOS[k].name[LANG]}</span><span>${s.n}×</span><span>${L('snitt','avg')} ${Math.floor(s.total/s.n).toLocaleString()}</span><span>${L('bäst','best')} ${s.best.toLocaleString()}</span></div>`}).join('');
    const box=document.createElement('div');box.className='e-cstats';
    box.innerHTML=`<h3>${L('Den här runnen','This run')}</h3>${rows||'<p>—</p>'}`;
    const tbl=ov.querySelector('.combo-table');if(tbl)tbl.after(box);
  };

  // ---------- 494 Statistik per kombo (visas i kombovyn) samt nivå 10 MAX-guld (489) ----------
  const _scoreHand=scoreHand;
  scoreHand=function(){
    e_ensure();
    const n0=state.comboHistory.length;
    const r=_scoreHand.apply(this,arguments);
    if(state.comboHistory.length>n0){
      const h=state.comboHistory[state.comboHistory.length-1];
      const s=state.e_stats[h.name]||(state.e_stats[h.name]={n:0,total:0,best:0});
      s.n++;s.total+=h.score;if(h.score>s.best)s.best=h.score;
      if(comboLevel(h.name)>=COMBO_MAX_LEVEL){state.money+=2;log('★ MAX +2 '+L('guld','gold'),'#f0c44a');render()}
    }
    return r;
  };

  // ---------- helpers för nivåer ----------
  function e_lvl(k,n){state.comboLevels=state.comboLevels||{};const cur=comboLevel(k);const nl=Math.min(COMBO_MAX_LEVEL,cur+n);state.comboLevels[k]=nl;return nl-cur}
  window.e_lvl=e_lvl;
  function e_mostPlayed(){
    const cand=COMBO_ORDER.filter(k=>comboLevel(k)<COMBO_MAX_LEVEL);
    if(!cand.length)return null;
    const best=cand.filter(k=>state.e_stats[k]).sort((a,b)=>state.e_stats[b].n-state.e_stats[a].n)[0];
    return best||cand[Math.floor(Math.random()*cand.length)];
  }
  function e_randCombo(){const c=COMBO_ORDER.filter(k=>comboLevel(k)<COMBO_MAX_LEVEL);return c.length?c[Math.floor(Math.random()*c.length)]:null}
  const cname=k=>COMBOS[k].name[LANG];

  // ---------- 490/491 Tavelpriser: mängdrabatt, svårighetsgrad, voucher ----------
  function e_adj(base){
    let p=Math.floor(base*(state.discount||1)*(state.e_tabDisc||1));
    p-=Math.min(3,Math.floor((state.e_tabBought||0)/3)); // 490 −1 guld per 3 köpta tavlor, max −3
    if(state.difficulty==='easy')p=Math.floor(p*0.75);  // 491 svårighetsgrad påverkar tavelpriset
    else if(state.difficulty==='hard')p=Math.ceil(p*1.35);
    if(state.boss&&state.boss.desc.sv.includes('dubbelt'))p*=2;
    return Math.max(1,p);
  }
  window.e_adj=e_adj;
  function e_tabPrice(k){return e_adj(COMBO_BASE_PRICE[k]+(comboLevel(k)-1))}
  function e_tabDesc(it){
    const lv=comboLevel(it.key),inc=COMBO_INC[it.key],n=lv+1,m=[3,5,8,10].includes(n);
    const tail=n===10?{sv:' och MAX-bonus!',en:' and MAX bonus!'}:m?{sv:' och mästarbonus!',en:' and mastery bonus!'}:{sv:'',en:''};
    it.data.desc={sv:`Nivå ${lv} → ${n}: +${inc.chips} chips, +${inc.mult} mult${tail.sv}`,en:`Level ${lv} → ${n}: +${inc.chips} chips, +${inc.mult} mult${tail.en}`};
  }
  function e_packBase(){let s=0;COMBO_ORDER.forEach(k=>s+=comboLevel(k)-1);return 6+Math.floor(s/3)}
  function e_repriceTablets(){
    state.shopItems.forEach(it=>{
      if(it.type==='combo'&&!it.sold){it.price=e_tabPrice(it.key);e_tabDesc(it)}
      if(it.type==='e_pack'&&!it.sold)it.price=e_adj(e_packBase());
    });
  }
  window.e_repriceTablets=e_repriceTablets;

  // ---------- 492 Tavelpack i butiken: valfri kombo +1 ----------
  const _openShop=openShop;
  openShop=function(){
    e_ensure();
    _openShop.apply(this,arguments);
    const key=state.ante+':'+state.blindIdx;
    if(state.e_packKey!==key&&COMBO_ORDER.some(k=>comboLevel(k)<COMBO_MAX_LEVEL)){
      state.shopItems.push({type:'e_pack',price:e_adj(e_packBase()),sold:false,data:{
        id:'e_pack',name:{sv:'Tavelpack',en:'Tablet Pack'},icon:'📜',
        desc:{sv:'Valfri kombo +1 nivå',en:'Any hand +1 level'}}});
    }
    e_repriceTablets();
    renderShop();
  };

  // ---------- 481 Tärningspåse: köpta modifierare består över händerna (före: försvann vid blindstart) ----------
  const _buyItem=buyItem;
  buyItem=function(i){
    e_ensure();
    const it=state.shopItems[i];
    if(it&&!it.sold&&it.type==='mod'&&state.e_modBag.length>=E_BAG_MAX){
      log('❌ '+L('Tärningspåsen är full','Dice bag is full'),'#ff4d5e');Sound.error();return;
    }
    const dl=state.dice.length;
    _buyItem.apply(this,arguments);
    if(!it||!it.sold)return;
    if(it.type==='mod'){state.dice.length=dl;state.e_modBag.push(it.data.mod);renderShop();render()}
    else if(it.type==='combo'){state.e_tabBought++;e_repriceTablets();renderShop()}
    else if(it.type==='e_pack'){state.e_tabBought++;state.e_packKey=state.ante+':'+state.blindIdx;e_openPick()}
  };
  function e_openPick(){
    const ov=document.getElementById('overlay');
    const b=COMBO_ORDER.filter(k=>comboLevel(k)<COMBO_MAX_LEVEL).map(k=>{
      const c=comboWithLevel(k);
      return `<button class="e-pick" onclick="e_pickPack(${COMBO_ORDER.indexOf(k)})"><b>${cname(k)}</b><span>LV ${c.level} → ${c.level+1}</span></button>`}).join('');
    ov.innerHTML=`<div class="modal"><h2>📜 ${L('Tavelpack','Tablet Pack')}</h2><p>${L('Välj en kombo att höja ett steg.','Pick a hand to raise by one level.')}</p><div class="e-picks">${b}</div></div>`;
  }
  window.e_openPick=e_openPick;
  window.e_pickPack=function(idx){
    const k=COMBO_ORDER[idx];if(!k)return;
    e_lvl(k,1);log('📜 '+cname(k)+' → '+L('nivå ','level ')+comboLevel(k));
    burst(innerWidth/2,innerHeight/2,['✨','⭐'],6);
    e_repriceTablets();renderShop();render();
  };

  // ---------- Påsens modifierare placeras på tärningar vid varje kast ----------
  const _randDie=randDie;
  randDie=function(){
    const d=_randDie();
    const q=state.e_q;
    if(q&&q.length){const m=q.shift();if(m)d.mod=m}
    if(state.boss&&state.boss.e_rule==='e_sixes'&&d.value===6)d.value=1; // (502) sexor blir ettor
    return d;
  };
  function e_buildQueue(){
    const bag=state.e_modBag||[];
    const pre=state.dice,hs=state.handSize;
    const k=Math.max(0,hs-pre.length),Ln=Math.max(pre.length,hs);
    // påsens mods som ännu inte sitter på en tärning
    const missing=bag.slice();
    const carry=Array(pre.length).fill(null);
    // hållna först, därefter omkastade: en mod bärs bara över om påsen äger den (reliken vild påverkas inte)
    pre.forEach((d,i)=>{if(state.held.has(i)){const j=missing.indexOf(d.mod);if(d.mod&&j>=0)missing.splice(j,1)}});
    pre.forEach((d,i)=>{if(!state.held.has(i)){const j=missing.indexOf(d.mod);if(d.mod&&j>=0){missing.splice(j,1);carry[i]=d.mod}}});
    const free=[];
    for(let i=pre.length;i<Ln;i++)free.push(i);
    const place={};
    while(missing.length&&free.length){const j=Math.floor(Math.random()*free.length);place[free.splice(j,1)[0]]=missing.shift()}
    const q=Array(k).fill(null);
    for(let i=0;i<Ln;i++){
      if(state.held.has(i))continue;
      q.push(i<pre.length?carry[i]:(place[i]||null));
    }
    return q;
  }
  const _rollDice=rollDice;
  rollDice=function(initial){
    e_ensure();
    const gb=state.stats.glassBroken;
    state.e_q=(!initial&&state.rolls<=0)?null:e_buildQueue();
    try{return _rollDice.apply(this,arguments)}
    finally{
      state.e_q=null;
      // 482 Glas som går sönder försvinner ur påsen för gott
      for(let n=state.stats.glassBroken-gb;n>0;n--){const j=state.e_modBag.indexOf('glas');if(j>=0){state.e_modBag.splice(j,1);log('💎 '+L('Glasmodifieraren förbrukad','Glass modifier used up'),'#4d9fff')}}
    }
  };

  // ---------- 483 Brons, 484 Kvicksilver, 485 Rubin, 486 Tung, 487 Frost, 488 Eko: sex nya tärningsmodifierare ----------
  Object.assign(MODS,{
    'e_brons':{icon:'🥉',desc:{sv:'+20 chips, +1 guld',en:'+20 chips, +1 gold'},apply:c=>{c.chips+=20;c.gold=(c.gold||0)+1}},
    'e_kvick':{icon:'⚡',desc:{sv:'+3 mult',en:'+3 mult'},apply:c=>{c.mult+=3}},
    'e_rubin':{icon:'🔴',desc:{sv:'×1.25 mult',en:'×1.25 mult'},apply:c=>{c.mult*=1.25}},
    'e_tung':{icon:'🔩',desc:{sv:'+60 chips',en:'+60 chips'},apply:c=>{c.chips+=60}},
    'e_frost':{icon:'❄️',desc:{sv:'+25 chips, +1 mult',en:'+25 chips, +1 mult'},apply:c=>{c.chips+=25;c.mult+=1}},
    'e_eko':{icon:'🔁',desc:{sv:'+1 kast resten av blinden',en:'+1 roll for the rest of the blind'},apply:c=>{if(state.maxRolls<state.baseRolls+3)c.extraRoll=1}},
  });
  DICE_MOD_ITEMS.push(
    {id:'mod_e_brons',name:{sv:'Bronsgjutning',en:'Bronze Cast'},icon:'🪙',desc:{sv:'+Brons: +20 chips, +1 guld',en:'+Bronze: +20 chips, +1 gold'},price:4,mod:'e_brons'},
    {id:'mod_e_kvick',name:{sv:'Kvicksilver',en:'Quicksilver'},icon:'🧪',desc:{sv:'+Kvick: +3 mult per hand',en:'+Quick: +3 mult per hand'},price:6,mod:'e_kvick'},
    {id:'mod_e_rubin',name:{sv:'Rubinslipning',en:'Ruby Cut'},icon:'🩸',desc:{sv:'+Rubin: ×1.25 mult',en:'+Ruby: ×1.25 mult'},price:7,mod:'e_rubin'},
    {id:'mod_e_tung',name:{sv:'Blyfyllning',en:'Lead Fill'},icon:'🔩',desc:{sv:'+Tung: +60 chips',en:'+Heavy: +60 chips'},price:5,mod:'e_tung'},
    {id:'mod_e_frost',name:{sv:'Frostbad',en:'Frost Bath'},icon:'❄️',desc:{sv:'+Frost: +25 chips, +1 mult',en:'+Frost: +25 chips, +1 mult'},price:5,mod:'e_frost'},
    {id:'mod_e_eko',name:{sv:'Ekograv',en:'Echo Carve'},icon:'⏳',desc:{sv:'+Eko: +1 kast kvar i blinden',en:'+Echo: +1 roll left this blind'},price:7,mod:'e_eko'},
  );

  // ---------- Åtta nya vouchers: 495 Tavelrabatt, 496 Mästarlärling + Tavelpack, 497 tre II-uppgraderingar (hand/kast/släng), 498 Bankir II + Extra Hand ----------
  VOUCHERS.push(
    // 495 voucher
    {id:'e_v_tabdisc',name:{sv:'Tavelrabatt',en:'Tablet Rebate'},icon:'📜',desc:{sv:'Kombotavlor och tavelpack −25%',en:'Hand tablets and packs −25%'},price:9,ef:s=>{s.e_tabDisc=(s.e_tabDisc||1)*0.75}},
    // 496 voucher
    {id:'e_v_levelup',name:{sv:'Mästarlärling',en:"Master's Apprentice"},icon:'🏆',desc:{sv:'+1 nivå på din mest spelade kombo direkt',en:'+1 level on your most played hand now'},price:11,
      ef:s=>{const k=e_mostPlayed();if(k){e_lvl(k,1);log('🏆 '+cname(k)+' → '+L('nivå ','level ')+comboLevel(k))}}},
    // 496 voucher
    {id:'e_v_pack',name:{sv:'Tavelpack',en:'Tablet Pack'},icon:'📦',desc:{sv:'+2 nivåer på en slumpad kombo',en:'+2 levels on a random hand'},price:14,
      ef:s=>{const k=e_randCombo();if(k){e_lvl(k,2);log('📦 '+cname(k)+' → '+L('nivå ','level ')+comboLevel(k))}}},
    // 497 voucher
    {id:'e_v_hand2',name:{sv:'Större Hand II',en:'Bigger Hand II'},icon:'🎲',desc:{sv:'+1 handstorlek till',en:'+1 more hand size'},price:18,e_req:'v_hand',ef:s=>s.baseHand++},
    // 497 voucher
    {id:'e_v_roll2',name:{sv:'Snabbare Kast II',en:'Faster Rolls II'},icon:'🎯',desc:{sv:'+1 kast per hand till',en:'+1 more roll per hand'},price:20,e_req:'v_roll',ef:s=>s.baseRolls++},
    // 497 voucher
    {id:'e_v_discard2',name:{sv:'Fler Slängar II',en:'More Discards II'},icon:'🗑️',desc:{sv:'+2 slängar per hand',en:'+2 discards per hand'},price:12,e_req:'v_discard',ef:s=>s.baseDiscards+=2},
    // 498 voucher
    {id:'e_v_interest2',name:{sv:'Bankir II',en:'Banker II'},icon:'💰',desc:{sv:'Räntetaket höjs med 3',en:'Interest cap raised by 3'},price:15,e_req:'v_interest',ef:s=>s.e_interestCap=(s.e_interestCap||5)+3},
    // 498 voucher
    {id:'e_v_hands',name:{sv:'Extra Hand',en:'Extra Hand'},icon:'⚔️',desc:{sv:'+1 hand per blind',en:'+1 hand per blind'},price:24,ef:s=>s.maxHands++},
  );
  const _buyVoucher=buyVoucher;
  buyVoucher=function(id){
    const v=VOUCHERS.find(x=>x.id===id);
    if(v&&v.e_req&&!state.vouchers.includes(v.e_req)){log('🔒 '+L('Kräver ','Requires ')+VOUCHERS.find(x=>x.id===v.e_req).name[LANG],'#ff994d');Sound.error();return}
    return _buyVoucher.apply(this,arguments);
  };
  // 509 Låsta voucher-uppgraderingar visas gråade med vad som krävs
  const _openVoucherShop=openVoucherShop;
  openVoucherShop=function(){
    _openVoucherShop.apply(this,arguments);
    document.querySelectorAll('#overlay .shop-item.voucher').forEach(el=>{
      const m=/buyVoucher\('([^']+)'\)/.exec(el.getAttribute('onclick')||'');
      const v=m&&VOUCHERS.find(x=>x.id===m[1]);
      if(v&&v.e_req&&!state.vouchers.includes(v.e_req)){
        el.classList.add('e-locked');
        const req=VOUCHERS.find(x=>x.id===v.e_req);
        el.insertAdjacentHTML('beforeend',`<div class="e-lock">🔒 ${L('Kräver ','Requires ')}${esc(req.name[LANG])}</div>`);
      }
    });
  };

  // ---------- 493 Respec: flytta en kombonivå mot guld ----------
  function e_respecCost(){return Math.min(15,3+2*(state.e_respecs||0))}
  window.e_respecCost=e_respecCost;
  function e_openRespec(){
    const ov=document.getElementById('overlay');
    const from=state.e_respecFrom;
    const fromBtns=COMBO_ORDER.filter(k=>comboLevel(k)>=2).map(k=>`<button class="e-pick${from===k?' sel':''}" onclick="e_respecPick(${COMBO_ORDER.indexOf(k)})"><b>${cname(k)}</b><span>LV ${comboLevel(k)}</span></button>`).join('')||`<p>${L('Inga kombos över nivå 1.','No hands above level 1.')}</p>`;
    const toBtns=from?COMBO_ORDER.filter(k=>k!==from&&comboLevel(k)<COMBO_MAX_LEVEL).map(k=>`<button class="e-pick" onclick="e_respecDo(${COMBO_ORDER.indexOf(k)})"><b>${cname(k)}</b><span>LV ${comboLevel(k)} → ${comboLevel(k)+1}</span></button>`).join(''):'';
    ov.innerHTML=`<div class="modal"><h2>⇄ ${L('Flytta en nivå','Move a level')}</h2>
      <p>${L('Kostnad','Cost')}: <b style="color:var(--gold)">${e_respecCost()}</b> • ${t('money')}: <b style="color:var(--gold)">${state.money}</b></p>
      <h3 class="e-h3">${L('Ta från','Take from')}</h3><div class="e-picks">${fromBtns}</div>
      ${from?`<h3 class="e-h3">${L('Ge till','Give to')}</h3><div class="e-picks">${toBtns}</div>`:''}
      <div class="buttons"><button onclick="e_respecBack()">${t('back')}</button></div></div>`;
  }
  window.e_openRespec=e_openRespec;
  window.e_respecPick=function(i){state.e_respecFrom=COMBO_ORDER[i];e_openRespec()};
  window.e_respecBack=function(){state.e_respecFrom=null;renderShop()};
  window.e_respecDo=function(i){
    const to=COMBO_ORDER[i],from=state.e_respecFrom,cost=e_respecCost();
    if(!from||!to||from===to||comboLevel(from)<2||comboLevel(to)>=COMBO_MAX_LEVEL)return;
    if(state.money<cost){log('❌ '+t('not_enough_gold'),'#ff4d5e');Sound.error();return}
    state.money-=cost;state.e_respecs++;
    state.comboLevels[from]=comboLevel(from)-1;state.comboLevels[to]=comboLevel(to)+1;
    state.e_respecFrom=null;
    log('⇄ '+cname(from)+' → '+cname(to));Sound.buy();
    renderShop();render();
  };

  // ---------- 510 Tärningspåsen syns i butik och tärningsvy (plus respec-knapp och gratis omkast-etikett) ----------
  const _renderShop=renderShop;
  renderShop=function(){
    e_ensure();
    _renderShop.apply(this,arguments);
    const ov=document.getElementById('overlay');
    const modal=ov.querySelector('.modal');if(!modal)return;
    const grid=modal.querySelector('.shop-grid');
    const bag=state.e_modBag.map(m=>`<span class="e-bagdie" title="${esc(MODS[m].desc[LANG])}">${ico(MODS[m].icon)}</span>`).join('')||'<i>—</i>';
    if(grid)grid.insertAdjacentHTML('afterend',`<div class="e-bag"><b>${L('Tärningspåse','Dice bag')} ${state.e_modBag.length}/${E_BAG_MAX}</b> ${bag}</div>`);
    const btns=modal.querySelector('.buttons');
    if(btns){
      const rr=btns.querySelector('button');
      if(rr&&state.e_freeReroll>0)rr.textContent='🔄 ('+L('gratis','free')+' ×'+state.e_freeReroll+')';
      const b=document.createElement('button');b.id='e-respec-btn';
      b.textContent='⇄ '+L('Flytta nivå','Move level')+' ('+e_respecCost()+')';
      b.onclick=()=>{state.e_respecFrom=null;e_openRespec()};
      btns.insertBefore(b,btns.querySelector('.primary'));
    }
  };
  const _rerollShop=rerollShop;
  rerollShop=function(){
    if(state.e_freeReroll>0){state.e_freeReroll--;log('🔄 '+L('Gratis omkast','Free reroll'));return openShop()}
    return _rerollShop.apply(this,arguments);
  };
  const _openDeck=openDeck;
  openDeck=function(){
    e_ensure();_openDeck.apply(this,arguments);
    const m=document.querySelector('#overlay .modal');
    if(m&&state.e_modBag.length){
      const d=document.createElement('div');d.className='e-bag';
      d.innerHTML=`<b>${L('Tärningspåse','Dice bag')} ${state.e_modBag.length}/${E_BAG_MAX}</b> `+state.e_modBag.map(x=>`<span class="e-bagdie">${ico(MODS[x].icon)}</span>`).join('');
      m.querySelector('.buttons').before(d);
    }
  };

  // ---------- Sex nya bossar (identifieras av boss.e_rule, ej beskrivningstext): 499 Handbojan, 500 Plundraren, 501 Förseglaren, 502 Ettornas Herre, 503 Ekotyrannen, 504 Dimvakten ----------
  ['The Clock','The Silence','Shapeshifter','Crystal Warden','Midas'].forEach(n=>{const b=BOSSES.find(x=>x.name.en===n);if(b)b.e_mild=true});
  BOSSES.push(
    // 499 boss
    {e_rule:'e_shackle',e_mild:false,name:{sv:'Handbojan',en:'The Shackle'},sprite:'shield',icon:'⛓️',desc:{sv:'Du kan bara spara 2 tärningar.',en:'You can only keep 2 dice.'},apply:s=>{}},
    // 500 boss
    {e_rule:'e_looter',e_mild:true,name:{sv:'Plundraren',en:'The Looter'},sprite:'axe',icon:'🗡️',desc:{sv:'Tar 25% av din skatt (max 12).',en:'Takes 25% of your coins (max 12).'},
      apply:s=>{const x=Math.min(12,Math.floor(s.money*0.25));if(x>0){s.money-=x;log('🗡️ −'+x+' '+L('guld','gold'),'#ff4d5e')}}},
    // 501 boss
    {e_rule:'e_sealer',e_mild:true,name:{sv:'Förseglaren',en:'The Sealer'},sprite:'chest',icon:'🔒',desc:{sv:'Inga slängar.',en:'No discards.'},apply:s=>{s.maxDiscards=0}},
    // 502 boss
    {e_rule:'e_sixes',e_mild:true,name:{sv:'Ettornas Herre',en:'Lord of Ones'},sprite:'o_45_15',icon:'1️⃣',desc:{sv:'Sexor blir ettor.',en:'Sixes turn into ones.'},apply:s=>{}},
    // 503 boss
    {e_rule:'e_echo',e_mild:false,name:{sv:'Ekotyrannen',en:'Echo Tyrant'},sprite:'snake',icon:'🔁',desc:{sv:'Samma kombo två gånger i rad ger hälften mult.',en:'The same hand twice in a row gives half mult.'},apply:s=>{}},
    // 504 boss
    {e_rule:'e_fog',e_mild:true,name:{sv:'Dimvakten',en:'Fog Warden'},sprite:'potionB',icon:'🌫️',desc:{sv:'Första handen ger hälften mult.',en:'The first hand gives half mult.'},apply:s=>{}},
  );
  const _detectCombo=detectCombo;
  detectCombo=function(d){
    const c=_detectCombo.apply(this,arguments);
    const b=state.boss;
    if(!b||!b.e_rule||state.phase!=='playing')return c;
    if(b.e_rule==='e_echo'){const h=state.comboHistory;if(h.length&&h[h.length-1].name===c.key)return {...c,mult:Math.round(c.mult*50)/100}}
    if(b.e_rule==='e_fog'&&state.hands===state.maxHands)return {...c,mult:Math.round(c.mult*50)/100};
    return c;
  };
  const _toggleHold=toggleHold;
  toggleHold=function(idx){
    const b=state.boss;
    if(b&&b.e_rule==='e_shackle'&&state.phase==='playing'&&!state.held.has(idx)&&state.held.size>=2){
      log('⛓️ '+L('Handbojan: max 2','Shackle: max 2'),'#ff994d');Sound.error();return;
    }
    return _toggleHold.apply(this,arguments);
  };
  const _holdAll=holdAllMatching;
  holdAllMatching=function(){
    _holdAll.apply(this,arguments);
    const b=state.boss;
    if(b&&b.e_rule==='e_shackle'&&state.held.size>2){state.held=new Set([...state.held].slice(0,2));render()}
  };

  // ---------- 505 Bossordning slumpas per run (milda bossar först) ----------
  function e_makeOrder(){
    const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const idx=BOSSES.map((_,i)=>i);
    const mild=sh(idx.filter(i=>BOSSES[i].e_mild)),rest=sh(idx.filter(i=>!BOSSES[i].e_mild));
    return [mild[0],mild[1],...sh([...mild.slice(2),...rest])];
  }
  window.e_makeOrder=e_makeOrder;

  // ---------- 508 Endless: ante 9+ skalar hårdare ----------
  const _showBlindSelect=showBlindSelect;
  showBlindSelect=function(){
    e_ensure();
    let sw=null;
    if(state.blindIdx===2){
      if(!state.e_bossOrder||state.e_bossOrder.length!==BOSSES.length)state.e_bossOrder=e_makeOrder();
      const idx=(state.ante-1)%BOSSES.length;
      sw=[idx,BOSSES[idx]];BOSSES[idx]=BOSSES[state.e_bossOrder[idx]];
    }
    try{_showBlindSelect.apply(this,arguments)}finally{if(sw)BOSSES[sw[0]]=sw[1]}
    if(state.endless&&state.ante>8){
      state.target=Math.floor(state.target*(1+0.12*(state.ante-8)));
      const el=document.querySelector('#overlay .blind-card .target');
      if(el)el.textContent=state.target.toLocaleString();
    }
  };

  // ---------- 507 Räntetak (tak 5, höjs av Bankir II), 508 endless-belöning, 506 bossbelöning med val ----------
  const _render=render;
  render=function(){
    _render.apply(this,arguments);
    const el=document.getElementById('s-interest');
    if(el&&state.interest)el.textContent='+'+Math.min(Math.floor(state.money/5),state.e_interestCap||5);
  };
  const _winBlind=winBlind;
  winBlind=function(){
    e_ensure();
    const m0=state.money,wasBoss=state.blindIdx===2;
    _winBlind.apply(this,arguments);
    const q=Math.floor(m0/5),cap=state.e_interestCap||5;
    const excess=(q-Math.min(q,cap))*(1+(state.interest?1:0));
    const extra=(state.endless&&state.ante>8)?state.ante-8:0;
    const reward=state.money-m0;
    state.money=Math.max(0,state.money-excess+extra);
    const nr=reward-excess+extra;
    const ov=document.getElementById('overlay');
    const p=ov.querySelector('p[style*="font-size:20px"]');
    if(p){p.textContent=t('reward')+': +'+nr+' 💰'+(excess?'  ('+L('räntetak ','interest cap ')+cap+')':'')}
    state.e_lastReward=nr;
    render();
    if(wasBoss)e_bossChoice();
  };
  function e_bossChoice(){
    const ov=document.getElementById('overlay');
    state.e_rewardHtml=ov.innerHTML;
    const opts=[];
    const g=10+2*state.ante;
    opts.push({title:L('Skattkammare','Treasure hoard'),desc:`+${g} ${L('guld','gold')}`,ap:()=>{state.money+=g}});
    const k=e_mostPlayed();
    if(k)opts.push({title:L('Mästarlektion','Master lesson'),desc:cname(k)+' +1 '+L('nivå','level'),ap:()=>{e_lvl(k,1)}});
    if(state.e_modBag.length<E_BAG_MAX){
      const mm=DICE_MOD_ITEMS[Math.floor(Math.random()*DICE_MOD_ITEMS.length)];
      opts.push({title:L('Gratis modifierare','Free modifier'),desc:ico(MODS[mm.mod].icon)+' '+mm.name[LANG],ap:()=>{state.e_modBag.push(mm.mod)}});
    }
    opts.push({title:L('Marknadsfavör','Market favor'),desc:L('3 gratis omkast i butiken','3 free shop rerolls'),ap:()=>{state.e_freeReroll+=3}});
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    state.e_choices=opts.slice(0,2);
    ov.innerHTML=`<div class="modal"><h2>👑 ${L('Bossbelöning','Boss reward')}</h2><p>${L('Välj en av två.','Choose one of two.')}</p>
      <div class="e-picks">${state.e_choices.map((o,i)=>`<button class="e-pick e-choice" onclick="e_pickReward(${i})"><b>${o.title}</b><span>${o.desc}</span></button>`).join('')}</div></div>`;
  }
  window.e_bossChoice=e_bossChoice;
  window.e_pickReward=function(i){
    const o=state.e_choices&&state.e_choices[i];if(!o)return;
    o.ap();state.e_choices=null;log('👑 '+o.title);Sound.buy();
    document.getElementById('overlay').innerHTML=state.e_rewardHtml;
    render();
  };
})();

</script>
<script>
/* ===== PATCH A (js) ===== */
(function(){
/* ===== Agent A: meny, HUD, bakgrund, övergångar, slutskärmar ===== */
var sv=function(){return LANG==='sv'};
var T=function(s,e){return sv()?s:e};
var fmt=function(n){try{return Number(n).toLocaleString()}catch(e){return ''+n}};
var $=function(id){return document.getElementById(id)};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var runStartIdx=0;

// 382 Favicon som pixelsprite (tärning ritad med rektanglar, data-URI)
(function(){
  var r='',g='<rect width="16" height="16" fill="#10161a"/><rect x="1" y="1" width="14" height="14" fill="#f3ecdc"/><rect x="1" y="12" width="14" height="3" fill="#cfc4aa"/>';
  [[3,3],[11,3],[7,7],[3,11],[11,11]].forEach(function(p){r+='<rect x="'+p[0]+'" y="'+p[1]+'" width="2" height="2" fill="#10161a"/>'});
  r=g+'<rect x="0" y="0" width="16" height="1" fill="#10161a"/>'+r;
  var l=document.createElement('link');l.rel='icon';l.type='image/svg+xml';
  l.href='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">'+r+'</svg>');
  document.head.appendChild(l);
})();

// 381 theme-color som följer läge och ante
var themeMeta=document.createElement('meta');themeMeta.name='theme-color';themeMeta.content='#10161a';document.head.appendChild(themeMeta);
function hslHex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12,c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return ('0'+Math.round(255*c).toString(16)).slice(-2)};return '#'+f(0)+f(8)+f(4)}

// 374 Bakgrundston per ante (statisk färg via CSS-variabel)
// 375 Bossante får rödare ton (klass a_boss på body)
var HUES=[165,175,195,215,245,275,305,335];
function aTint(){
  var ante=(state&&state.ante)||1,boss=state&&state.blindIdx===2&&state.phase!=='menu'&&state.phase!=='gameover';
  var h=boss?2:HUES[(ante-1)%8],root=document.documentElement;
  root.style.setProperty('--a-h',h);
  root.style.setProperty('--a-sat',boss?'60%':'45%');
  document.body.classList.toggle('a_boss',!!boss);
  themeMeta.content=state&&state.phase==='menu'?'#10161a':hslHex(h,boss?55:40,boss?14:13);
}

// 380 Flikens titel visar läge, ante och poäng
function aTitle(){
  var base='Dungeon Dice',p=state.phase,ante=state.endless&&state.ante>8?'∞'+state.ante:state.ante,s=base;
  if(p==='menu')s=base+' · '+T('Meny','Menu');
  else if(p==='blind-select')s=base+' · Ante '+ante+' · '+T('Välj blind','Choose blind');
  else if(p==='playing')s=base+' · Ante '+ante+(state.blindIdx===2?' · Boss':'')+' · '+fmt(state.roundScore)+'/'+fmt(state.target);
  else if(p==='reward')s=base+' · '+T('Blind klarad','Blind cleared');
  else if(p==='shop')s=base+' · '+T('Butik','Shop');
  else if(p==='gameover')s=base+' · '+T('Game over','Game over');
  document.title=s;
}

// 369 Mjuk engångsövergång när spelet tonar in efter meny, blindval och butik
function aEnter(){
  var app=$('app');if(!app)return;
  app.classList.remove('a_enter');void app.offsetWidth;app.classList.add('a_enter');
  setTimeout(function(){app.classList.remove('a_enter')},420);
}

// 378 Poäng mot mål: färgen på fältet och poängrutan ändras när målet närmar sig
function aProg(){
  var f=$('progress-fill'),w=$('progress-wrap');if(!f||!w||!state.target)return;
  var pct=Math.min(100,Math.floor(state.roundScore/state.target*100));
  var c=pct>=100?'a_p100':pct>=75?'a_p75':pct>=50?'a_p50':'a_p0';
  ['a_p0','a_p50','a_p75','a_p100'].forEach(function(k){f.classList.toggle(k,k===c);var sp=$('s-score').parentNode;if(sp)sp.classList.toggle(k,k===c)});
  var g=$('a_pct');if(!g){g=document.createElement('span');g.id='a_pct';g.className='a_pct';w.appendChild(g)}
  g.textContent=pct+'%';
}

// 376 HUD: ante som plakett (x/8), 379 blindplatta
function aHud(){
  var h=$('main-header');if(h)h.classList.toggle('a_endless',!!state.endless);
  aTint();aTitle();
}
var _render=render;render=function(){var r=_render.apply(this,arguments);try{aHud();aProg()}catch(e){}return r};
var _up=updateProgress;updateProgress=function(){var r=_up.apply(this,arguments);try{aProg()}catch(e){}return r};

// 365 Menyn: titel, hälsning, statistikrutor, grupperade knappar
function aGreet(){
  var h=new Date().getHours(),n=state.totalRuns||0;
  if(n===0)return T('Välkommen, äventyrare. Kasta tärningarna!','Welcome, adventurer. Roll the dice!');
  if(h<5)return T('Sent ute i grottan, va?','Late night in the dungeon, huh?');
  if(h<11)return T('God morgon, äventyrare!','Good morning, adventurer!');
  if(h<17)return T('God dag i grottan!','Good day in the dungeon!');
  return T('God kväll, äventyrare!','Good evening, adventurer!');
}
function box(ic,lab,val,cls){return '<div class="a_box '+(cls||'')+'"><span class="a_ic">'+spr(ic)+'</span><span class="a_lab">'+lab+'</span><b>'+val+'</b></div>'}
function aLast(){
  var raw=store.get('a_last'),d=null;try{d=raw&&JSON.parse(raw)}catch(e){}

<script>
/* ===== PATCH B (js) ===== */
(function(){
'use strict';
/* Agent B: spelvyn under en hand (391-420). Allt nytt animeras som engångs. */
const $=id=>document.getElementById(id);
const L=(en,sv)=>LANG==='sv'?sv:en;
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString();
const fmM=m=>(+m).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
const short=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));
const TIER={'Högsta':1,'Par':1,'Två par':2,'Triss':2,'Färg':3,'Stege':3,'Full house':3,'Fyrtal':4,'Fem lika':5,'Straight Flush':5};
const TCOL={1:['#cfd8dc','#90a4ae','#ffffff'],2:['#35bd86','#9be7c4','#ffffff'],3:['#1da1ff','#9fd8ff','#ffffff'],4:['#c44dff','#ff9a1f','#ffd6ff'],5:['#f0c44a','#ff5d52','#fff3b0']};
const COLEN={'Röd':'Red','Blå':'Blue','Grön':'Green','Gul':'Yellow','Lila':'Purple','Orange':'Orange'};
const COLSV={'Röd':'röd','Blå':'blå','Grön':'grön','Gul':'gul','Lila':'lila','Orange':'orange'};
const MODEN={'glödgad':'Blazing','förgiftad':'Venom','glas':'Glass','guld':'Gold','sten':'Stone','vild':'Wild','förbannad':'Cursed'};
const AB={'Högsta':['Hi','Hö'],'Par':['Pr','Pa'],'Två par':['2P','2P'],'Triss':['3K','3T'],'Stege':['St','St'],'Färg':['Fl','Fä'],'Full house':['FH','FH'],'Fyrtal':['4K','4T'],'Straight Flush':['SF','SF'],'Fem lika':['5K','5L']};
const reflow=el=>void el.offsetWidth;

/* ---------- hjälpare: flytande etiketter och pixelpartiklar ---------- */
function flt(x,y,html,cls,delay){
  const el=document.createElement('div');el.className='b_flt '+(cls||'');el.innerHTML=html;
  el.style.left=Math.max(56,Math.min(innerWidth-56,x))+'px';el.style.top=y+'px';
  if(delay)el.style.animationDelay=delay+'ms';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1500+(delay||0));
}
// 399 Nya pixelsprites (diamant, stjärna, kvadrat, plus) som partiklar
const SHAPES=['dia','star','sq','plus'];
function pix(x,y,cols,n,spread){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='b_px b_px_'+SHAPES[Math.floor(Math.random()*SHAPES.length)];
    const a=Math.random()*Math.PI*2,d=(spread||90)*(.4+Math.random()*.9);
    el.style.left=x+'px';el.style.top=y+'px';
    el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',(Math.sin(a)*d-24)+'px');
    el.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    el.style.setProperty('--sz',(8+Math.floor(Math.random()*3)*3)+'px');
    el.style.background=cols[i%cols.length];
    document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
  }
}
const _burst=burst;
burst=function(x,y,emojis,count){
  const r=_burst.apply(this,arguments);

  return r;
};

/* ---------- 406 Tärningsvärde som tooltip och aria ---------- */
const _renderDie=renderDie;
renderDie=function(d,idx,held){
  const el=_renderDie.apply(this,arguments);

    const cn=COLORS[d.color]?COLORS[d.color].name:'';
    const col=LANG==='sv'?(COLSV[cn]||cn):(COLEN[cn]||cn);

    if(d.mod&&MODS[d.mod]){txt+=', '+(LANG==='sv'?d.mod:(MODEN[d.mod]||d.mod))+': '+MODS[d.mod].desc[LANG]}
    el.title=txt;el.setAttribute('aria-label',txt);
  }catch(e){}
  return el;
};

/* ---------- beräkning av förhandsvisning (samma regler som estimateScore) ---------- */
function est(){
  const dice=state.dice.slice();const combo=detectCombo(dice);
  const ctx={dice,combo,chips:combo.chips,mult:combo.mult,rollsUsed:state.rollsUsed,maxRolls:state.maxRolls,
    rerolled:state.rerolledThisHand,noRerolls:state.noRerolls,gold:0};
  const base=combo.chips,bm=combo.mult;let sum=0;
  dice.forEach(d=>{ctx.chips+=d.value;sum+=d.value});
  const c1=ctx.chips,m1=ctx.mult;
  dice.forEach(d=>{if(d.mod&&MODS[d.mod])try{MODS[d.mod].apply(ctx)}catch(e){}});
  const c2=ctx.chips,m2=ctx.mult;
  state.relics.forEach(r=>{if(r.ef)try{r.ef(ctx)}catch(e){}});
  return {combo,base,bm,sum,modCh:c2-c1,relCh:ctx.chips-c2,m:ctx.mult,chips:ctx.chips,total:Math.floor(ctx.chips*ctx.mult)};
}
function calcText(e){
  return L('Chips: hand ','Chips: hand ')+e.base+L(' + dice ',' + tärningar ')+e.sum+L(' + mods ',' + mods ')+Math.round(e.modCh)+L(' + relics ',' + reliker ')+Math.round(e.relCh)+' = '+fmt(e.chips)+
    '\n'+L('Mult: ','Mult: ')+fmM(e.bm)+' → '+fmM(e.m)+
    '\n'+fmt(e.chips)+' × '+fmM(e.m)+' = '+fmt(e.total);
}

/* ---------- 395/396/397/394 Handnamn, nivåindikator, förhandsvisning ---------- */
let lastKey=null;
function lvRow(){
  let r=$('b_lv');
  if(!r){r=document.createElement('div');r.id='b_lv';const s=$('combo-sub');if(s)s.before(r)}
  return r;
}
const _ucp=updateComboPreview;
updateComboPreview=function(){
  _ucp.apply(this,arguments);
  try{
    const banner=$('combo-banner'),sub=$('combo-sub'),nm=$('combo-name'),row=lvRow();
    if(banner.classList.contains('none')){row.style.visibility='hidden';lastKey=null;banner.removeAttribute('title');return}
    const e=est(),c=e.combo;
    // 396 Förhandsvisning som tydlig rad: chips x mult = ~poäng
    sub.innerHTML='<span class="b_pv c">'+fmt(e.chips)+'</span><i>×</i><span class="b_pv m">'+fmM(e.m)+'</span><i>=</i><b class="b_pvt">~'+fmt(e.total)+'</b>';
    // 397 Tooltip med uträkning
    const tip=calcText(e);banner.title=tip;sub.setAttribute('role','img');
    sub.setAttribute('aria-label',L('Preview: ','Förhandsvisning: ')+fmt(e.chips)+' × '+fmM(e.m)+' = '+fmt(e.total));
    // 395 Nivåindikator (LV) vid handnamnet
    row.style.visibility='visible';
    let segs='';for(let i=0;i<10;i++)segs+='<i class="'+(i<c.level?'on ':'')+((i===4||i===7)?'ms':'')+'"></i>';
    row.innerHTML='<span class="b_lvt">LV '+c.level+'</span><span class="b_lvb">'+segs+'</span>'+(c.level>=8?'<em>★★</em>':c.level>=5?'<em>★</em>':'');
    row.title=L('Hand level ','Handnivå ')+c.level+'/10';
    // 394 Handnamnet får en kort engångs-pop när det ändras
    if(lastKey!==null&&lastKey!==c.key&&!RM()){
      nm.classList.remove('b_namepop');reflow(nm);nm.classList.add('b_namepop');
      later(()=>nm.classList.remove('b_namepop'),600);
      const t=TIER[c.key]||1;
      if(t>=3){const r=nm.getBoundingClientRect();pix(r.left+r.width/2,r.top+r.height/2,TCOL[t],6,70)}
    }
    lastKey=c.key;
  }catch(err){}
};

/* ---------- 410 Progress: engångsblixt när delmål passeras ---------- */
let lastPct=0,lastPK='';
const _up=updateProgress;
updateProgress=function(){
  _up.apply(this,arguments);
  try{
    const pct=Math.min(100,state.roundScore/state.target*100);
    const key=state.ante+':'+state.blindIdx+':'+state.target;
    if(key!==lastPK){lastPK=key;lastPct=pct;return}
    const marks=[25,50,75,100];let hit=0;
    marks.forEach(m=>{if(lastPct<m&&pct>=m)hit=m});
    lastPct=pct;
    if(hit&&!RM()){
      const w=$('progress-wrap'),f=document.createElement('div');f.className='b_pflash'+(hit===100?' goal':'');
      f.style.setProperty('--p',Math.min(100,pct)+'%');f.innerHTML='<b>'+(hit===100?'★':hit+'%')+'</b>';
      w.appendChild(f);setTimeout(()=>f.remove(),900);
    }
  }catch(e){}
};

/* ---------- 419 Sparade tärningar som räknare (utan render, påverkar inga tärningar) ---------- */
function heldTag(){

  if(!t){t=document.createElement('div');t.className='b_held';da.appendChild(t)}

};

/* ---------- 407 Sortera: FLIP som spelas en enda gång ---------- */
const _sort=sortDice;
sortDice=function(){
  const da=$('dice-area');const before=new Map();
  try{[...da.querySelectorAll('.die')].forEach((el,i)=>before.set(state.dice[i],el.getBoundingClientRect()))}catch(e){}
  const r=_sort.apply(this,arguments);
  try{
    if(!RM()&&before.size){
      da.classList.add('no-land');
      [...da.querySelectorAll('.die')].forEach((el,i)=>{
        const o=before.get(state.dice[i]);if(!o)return;
        const n=el.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
        if(Math.abs(dx)+Math.abs(dy)<2)return;
        el.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:380,easing:'cubic-bezier(.3,1.3,.5,1)'});
      });
    }
  }catch(e){}
  return r;
};

/* ---------- poängsättning: sekvens, reliker, glöd, partiklar ---------- */
let seq=[];
function partIdx(dice,combo){
  const s=new Set(),k=combo.key;
  const act=dice.map((d,i)=>[d,i]).filter(x=>x[0].mod!=='sten');
  if(['Stege','Färg','Straight Flush'].includes(k)){act.forEach(x=>s.add(x[1]));return s}
  const cnt={};act.forEach(x=>cnt[x[0].value]=(cnt[x[0].value]||0)+1);
  if(['Par','Triss','Fyrtal','Fem lika'].includes(k)){
    let best=0,bc=0;for(const v in cnt){if(cnt[v]>bc||(cnt[v]===bc&&+v>best)){bc=cnt[v];best=+v}}
    act.forEach(x=>{if(x[0].value===best)s.add(x[1])});return s;
  }
  if(k==='Två par'||k==='Full house'){act.forEach(x=>{if(cnt[x[0].value]>=2)s.add(x[1])});return s}
  let bi=-1,bv=0;act.forEach(x=>{if(x[0].value>bv){bv=x[0].value;bi=x[1]}});if(bi>=0)s.add(bi);
  return s;
}
function prescore(){
  const dice=state.dice.slice(),combo=detectCombo(dice);
  const da=$('dice-area'),dr=da.getBoundingClientRect();
  const ghosts=[...da.querySelectorAll('.die')].map(el=>{
    const w=el.offsetWidth,h=el.offsetHeight;
    const cx=dr.left+da.clientLeft+el.offsetLeft+w/2,cy=dr.top+da.clientTop+el.offsetTop+h/2;

function partLabels(dc,dm,m0,dg){
  const o=[];

  if(dm>0.001){
    const ratio=m0>0?(m0+dm)/m0:0;
    const nice=ratio>0&&Math.abs(ratio*4-Math.round(ratio*4))<1e-6;
    o.push({c:'m',t:(!Number.isInteger(dm)&&nice||dm>3&&nice)?'×'+fmM(ratio)+' mult':'+'+fmM(dm)+' mult'});
  }
  if(dg>0)o.push({c:'g',t:'+'+dg+' '+L('gold','guld')});
  return o;
}

function postscore(pre,trace){
  const combo=pre.combo,tier=TIER[combo.key]||1,total=state.roundScore-pre.prevScore;
  const dCh=$('d-chips'),dM=$('d-mult'),dT=$('d-total'),sd=$('score-display');
  const fin={ch:dCh.textContent,m:dM.textContent,t:dT.textContent};

  pre.dice.forEach((d,i)=>{

      steps.push({ch:mc.chips,m:mc.mult,t:'mod',i,dc:mc.chips-c0,dm:mc.mult-m0,m0,dg:mc.gold-g0});
    }
  });
  ch=mc.chips;m=mc.mult;let relCh=0;
  trace.forEach(tr=>{ch+=tr.dc;m+=tr.dm;relCh+=tr.dc;steps.push({ch,m,t:'rel',tr,i:state.relics.indexOf(tr.r)})});
  const bossAdj=Math.abs(ch-finCh)>0.5||Math.abs(m-finM)>0.005;
  steps.push({ch:finCh,m:finM,t:'fin',boss:bossAdj});
  // 416 Poängtooltip med full uträkning
  const tip=L('Chips: hand ','Chips: hand ')+combo.chips+L(' + dice ',' + tärningar ')+pre.sum+L(' + mods ',' + mods ')+Math.round(modCh)+L(' + relics ',' + reliker ')+Math.round(relCh)+' = '+fin.ch+
    '\n'+L('Mult: ','Mult: ')+fmM(combo.mult)+' → '+fin.m+(bossAdj?L(' (boss)',' (boss)'):'')+'\n'+fin.ch+' × '+fin.m+' = '+fin.t;
  sd.title=tip;sd.setAttribute('role','img');sd.setAttribute('aria-label',combo.name[LANG]+': '+fin.ch+' × '+fin.m+' = '+fin.t);

  const banner=$('combo-banner').getBoundingClientRect(),bx=banner.left+banner.width/2,by=banner.top+banner.height/2;
  const bust=combo.key==='Högsta'||total<=0;
  const reduced=RM();
  const part=partIdx(pre.dice,combo);

  // 405 Tärningarna som ingår i kombon glöder, övriga dämpas (spökkopior eftersom brickan töms)
  if(!reduced&&pre.ghosts.length){
    pre.ghosts.forEach((g,i)=>{
      const cl=g.cl;cl.classList.add('b_gd',part.has(i)?'b_in':'b_out');
      cl.style.left=(g.cx-g.w/2)+'px';cl.style.top=(g.cy-g.h/2)+'px';cl.style.width=g.w+'px';cl.style.height=g.h+'px';
      if(g.tf&&g.tf!=='none')cl.style.transform=g.tf;
      cl.style.setProperty('--fy',Math.round(by-g.cy)+'px');
      document.body.appendChild(cl);setTimeout(()=>cl.remove(),1150);
    });
  }

  // 391 Poängsekvens: chips och mult räknas upp steg för steg
  seq.forEach(clearTimeout);seq=[];
  const show=(s,p)=>{
    if(s.t==='fin'){dCh.textContent=fin.ch;dM.textContent=fin.m;dT.textContent=fin.t}
    else{dCh.textContent=fmt(s.ch);dM.textContent=fmM(s.m);dT.textContent=fmt(Math.floor(s.ch*s.m))}
    if(!p||Math.round(p.ch)!==Math.round(s.ch))tickEl(dCh);
    if(!p||Math.abs(p.m-s.m)>0.004)tickEl(dM);
    tickEl(dT);
  };
  if(!reduced){
    show(steps[0],null);
    const iv=Math.max(70,Math.min(190,1150/steps.length));
    steps.forEach((s,k)=>{
      if(!k)return;
      seq.push(setTimeout(()=>{
        try{
          show(s,steps[k-1]);
          if(s.t==='rel')relicPop(s.i,s.tr);
          else if(s.t==='mod'){
            // 418 Tärningsmodar visar sitt bidrag vid poängsättningen
            const g=pre.ghosts[s.i];
            if(g)partLabels(s.dc,s.dm,s.m0,s.dg).forEach((l,j)=>flt(g.cx,g.cy-g.h/2-6-j*20,esc(l.t.replace(' chips','').replace(' mult','')),l.c,0));
          }else if(s.t==='fin'&&s.boss&&state.boss){
            flt(bx,banner.bottom+6,esc(state.boss.name[LANG]),'m',0);
          }
        }catch(e){}
      },k*iv));
    });
  }

  if(bust){

    sd.classList.remove('b_bustd');reflow(sd);sd.classList.add('b_bustd');setTimeout(()=>sd.classList.remove('b_bustd'),1700);
  }else if(!reduced){
    // 398 Färgade partiklar per kombotier
    pix(bx,by,TCOL[tier],6+tier*5,70+tier*18);

  // 400 Skakningsnivåer (engångs): ersätter originalets två nivåer
  const app=$('app');

    app.classList.remove('shake','shake-hard','b_sk1','b_sk2','b_sk3','b_sk4');reflow(app);
    const lv=total>=20000?4:total>=5000?3:total>=1000?2:1;
    app.classList.add('b_sk'+lv);setTimeout(()=>app.classList.remove('b_sk'+lv),760);
  }
  // 401 Kantblixt vid stora poäng
  if(!reduced&&total>=2000){
    const e=document.createElement('div');e.className='b_edge';
    e.style.setProperty('--e',total>=20000?'#ff5d52':total>=5000?'#f0c44a':'#1da1ff');
    document.body.appendChild(e);setTimeout(()=>e.remove(),800);
  }
  // 402 NEW BEST-markör (bästa enskilda hand)
  if(!bust&&pre.prevMax>0&&total>pre.prevMax){
    const old=sd.querySelector('.b_best');if(old)old.remove();
    const b=document.createElement('span');b.className='b_best';b.textContent=L('NEW BEST','NYTT REKORD');
    sd.appendChild(b);setTimeout(()=>b.remove(),2600);
  }
  // 417 Guld från tärningsmodar flyger till guldräknaren
  if(state.money>pre.prevMoney){
    const mr=$('s-money').getBoundingClientRect();
    flt(mr.left+mr.width/2,mr.bottom+4,ico('💰')+'+'+(state.money-pre.prevMoney),'g',reduced?0:300);
  }
}
const _score=scoreHand;
scoreHand=function(){
  let pre=null;
  try{if(state.phase==='playing'&&state.dice.length)pre=prescore()}catch(e){pre=null}
  const trace=[],saved=[],seen=new Set();let depth=0;
  if(pre){
    state.relics.forEach(r=>{
      if(typeof r.ef!=='function'||seen.has(r))return;seen.add(r);
      const o=r.ef;saved.push([r,o]);
      r.ef=function(ctx){
        const c0=ctx.chips,m0=ctx.mult,g0=ctx.gold||0;
        depth++;let res;
        try{res=o.apply(this,arguments)}finally{depth--}
        // bara det yttersta anropet räknas (t.ex. spegelreliker som anropar andra reliker)
        if(!depth)try{trace.push({r,dc:ctx.chips-c0,dm:ctx.mult-m0,m0,dg:(ctx.gold||0)-g0})}catch(e){}
        return res;
      };
    });
  }
  try{return _score.apply(this,arguments)}
  finally{
    for(let i=saved.length-1;i>=0;i--)saved[i][0].ef=saved[i][1];
    if(pre){try{postscore(pre,trace)}catch(e){}}
  }
};

window.addEventListener('keydown',e=>{
  if(state.phase!=='shop')return;
  const ov=$('overlay');if(!ov||!ov.classList.contains('active'))return;
  const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT')return;
  const cards=[...ov.querySelectorAll('.shop-item[tabindex]')];if(!cards.length)return;
  const a=document.activeElement;
  if(e.key==='Enter'){
    if(a&&cards.includes(a)){e.preventDefault();kbPos=cards.indexOf(a);a.click()}
    return;
  }
  if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;
  e.preventDefault();
  const cur=cards.indexOf(a);
  if(cur<0){(cards.find(c=>!c.classList.contains('c-poor'))||cards[0]).focus();return}
  let nx=cur;
  if(e.key==='ArrowRight')nx=Math.min(cards.length-1,cur+1);
  else if(e.key==='ArrowLeft')nx=Math.max(0,cur-1);
  else{
    const r0=cards[cur].getBoundingClientRect(),cy=r0.top+r0.height/2,cx=r0.left+r0.width/2,dir=e.key==='ArrowDown'?1:-1;
    let best=null;
    cards.forEach((c,i)=>{
      if(i===cur)return;const r=c.getBoundingClientRect();
      const dy=(r.top+r.height/2-cy)*dir;if(dy<12)return;
      const sc=[Math.round(dy/12),Math.abs(r.left+r.width/2-cx)];
      if(!best||sc[0]<best.sc[0]||(sc[0]===best.sc[0]&&sc[1]<best.sc[1]))best={i:i,sc:sc};
    });
    if(best)nx=best.i;
  }
  cards[nx].focus();
},true);

  if(state.difficulty==='hard')t=Math.floor(t*1.35);

}

  c=>{c.mult+=Math.min(15,Math.floor(money()/3));c.gold=(c.gold||0)+2});

/* ---------- Hookar (omslag, bryter inte originalbeteendet) ---------- */
const has=id=>state.relics.some(r=>r.id===id);

// Passiva kast/släng via befintlig refreshHandSize
const _refresh=refreshHandSize;
refreshHandSize=function(){
  _refresh.apply(this,arguments);
  if(has('d_slangpasen')) state.maxDiscards=Math.max(0,state.maxDiscards+1);
};

// Nollställ spårning vid ny runda/blind
const _startRun=startRun;
startRun=function(){state.d_played=[];state.d_rewind={};state.d_handNo=0;return _startRun.apply(this,arguments)};
const _startBlind=startBlind;
startBlind=function(){
  state.d_handNo=0;
  const r=_startBlind.apply(this,arguments);
  let ch=false;
  if(has('d_tandstickan')){state.rolls+=2;ch=true;log('🧨 +2 '+L('kast','rolls'),'#4d9fff')}
  if(has('d_bossbrytaren')&&state.blindIdx>=1){state.hands+=1;ch=true;log('🪓 +1 '+L('hand','hand'),'#4d9fff')}
  if(ch) render();
  return r;
};

// Håll koll på handnummer och spelade kombos
const _scoreHand=scoreHand;
scoreHand=function(){
  const before=state.hands,had=state.phase==='playing'&&state.dice.length;
  const key=had?detectCombo(state.dice).key:null;
  const r=_scoreHand.apply(this,arguments);
  if(had&&state.hands<before){
    state.d_handNo=(state.d_handNo||0)+1;
    state.d_played=state.d_played||[];
    if(!state.d_played.includes(key)) state.d_played.push(key);
  }
  return r;
};

// Tärningsomvandlare efter kast
const _acr=applyComboRelics;
applyComboRelics=function(idxs){
  _acr.apply(this,arguments);
  const D=state.dice;if(!idxs||!idxs.length||!D.length) return;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(has('d_ettorsmaltan')){
    const ones=idxs.filter(i=>D[i]&&D[i].value===1);
    if(ones.length){D[pick(ones)].value=6;log('🔆 '+L('Ettornas Smälta','Ones Melter'),'#4d9fff')}
  }
  if(has('d_alkemisten')){
    const free=idxs.filter(i=>D[i]&&!D[i].mod);
    if(free.length){D[pick(free)].mod=pick(['glödgad','förgiftad','guld']);log('⚗️ '+L('Alkemisten','The Alchemist'),'#4d9fff')}
  }
};

// Räntebonus efter vunnen blind
const _win=winBlind;
winBlind=function(){
  const bonus=has('d_rantemastaren')?Math.min(5,Math.floor(money()/4)):0;
  const r=_win.apply(this,arguments);
  if(bonus>0){
    state.money+=bonus;
    log('🏦 +'+bonus+'💰','#f5c542');
    try{
      const b=document.querySelector('#overlay .modal .buttons');
      if(b){const p=document.createElement('p');p.style.color='var(--gold)';p.textContent=L('Räntemästaren','Interest Master')+': +'+bonus;b.parentNode.insertBefore(p,b)}
    }catch(e){}
    render();
  }
  return r;
};

// Tidsspolningen: en extra hand när en blind förloras (en gång per ante)
const _lose=loseBlind;
loseBlind=function(){
  if(has('d_tidsspolningen')){
    state.d_rewind=state.d_rewind||{};
    if(!state.d_rewind[state.ante]&&state.phase==='playing'){
      state.d_rewind[state.ante]=true;
      state.hands=1;state.dice=[];state.held=new Set();
      state.rollsUsed=0;state.rerolledThisHand=0;state.noRerolls=true;state.rolls=state.maxRolls;
      log('⏪ '+L('Tidsspolningen: +1 hand','Rewind: +1 hand'),'#f5c542');
      render();rollDice(true);
      return;
    }
  }
  return _lose.apply(this,arguments);
};
})();

    if(!f.length){e.preventDefault();const m=o.querySelector('.modal');if(m)m.focus();return}
    const first=f[0],last=f[f.length-1],a=document.activeElement;

<script>
/* ===== PATCH H (js) ===== */
(function(){
/* Agent H: meta-progression, statistik, achievements, hjälp och delning */
const HK='h_dd_meta_v1';
const L=(sv,en)=>LANG==='sv'?sv:en;
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const num=(v,d)=>(typeof v==='number'&&isFinite(v))?v:d;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.floor(num(n,0)).toLocaleString();
const fmtTime=ms=>{const s=Math.floor(num(ms,0)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const cname=k=>COMBOS[k]?COMBOS[k].name[LANG]:String(k);

/* 599 Meta-laddaren tål tom, trasig eller gammal lagring (egen nyckel, allt i try/catch) */
function loadMeta(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(HK))}catch(e){d=null}
  if(!isObj(d)) d={};
  const hist=Array.isArray(d.hist)?d.hist.filter(isObj).slice(0,10):[];
  const best=Array.isArray(d.best)?d.best.filter(x=>isObj(x)&&typeof x.score==='number').slice(0,5):[];
  const daily={};
  if(isObj(d.daily)) Object.keys(d.daily).forEach(k=>{const v=d.daily[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&isObj(v)) daily[k]={score:num(v.score,0),ante:num(v.ante,0)}});
  return {hist,best,daily,tut:!!d.tut,tip:Math.max(0,Math.floor(num(d.tip,0))),last:isObj(d.last)?d.last:null};
}
let M=loadMeta();
function saveMeta(){try{localStorage.setItem(HK,JSON.stringify(M))}catch(e){}}

/* 571 Nya statistikfält med standardvärden och migrering av gammal sparad data */
const STAT_DEF={runs:0,bossKills:0,maxRelics:0,maxMoney:0,maxScore:0,glassBroken:0,maxDiceScored:0,noRerollWins:0,
  oneHandWins:0,comebacks:0,seenRelics:0,bestAnte:0,wins:0,fastestBlind:0,endlessAnte:0,perfectWins:0,maxLegendary:0,
  handsPlayed:0,totalScore:0,
  hMaxComboLevel:1,hGoldEarned:0,hOneShotClears:0,hFastestWin:0,hMaxRare:0,hSpectrum:0,hPlayMs:0};
function migrate(){
  if(!isObj(state.stats)) state.stats={};
  const s=state.stats;
  Object.keys(STAT_DEF).forEach(k=>{if(typeof s[k]!=='number'||!isFinite(s[k])) s[k]=STAT_DEF[k]});
  if(!isObj(s.combos)) s.combos={};
  if(!isObj(s.bossSeen)) s.bossSeen={};
  if(!isObj(state.achievements)) state.achievements={};
  ['bestAnte','bestScore','totalRuns','wins'].forEach(k=>{state[k]=num(state[k],0)});
}
window.h_migrate=migrate;
migrate();

/* 572 Tolv nya achievements: kombonivåer, ekonomi, relik-samlingar, snabba vinster, endless, alla kombos */
const H_ACH=[
  {id:'h_lv5',cat:'combo',icon:'📜',n:['Mästerhand','Hand Master'],d:['Höj en kombo till nivå 5','Raise a hand to level 5'],v:s=>s.stats.hMaxComboLevel,y:5},
  {id:'h_lv10',cat:'combo',icon:'👑',n:['Toppnivå','Max Level'],d:['Höj en kombo till nivå 10','Raise a hand to level 10'],v:s=>s.stats.hMaxComboLevel,y:10},
  {id:'h_allcombos',cat:'combo',icon:'🎲',n:['Hela Repertoaren','Full Repertoire'],d:['Spela alla 10 kombos minst en gång','Play all 10 hands at least once'],
    v:s=>COMBO_ORDER.filter(k=>(s.stats.combos&&s.stats.combos[k])>0).length,y:10},
  {id:'h_bank',cat:'economy',icon:'🪙',n:['Skattmästare','Treasurer'],d:['Tjäna 300 guld i belöningar totalt','Earn 300 gold in rewards overall'],v:s=>s.stats.hGoldEarned,y:300},
  {id:'h_rich250',cat:'economy',icon:'💰',n:['Drakens Skatt','Dragon Hoard'],d:['Ha 250 guld på en gång','Hold 250 gold at once'],v:s=>s.stats.maxMoney,y:250},
  {id:'h_spectrum',cat:'relics',icon:'🔮',n:['Hela Spektrat','Full Spectrum'],d:['Ha vanlig, ovanlig, sällsynt och legendarisk relik samtidigt','Hold a common, uncommon, rare and legendary relic at once'],v:s=>s.stats.hSpectrum,y:1},
  {id:'h_raretrio',cat:'relics',icon:'💎',n:['Sällsynt Trio','Rare Trio'],d:['Ha 3 sällsynta reliker samtidigt','Hold 3 rare relics at once'],v:s=>s.stats.hMaxRare,y:3},
  {id:'h_oneshot',cat:'skill',icon:'⚔️',n:['Ett Slag','One Blow'],d:['Klara en blind med bara en hand','Clear a blind using a single hand'],v:s=>s.stats.hOneShotClears,y:1},
  {id:'h_oneshot10',cat:'skill',icon:'🎯',n:['Prickskytt','Sharpshooter'],d:['Klara 10 blinds med en enda hand','Clear 10 blinds with a single hand'],v:s=>s.stats.hOneShotClears,y:10},
  {id:'h_fastwin',cat:'skill',icon:'⏱️',n:['Blixtseger','Lightning Win'],d:['Vinn en hel run på under 15 minuter','Win a whole run in under 15 minutes'],
    v:s=>s.stats.hFastestWin>0?1:0,y:1,chk:s=>s.stats.hFastestWin>0&&s.stats.hFastestWin<900000},
  {id:'h_endless15',cat:'progress',icon:'♾️',n:['Evighetsvandrare','Eternity Walker'],d:['Nå Ante 15 i Endless','Reach Ante 15 in Endless'],v:s=>s.stats.endlessAnte,y:15},
  {id:'h_marathon',cat:'progress',icon:'⌛',n:['Maraton','Marathon'],d:['Spela totalt en timme','Play one hour in total'],v:s=>s.stats.hPlayMs/60000,y:60},
];
H_ACH.forEach(a=>{
  if(ACHIEVEMENTS.some(x=>x.id===a.id)) return;
  ACHIEVEMENTS.push({id:a.id,name:{sv:a.n[0],en:a.n[1]},icon:a.icon,desc:{sv:a.d[0],en:a.d[1]},cat:a.cat,
    check:s=>{try{return a.chk?!!a.chk(s):num(a.v(s),0)>=a.y}catch(e){return false}}});
});
window.h_ACH=H_ACH;

/* 573 Kategorier för achievement-listan */
const CATS=['progress','combo','score','economy','relics','skill'];
const CAT_NAME={progress:['Framsteg','Progress'],combo:['Kombos','Hands'],score:['Poäng','Score'],economy:['Ekonomi','Economy'],relics:['Reliker','Relics'],skill:['Skicklighet','Skill']};
const CAT_OF={first_run:'progress',first_win:'progress',ante_3:'progress',ante_5:'progress',ante_8:'progress',endless_10:'progress',all_bosses:'progress',boss_slay:'progress',
  score_1k:'score',score_10k:'score',score_100k:'score',score_1m:'score',
  five_kind:'combo',straight_flush:'combo',flush_10:'combo',straight_20:'combo',all_dice_used:'combo',
  rich:'economy',hoarder:'economy',
  relic_10:'relics',relic_20:'relics',collector_50:'relics',collector_100:'relics',legendary_3:'relics',glass_break:'relics',
  no_reroll:'skill',one_hand:'skill',comeback:'skill',speedrun:'skill',perfectionist:'skill'};
const catOf=a=>a.cat||CAT_OF[a.id]||'progress';

/* 574 Framsteg x/y för achievements som går att mäta */
const PROG={ante_3:[s=>s.bestAnte,3],ante_5:[s=>s.bestAnte,5],ante_8:[s=>s.bestAnte,8],
  score_1k:[s=>s.bestScore,1000],score_10k:[s=>s.bestScore,10000],score_100k:[s=>s.bestScore,100000],score_1m:[s=>s.bestScore,1000000],
  relic_10:[s=>s.stats.maxRelics,10],relic_20:[s=>s.stats.maxRelics,20],glass_break:[s=>s.stats.glassBroken,10],
  flush_10:[s=>s.stats.combos['Färg'],10],straight_20:[s=>s.stats.combos['Stege'],20],boss_slay:[s=>s.stats.bossKills,5],
  rich:[s=>s.stats.maxMoney,100],hoarder:[s=>s.stats.maxMoney,500],all_dice_used:[s=>s.stats.maxDiceScored,7],
  collector_50:[s=>s.stats.seenRelics,50],collector_100:[s=>s.stats.seenRelics,100],legendary_3:[s=>s.stats.maxLegendary,3],
  endless_10:[s=>s.stats.endlessAnte,10],all_bosses:[s=>Object.keys(s.stats.bossSeen||{}).length,10]};
H_ACH.forEach(a=>{if(!a.chk) PROG[a.id]=[a.v,a.y]});
function progOf(a){
  const p=PROG[a.id];if(!p) return null;
  let v=0;try{v=num(p[0](state),0)}catch(e){}
  return {x:Math.min(Math.floor(v),p[1]),y:p[1]};
}
window.h_progOf=progOf;

/* ---------- Körning: spårning av run ---------- */
let R=null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dailySeed=()=>'D'+today().replace(/-/g,'');
window.h_dailySeed=dailySeed;
function newRun(){
  R={start:Date.now(),seed:state.seed,daily:(state.seed&&state.seed===dailySeed())?today():null,endless:!!state.endless,
    hands:[],blinds:[],total:0,done:false,res:'',maxAnte:1};
}
function maxLevel(){
  let m=1;
  try{Object.keys(state.comboLevels||{}).forEach(k=>{m=Math.max(m,num(state.comboLevels[k],1))})}catch(e){}
  return m;
}
function relicStats(){
  const c={common:0,uncommon:0,rare:0,legendary:0};
  (state.relics||[]).forEach(r=>{if(r&&c[r.r]!==undefined) c[r.r]++});
  const s=state.stats;
  s.hMaxRare=Math.max(s.hMaxRare,c.rare);
  if(c.common&&c.uncommon&&c.rare&&c.legendary) s.hSpectrum=1;
}
function onHand(c){
  if(!R) newRun();
  const e={score:num(c.score,0),combo:c.name,ante:state.ante};
  R.hands.push(e);R.total+=e.score;
  M.best.push({score:e.score,combo:e.combo,ante:e.ante,t:Date.now()});
  M.best.sort((a,b)=>b.score-a.score);M.best=M.best.slice(0,5);
  state.stats.hMaxComboLevel=Math.max(state.stats.hMaxComboLevel,maxLevel());
}
const _scoreHand=scoreHand;
scoreHand=function(){
  const n=state.comboHistory.length;
  const r=_scoreHand.apply(this,arguments);
  try{if(state.comboHistory.length>n) onHand(state.comboHistory[state.comboHistory.length-1])}catch(e){}
  return r;
};

const _winBlind=winBlind;
winBlind=function(){
  const m0=state.money,used=state.maxHands-state.hands;
  const r=_winBlind.apply(this,arguments);
  try{
    migrate();
    const s=state.stats;
    s.hGoldEarned+=Math.max(0,state.money-m0);
    if(used===1) s.hOneShotClears++;
    s.hMaxComboLevel=Math.max(s.hMaxComboLevel,maxLevel());
    relicStats();
    if(!R) newRun();
    R.maxAnte=Math.max(R.maxAnte,state.ante);
    R.blinds.push({ante:state.ante,idx:state.blindIdx,score:state.roundScore,target:state.target,ok:true});
    checkAchievements();saveMeta();
  }catch(e){}
  return r;
};

/* 597 Avbruten run (tillbaka till menyn eller ny run) sparas i historiken som avbruten */
function endRun(res){
  if(!R||R.done) return;
  R.done=true;R.res=res;
  if(!R.hands.length) return;
  const ms=Date.now()-R.start;
  R.ms=ms;
  const s=state.stats;
  s.hPlayMs+=ms;
  if(res==='won'&&(!s.hFastestWin||ms<s.hFastestWin)) s.hFastestWin=ms;
  const top=R.hands.slice().sort((a,b)=>b.score-a.score);
  const ante=res==='quit'?state.ante:Math.max(R.maxAnte,1);
  M.hist.unshift({t:Date.now(),ante,score:R.total,seed:R.seed||null,res,daily:R.daily,endless:R.endless,ms,
    top:top[0]?{combo:top[0].combo,score:top[0].score}:null});
  M.hist=M.hist.slice(0,10);
  /* 578 Dagens bästa resultat sparas per datum (de 30 senaste dagarna) */
  if(R.daily){
    const cur=M.daily[R.daily];
    if(!cur||R.total>cur.score) M.daily[R.daily]={score:R.total,ante};
    const keys=Object.keys(M.daily).sort();
    while(keys.length>30) delete M.daily[keys.shift()];
  }
  M.last={blinds:R.blinds.slice(-40),top:top.slice(0,5),total:R.total,ante,res,ms,seed:R.seed||null,daily:R.daily,
    relics:(state.relics||[]).length,boss:s.bossKills,money:state.money,hands:R.hands.length};
  try{checkAchievements()}catch(e){}
  saveMeta();
  try{Save.save(state)}catch(e){}
}

const _startRun=startRun;
startRun=function(opts){
  if(R&&!R.done&&R.hands.length) endRun('quit');
  const r=_startRun.apply(this,arguments);
  try{migrate();newRun()}catch(e){}
  return r;
};

const _loseBlind=loseBlind;
loseBlind=function(){
  const r=_loseBlind.apply(this,arguments);
  try{
    if(state.phase==='gameover'){
      if(!R) newRun();
      R.blinds.push({ante:state.ante,idx:state.blindIdx,score:state.roundScore,target:state.target,ok:false});
      R.maxAnte=Math.max(R.maxAnte,state.ante);
      endRun('lost');
      injectSummary();
    }
  }catch(e){}
  return r;
};

const _nextBlind=nextBlind;
nextBlind=function(){
  const w0=state.wins;
  const r=_nextBlind.apply(this,arguments);
  try{
    if(state.wins>w0){
      if(R) R.maxAnte=Math.max(R.maxAnte,state.ante-1);
      endRun('won');
      injectSummary();   // 598 Run summary visas även vid seger
    }
  }catch(e){}
  return r;
};

const _showMainMenu=showMainMenu;
showMainMenu=function(){
  try{if(R&&!R.done&&R.hands.length) endRun('quit')}catch(e){}
  const r=_showMainMenu.apply(this,arguments);
  try{decorateMenu()}catch(e){}
  return r;
};

/* ---------- Kopiera & dela ---------- */
function resultText(o){
  const top=o.top&&o.top[0]?`${cname(o.top[0].combo)} ${fmt(o.top[0].score)}`:'-';
  const res=o.res==='won'?L('Seger','Victory'):o.res==='lost'?L('Förlust','Defeat'):L('Avbruten','Abandoned');
  return `Dungeon Dice | ${res} | Ante ${o.ante} | ${L('Poäng','Score')} ${fmt(o.total)} | ${L('Bästa hand','Best hand')}: ${top} | ${L('Tid','Time')} ${fmtTime(o.ms)}`+
    (o.seed?` | Seed: ${o.seed}`:'')+(o.daily?` | Daily ${o.daily}`:'');
}
/* 579 Kopiera resultat: clipboard i klicket, fel fångas, fallback markerar texten */
function copyText(text){
  const st=document.getElementById('h-copy-status');
  const say=m=>{if(st) st.textContent=m};
  const fb=()=>{
    try{
      let ta=document.getElementById('h-copy-fb');
      if(!ta){ta=document.createElement('textarea');ta.id='h-copy-fb';ta.className='h-copyfb';ta.readOnly=true;ta.rows=2;
        const host=st&&st.parentNode?st.parentNode:document.getElementById('overlay');host.appendChild(ta)}
      ta.value=text;ta.focus();ta.select();
      let ok=false;try{ok=document.execCommand('copy')}catch(e){}
      say(ok?L('Kopierat!','Copied!'):L('Markerad: tryck Ctrl+C','Selected: press Ctrl+C'));
    }catch(e){say(L('Kunde inte kopiera','Could not copy'))}
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>say(L('Kopierat!','Copied!')),fb);
      return;
    }
  }catch(e){}
  fb();
}
window.h_copyResult=function(){
  const o=M.last||{ante:state.ante,total:R?R.total:0,res:'quit',ms:R?Date.now()-R.start:0,seed:state.seed,top:null};
  copyText(resultText(o));
};
/* 600 Klick på seed-märket i HUD kopierar seeden */
window.h_copySeed=function(){ if(state.seed) copyText(String(state.seed)); };

/* 580 Seed (och dagligt märke) i HUD under rundinfo */
const _render=render;
render=function(){
  const r=_render.apply(this,arguments);
  try{
    let el=document.getElementById('h-seed');
    if(!el){
      const host=document.getElementById('round-info');
      if(host){el=document.createElement('button');el.id='h-seed';el.type='button';el.className='h-seedtag';el.onclick=window.h_copySeed;host.appendChild(el)}
    }
    if(el){
      const sd=state.seed?String(state.seed):'';
      const txt=sd?('Seed '+sd+(R&&R.daily?' ★':'')):'';
      if(el.textContent!==txt){el.textContent=txt;el.style.display=sd?'':'none';el.title=L('Klicka för att kopiera seed','Click to copy seed')}
    }
  }catch(e){}
  return r;
};

/* 587, 588 Roterande tips (sparat index) på menyn och på slutskärmen */
function tipHTML(){
  const t=TIPS[M.tip%TIPS.length];M.tip=(M.tip+1)%TIPS.length;saveMeta();
  return `<div class="h-tip"><b>${L('Tips','Tip')}</b> ${esc(L(t[0],t[1]))}</div>`;
