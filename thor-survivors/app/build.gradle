plugins {
    id 'com.android.application'
}

android {
    namespace 'se.felixarvid.thorsurvivors'
    compileSdk 35

    defaultConfig {
        applicationId 'se.felixarvid.thorsurvivors'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // keep the audio uncompressed in the APK so SoundPool/MediaPlayer can map it directly
    androidResources {
        noCompress 'ogg', 'wav'
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric (screenshot tests) reads merged resources/assets via this
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // Test-only: the Android SDK's org.json is a stub on the JVM.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Screenshot tests: Robolectric native graphics rasterises android.graphics.Canvas on the JVM.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
