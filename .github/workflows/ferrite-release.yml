name: ferrite-release

# Builds Ferrite's Linux packages and publishes them as a GitHub release
# tagged ferrite-v<version> (version from browser/Cargo.toml). Run it by
# pushing such a tag, or manually with publish=true (creates the tag on the
# commit it runs on). A manual run with publish=false only uploads artifacts.

on:
  push:
    tags:
      - "ferrite-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (tag ferrite-v<version>)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config librsvg2-bin \
            libgtk-3-dev libx11-dev libnss3 libgbm1 libasound2t64

      - name: Version
        id: version
        run: |
          VERSION="$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)"
          echo "tag=ferrite-v${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "ferrite-v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${VERSION}"; exit 1
          fi

      - name: Install CEF
        run: scripts/setup-cef.sh

      - name: Test
        run: CEF_PATH=$HOME/.local/share/cef cargo test --release --workspace

      - name: Package (.deb and AppImage)
        run: |
          export CEF_PATH=$HOME/.local/share/cef
          cargo build --release
          scripts/package.sh
          cd dist && sha256sum ferrite_*_amd64.deb Ferrite-*-x86_64.AppImage > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ferrite ${{ steps.version.outputs.tag }}
          body_path: browser/packaging/RELEASE_NOTES.md
          files: |
            browser/dist/ferrite_*_amd64.deb
            browser/dist/Ferrite-*-x86_64.AppImage
            browser/dist/SHA256SUMS

      - name: Keep packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-packages
          path: |
            browser/dist/ferrite_*_amd64.deb
            browser/dist/Ferrite-*-x86_64.AppImage
            browser/dist/SHA256SUMS
