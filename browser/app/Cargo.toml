[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferrite: a desktop web browser written in Rust on top of Chromium (CEF)."

[[bin]]
name = "ferrite"
path = "src/main.rs"

[dependencies]
ferrite-core = { path = "../core" }
# The CEF version is pinned exactly: every bump of this line is an engine
# (Chromium) update, see docs/ENGINE_UPDATES.md.
cef = { version = "=156.4.0", default-features = false, features = ["sandbox"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
libc = "0.2"
arboard = "3"
