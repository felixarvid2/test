[package]
name = "ferrite-android"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ad blocking engine (Brave's adblock-rust) for Ferrite for Android, exposed over JNI."
publish = false

# Not part of the desktop workspace (browser/Cargo.toml excludes it too).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same engine and features as the desktop core (core/Cargo.toml).
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "0.21"
serde_json = "1"
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
