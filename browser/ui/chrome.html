<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>Ferrite</title>
<link rel="stylesheet" href="ferrite://app/common.css">
<link rel="stylesheet" href="ferrite://app/chrome.css">
</head>
<body>
<div id="tabstrip">
  <div id="tabs" role="tablist"></div>
  <button id="newtab" class="tb" title="New tab (Ctrl+T)" aria-label="New tab">
    <svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg>
  </button>
  <div id="private-badge" hidden>Private</div>
</div>
<div id="toolbar">
  <button id="back" class="tb" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
  <button id="forward" class="tb" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
  <button id="reload" class="tb" title="Reload (Ctrl+R)" aria-label="Reload">
    <svg class="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
    <svg class="i-stop" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
  </button>
  <button id="home" class="tb" title="Home" aria-label="Home"><svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-4V9.5h-3V13h-4z"/></svg></button>
  <div id="omnibox">
    <span id="security" title=""></span>
    <input id="address" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    <span id="zoom" hidden></span>
    <button id="star" class="tb small" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark"><svg viewBox="0 0 16 16"><path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/></svg></button>
  </div>
  <button id="downloads" class="tb" title="Downloads (Ctrl+J)" aria-label="Downloads">
    <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
    <span id="dl-badge" hidden></span>
  </button>
  <button id="menu" class="tb" title="Menu" aria-label="Menu"><svg viewBox="0 0 16 16"><circle cx="8" cy="3.5" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="8" cy="12.5" r="1.2"/></svg></button>
  <div id="progress"></div>
</div>
<div id="suggest" hidden></div>
<div id="bookmarks" hidden></div>
<div id="findbar" hidden>
  <input id="find-input" placeholder="Find in page" spellcheck="false">
  <span id="find-count"></span>
  <button id="find-prev" class="tb small" title="Previous (Shift+Enter)"><svg viewBox="0 0 16 16"><path d="m4 10 4-4 4 4"/></svg></button>
  <button id="find-next" class="tb small" title="Next (Enter)"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button>
  <button id="find-close" class="tb small" title="Close (Esc)"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
</div>
<div id="prompts"></div>
<div id="crashbar" hidden>This page crashed. <button class="btn" id="crash-reload">Reload</button></div>
<div id="toast" hidden></div>
<script src="ferrite://app/chrome.js"></script>
</body>
</html>
