<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>History</title>
<link rel="icon" href="ferrite://app/icon.svg">
<link rel="stylesheet" href="ferrite://app/common.css">
<script src="ferrite://app/common.js"></script>
</head>
<body>
<div class="page">
  <h1>History</h1>

  </div>
  <div id="list"></div>
</div>
