<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>Bookmarks</title>
<link rel="icon" href="ferrite://app/icon.svg">
<link rel="stylesheet" href="ferrite://app/common.css">
<script src="ferrite://app/common.js"></script>
</head>
<body>
<div class="page">
  <h1>Bookmarks</h1>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search bookmarks">
    <button class="btn" id="addfolder">New folder</button>
    <button class="btn" id="addbm">Add bookmark</button>
  </div>
  <div id="tree"></div>
</div>
<style>
  .folder > .row { font-weight: 600; }
  .children { margin-left: 22px; border-left: 1px solid var(--border); }
  .row[draggable] { cursor: grab; }
  .row.drop { box-shadow: inset 0 2px 0 var(--accent); }
</style>
<script src="ferrite://app/bookmarks.js"></script>
</body></html>
