[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-independent logic for the Ferrite browser: storage, omnibox, sessions, settings."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite.workspace = true
url.workspace = true
percent-encoding.workspace = true
dirs.workspace = true
# Brave's content blocker (MPL-2.0); without the single-thread feature the
# engine is Send + Sync, so the IO thread can check requests directly.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
ureq = { version = "3", features = ["platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true
