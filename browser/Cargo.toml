[workspace]
resolver = "2"
members = ["core", "app"]
exclude = ["android/rust"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
url = "2.5"
percent-encoding = "2.3"
dirs = "7"
tempfile = "3"

[profile.release]
debug = 1
